<!doctype html>
<html lang="vi" class="sl-root">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Slide cưới · Mãi mãi về sau</title>
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" type="image/png" href="/assets/icons/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <!-- themes.css: font tự host (TheHamstter) + lớp của <x-button>. Slide vẽ bằng canvas nên
         mẫu không có CSS riêng — chỉ cần font đã khai để canvas dùng. -->
    <link rel="stylesheet" href="/styles/themes.css" />
    <link rel="stylesheet" href="/slide-cuoi/runtime/slide-runtime.css" />
    <script src="https://unpkg.com/lucide@1.26.0/dist/umd/lucide.min.js" integrity="sha384-8/6sFI5UzGbr1Dgef7WSZvE4UemcVc/jyaQNsM+MilmnHQ9sce/pRv86XXj5Cg5m" crossorigin="anonymous"></script>
    <script src="/core/x-button.js"></script>
    <script src="/core/helpers/no-zoom.js"></script>
    <script src="/core/helpers/no-inspect.js"></script>
  </head>

  <!-- Slide sân khấu 16:9 tông hồng: cảnh khai trong index.js, runtime vẽ lên canvas trong #sl-stage. -->
  <body>
    <div id="sl-backdrop"></div>
    <div id="sl-stage"></div>

    <script src="/core/config.js"></script>
    <script src="/core/utils.js"></script>
    <!-- Dữ liệu mẫu khi chưa chọn thiệp (cxPreviewWedding) — dùng chung với bản xem thử mẫu thiệp. -->
    <script src="/public/themes/preview-data.js"></script>
    <script src="/slide-cuoi/engine/slide-engine.js"></script>
    <script src="/slide-cuoi/vendor/mp4-muxer.js"></script>
    <script src="/slide-cuoi/engine/slide-export.js"></script>
    <script src="index.js"></script>
    <!-- Chạy slide. Phải nạp SAU index.js. -->
    <script src="/slide-cuoi/runtime/slide-runtime.js"></script>
  </body>
</html>
