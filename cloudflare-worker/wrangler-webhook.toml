name = "payos-webhook-proxy"
main = "payos-webhook-proxy.js"
compatibility_date = "2024-01-01"

# Đích production. Mã KHÔNG có giá trị mặc định: thiếu biến này thì worker trả 500
# chứ không lặng lẽ trỏ đi đâu đó. Giữ khớp bố cục với wrangler-webhook-staging.toml
# để so hai bên bằng mắt.
#
# SUPABASE_ANON_KEY KHÔNG bắt buộc — payos-webhook deploy với --no-verify-jwt
# (xem danh sách NO_VERIFY trong scripts/deploy-functions.sh) nên gateway không đòi
# JWT. Vẫn khai để hai worker cùng một bộ biến.
[vars]
SUPABASE_FUNCTION_URL = "https://lcobawmkywtxhpezndsh.supabase.co/functions/v1/payos-webhook"

# Anon key của project production. Không phải bí mật (nó nằm công khai trong
# core/config.js) nên để thẳng ở đây được.
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxjb2Jhd21reXd0eGhwZXpuZHNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4OTA5ODMsImV4cCI6MjA5MTQ2Njk4M30.4BNmxnfixXdHOq0ovtaF_4wQZ9sap3IWbJNJK9H4Mg4"

# Deploy command:
# wrangler deploy --config wrangler-webhook.toml

# ── Log về Axiom ─────────────────────────────────────────────────────────────
# Nên có: đây là nguồn log DUY NHẤT khi worker không với tới được Supabase —
# lúc đó không Edge Function nào chạy để tự ghi log. Thiếu cấu hình thì worker
# vẫn chạy bình thường, chỉ không đẩy log (no-op).
#
# LƯU Ý: secret của Cloudflare TÁCH BIỆT hoàn toàn với secret của Supabase.
# AXIOM_TOKEN đã đặt trong Supabase (cho _shared/axiom.ts) KHÔNG dùng lại được ở
# đây — phải đặt riêng bên Cloudflare.
#
# 1) Tên dataset không phải bí mật → khai báo thẳng ở đây (bỏ comment, điền tên
#    dataset đang dùng cho Edge Function):
# [vars]
# AXIOM_DATASET = "ten-dataset-cua-ban"
#
# 2) Token là bí mật → đặt qua secret:
# wrangler secret put AXIOM_TOKEN --config wrangler-webhook.toml

# After deploy, use the Cloudflare Worker URL as webhook:
# https://payos-webhook-proxy.YOUR_SUBDOMAIN.workers.dev
