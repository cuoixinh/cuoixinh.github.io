name = "payos-webhook-proxy"
main = "payos-webhook-proxy.js"
compatibility_date = "2024-01-01"

# Đích production. Mã KHÔNG có giá trị mặc định: thiếu biến này thì worker trả 500
# chứ không lặng lẽ trỏ đi đâu đó. Giữ khớp bố cục với wrangler-webhook-staging.toml
# để so hai bên bằng mắt.
#
# SUPABASE_ANON_KEY KHÔNG bắt buộc — payos-webhook deploy với --no-verify-jwt
# (xem danh sách NO_VERIFY trong scripts/deploy-functions.sh) nên gateway không đòi
# JWT. Vẫn khai để hai worker cùng một bộ biến.
[vars]
SUPABASE_FUNCTION_URL = "https://lcobawmkywtxhpezndsh.supabase.co/functions/v1/payos-webhook"

# Anon key của project production. Không phải bí mật (nó nằm công khai trong
# core/config.js) nên để thẳng ở đây được.
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxjb2Jhd21reXd0eGhwZXpuZHNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4OTA5ODMsImV4cCI6MjA5MTQ2Njk4M30.4BNmxnfixXdHOq0ovtaF_4wQZ9sap3IWbJNJK9H4Mg4"

# Dataset Axiom — CÙNG dataset với các Edge Function của project này, để lúc truy
# một đơn hỏng thì log của worker và log của payos-webhook nằm chung một chỗ.
# Tên dataset không phải bí mật nên khai thẳng; TOKEN thì đặt bằng secret:
#   wrangler secret put AXIOM_TOKEN --config <file này>
#
# Kho secret của Cloudflare TÁCH BIỆT với kho của Supabase: worker không nhìn thấy
# AXIOM_TOKEN đã đặt bên Supabase, nên phải đặt lại ở đây. Giá trị token thì dùng
# chung được — Axiom không phân biệt ai gửi; chỉ là Dashboard không cho xem lại
# chuỗi cũ, nên không còn giữ thì tạo token mới trong Axiom (một dataset nhận được
# nhiều token, không ảnh hưởng token đang chạy ở Supabase).
#
# Thiếu token hoặc dataset thì axiomLog() thoát ngay, worker vẫn chạy bình thường
# nhưng không ghi gì — mà đây là nguồn log DUY NHẤT khi worker không với tới được
# Supabase, vì lúc đó không Edge Function nào chạy để tự ghi.
AXIOM_DATASET = "cuoixinh-backend"

# Deploy:
#   npm run deploy:workers -- webhook
#
# URL này là Webhook URL khai trong PayOS, kênh 1:
# https://payos-webhook-proxy.cuoixinh-api.workers.dev
