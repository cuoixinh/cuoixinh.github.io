<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages SPA redirect
      // Lưu path vào sessionStorage và redirect về template1.html
      const path = window.location.pathname;

      if (path && path !== "/" && !path.includes(".")) {
        const slug = path
          .split("/")
          .filter((p) => p)
          .pop();
        // Lưu path gốc để script.js restore URL sau
        sessionStorage.setItem("redirect", path);
        sessionStorage.setItem("search", window.location.search);
        // Redirect sang router để xác định đúng theme
        window.location.replace(
          window.location.origin +
            "/router.html?slug=" +
            slug +
            (window.location.search
              ? "&search=" + encodeURIComponent(window.location.search)
              : ""),
        );
      } else {
        window.location.replace(window.location.origin + "/");
      }
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
