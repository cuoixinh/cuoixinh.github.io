<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Cưới Xinh</title>
    <!-- Nạp TRƯỚC script dưới: trang này không qua loader nào nên phải tự lấy
         CONFIG. Đường dẫn tuyệt đối vì router chạy ở path bất kỳ (/<slug>). -->
    <script src="/core/config.js"></script>
    <script>
      // Router hỗ trợ clean URLs cho tất cả pages
      const path = window.location.pathname
        .replace(/^\//, "")
        .replace(/\/$/, "");
      const params = new URLSearchParams(window.location.search);

      // Routing rules. "account" là đường dẫn CŨ của trang quản lý thiệp — giữ lại
      // để link đã chia sẻ không chết; /my-invitations/ là thư mục thật nên không
      // cần khai ở đây (host phục vụ thẳng). Trang nào chỉ chạy local thì KHÔNG
      // khai route — xem docs/deploy-cloudflare-pages.md §6.
      const routes = {
        manage: "/invitation-setup/",
        account: "/my-invitations/",
        customer: "/invitation-setup/",
      };

      // Check if it's a predefined route
      if (routes[path]) {
        // Preserve query params (e.g., ?id=xxx for manage)
        const queryString = window.location.search;
        window.location.replace(routes[path] + queryString);
      }
      // Otherwise, treat as wedding slug
      else {
        const slug = params.get("slug") || path;

        if (!slug) {
          window.location.replace("/");
        }
        // config.js tải hỏng thì không có CONFIG, mà cả nhánh dưới sống nhờ nó:
        // thiếu chốt này thì MỌI link thiệp chết trắng thay vì lùi về trang chủ.
        else if (typeof CONFIG === "undefined") {
          window.location.replace("/");
        } else {
          // Lấy đích từ CONFIG, KHÔNG viết cứng: bản staging do build nối
          // core/config.staging.js vào cuối config.js, viết cứng ở đây là
          // staging đọc dữ liệu của production mà không có gì báo.
          // Worker cache là đường nhanh; thiếu nó (staging) thì gọi thẳng Edge.
          const API_BASE =
            CONFIG.cloudflare.cacheProxy || CONFIG.supabase.edgeUrl;
          const ANON_KEY = CONFIG.supabase.anonKey;
          const extra = params.get("search") || "";

          fetch(`${API_BASE}?slug=${slug}`, {
            headers: { Authorization: `Bearer ${ANON_KEY}` },
          })
            // Đọc body cả khi lỗi: 403 TRIAL_EXPIRED cũng kèm theme, cần nó
            // để biết đưa sang trang thiệp nào.
            .then((r) =>
              r
                .json()
                .then((d) => ({ ok: r.ok, data: d }))
                .catch(() => ({ ok: r.ok, data: null })),
            )
            .then(({ ok, data }) => {
              // Hết hạn dùng thử KHÔNG phải lỗi: vẫn đưa sang trang thiệp, ở đó
              // wedding-helper hiện màn khoá. Đá về trang chủ thì khách mời (và
              // cả chủ thiệp) không hiểu vì sao link chết.
              const expired = !ok && data && data.code === "TRIAL_EXPIRED";
              if (!data || (!ok && !expired)) {
                window.location.replace("/");
                return;
              }
              if (!expired && data.is_published === false) {
                const msg = document.getElementById("msg");
                if (msg) {
                  msg.textContent = "💍 Thiệp chưa được xuất bản. Vui lòng liên hệ cô dâu chú rể để xem thiệp.";
                  msg.style.opacity = "1";
                }
                setTimeout(() => window.location.replace("/"), 2500);
                return;
              }
              const theme = data.theme || "basic-gold";
              const extraSearch = extra || "";
              const themeSearch = extraSearch
                ? `${extraSearch}&slug=${slug}`
                : `?slug=${slug}`;
              window.location.replace(
                `/public/themes/${theme}/${themeSearch}`,
              );
            })
            .catch(() => window.location.replace("/"));
        }
      }
    </script>
  </head>
  <body style="margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#fff8f8;font-family:sans-serif">
    <p id="msg" style="opacity:0;transition:opacity 0.3s;color:#be123c;font-size:15px;text-align:center;padding:24px;max-width:320px;background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,0.08)"></p>
  </body>
</html>
