<!-- Tab Content: Templates -->
<div id="content-templates" class="hidden">
  <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
    <!-- Toolbar -->
    <div
      class="p-3 sm:p-4 md:p-6 border-b border-gray-100 flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3"
    >
      <h2 class="text-base sm:text-lg font-semibold text-gray-800">
        Quản lý Templates
      </h2>
      <div class="flex gap-2 flex-wrap">
        <button
          id="purge-cache-btn"
          onclick="purgeTemplatesCache()"
          class="flex-1 sm:flex-none px-4 sm:px-6 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg text-sm font-medium transition-colors flex items-center justify-center gap-2"
          title="Xóa cache Cloudflare"
        >
          <i class="fas fa-sync"></i>
          <span class="hidden sm:inline">Xóa Cache</span>
        </button>
        <button
          id="scan-images-btn"
          onclick="startScanImages()"
          disabled
          class="flex-1 sm:flex-none px-4 sm:px-6 py-2 bg-violet-500 hover:bg-violet-600 text-white rounded-lg text-sm font-medium transition-colors flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed"
          title="Tick chọn template trong danh sách rồi bấm scan"
        >
          <i class="fas fa-camera"></i>
          <span class="hidden sm:inline">Scan Image IFrame</span
          ><span class="sm:hidden">Scan</span>
        </button>
        <button
          onclick="openTemplateModal()"
          class="flex-1 sm:flex-none px-4 sm:px-6 py-2 bg-rose-400 hover:bg-rose-500 text-white rounded-lg text-sm font-medium transition-colors flex items-center justify-center gap-2"
        >
          <i class="fas fa-plus"></i>
          <span class="hidden sm:inline">Thêm Template</span
          ><span class="sm:hidden">Thêm</span>
        </button>
      </div>
    </div>

    <!-- Templates Table -->
    <div class="p-3 sm:p-4 md:p-6 overflow-x-auto">
      <table class="w-full min-w-[800px] lg:min-w-0">
        <thead>
          <tr class="border-b border-gray-200">
            <th class="py-3 px-4 w-10 text-left">
              <input type="checkbox" id="tpl-scan-all"
                class="w-3.5 h-3.5 accent-violet-500 cursor-pointer"
                onchange="document.querySelectorAll('input[name=tpl-scan]').forEach(cb=>cb.checked=this.checked);updateScanBtn()" />
            </th>
            <th class="text-left py-3 px-4 text-sm font-medium text-gray-700">
              Tên hiển thị
            </th>
            <th class="text-left py-3 px-4 text-sm font-medium text-gray-700">
              Template Name
            </th>
            <th class="text-left py-3 px-4 text-sm font-medium text-gray-700">
              Danh mục
            </th>
            <th class="text-left py-3 px-4 text-sm font-medium text-gray-700">
              Trạng thái
            </th>
            <th class="text-left py-3 px-4 text-sm font-medium text-gray-700">
              Kích hoạt
            </th>
            <th class="text-left py-3 px-4 text-sm font-medium text-gray-700">
              Thứ tự
            </th>
            <th class="text-left py-3 px-4 text-sm font-medium text-gray-700">
              Thao tác
            </th>
          </tr>
        </thead>
        <tbody id="template-list">
          <tr>
            <td colspan="8" class="text-center py-8 text-gray-400">
              Đang tải...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal: Add/Edit Template -->
<div
  id="modal-template"
  class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 overflow-y-auto p-4"
>
  <div class="bg-white rounded-2xl p-4 sm:p-6 w-full max-w-2xl my-8">
    <h3
      class="text-base sm:text-lg font-semibold text-gray-800 mb-4"
      id="template-modal-title"
    >
      Thêm Template
    </h3>

    <div
      class="space-y-3 sm:space-y-4 max-h-[60vh] sm:max-h-[70vh] overflow-y-auto pr-2"
    >
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1"
          >Template Name (file) *</label
        >
        <input
          id="template-name"
          type="text"
          placeholder="template1, template2..."
          class="w-full px-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-rose-300"
        />
        <p class="text-xs text-gray-500 mt-1">
          <i class="fas fa-info-circle"></i> Tên file template trong thư mục
          public/themes/ (dùng làm ID duy nhất)
        </p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1"
          >Tên hiển thị *</label
        >
        <input
          id="template-display-name"
          type="text"
          placeholder="Classic Elegance"
          class="w-full px-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-rose-300"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1"
          >Mô tả</label
        >
        <textarea
          id="template-description"
          rows="2"
          placeholder="Thiết kế sang trọng, cổ điển..."
          class="w-full px-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-rose-300"
        ></textarea>
      </div>

      <div></div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1"
          >Preview URL</label
        >
        <input
          id="template-preview-url"
          type="text"
          placeholder="Tự động tạo từ Template Name"
          class="w-full px-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-rose-300 bg-gray-50"
          readonly
        />
        <p class="text-xs text-gray-500 mt-1">
          <i class="fas fa-info-circle"></i> Tự động:
          public/themes/{template_name}.html?preview=true
        </p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2"
          >Features</label
        >
        <div class="grid grid-cols-2 gap-2">
          <label
            class="flex items-center gap-2 p-2 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer"
          >
            <input
              type="checkbox"
              value="gallery"
              class="feature-checkbox w-4 h-4 text-rose-500 border-gray-300 rounded focus:ring-rose-500"
            />
            <span class="text-sm text-gray-700">Gallery</span>
          </label>
          <label
            class="flex items-center gap-2 p-2 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer"
          >
            <input
              type="checkbox"
              value="map"
              class="feature-checkbox w-4 h-4 text-rose-500 border-gray-300 rounded focus:ring-rose-500"
            />
            <span class="text-sm text-gray-700">Map</span>
          </label>
          <label
            class="flex items-center gap-2 p-2 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer"
          >
            <input
              type="checkbox"
              value="qrcode"
              class="feature-checkbox w-4 h-4 text-rose-500 border-gray-300 rounded focus:ring-rose-500"
            />
            <span class="text-sm text-gray-700">QR Code</span>
          </label>
          <label
            class="flex items-center gap-2 p-2 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer"
          >
            <input
              type="checkbox"
              value="rsvp"
              class="feature-checkbox w-4 h-4 text-rose-500 border-gray-300 rounded focus:ring-rose-500"
            />
            <span class="text-sm text-gray-700">RSVP</span>
          </label>
          <label
            class="flex items-center gap-2 p-2 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer"
          >
            <input
              type="checkbox"
              value="countdown"
              class="feature-checkbox w-4 h-4 text-rose-500 border-gray-300 rounded focus:ring-rose-500"
            />
            <span class="text-sm text-gray-700">Countdown</span>
          </label>
          <label
            class="flex items-center gap-2 p-2 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer"
          >
            <input
              type="checkbox"
              value="music"
              class="feature-checkbox w-4 h-4 text-rose-500 border-gray-300 rounded focus:ring-rose-500"
            />
            <span class="text-sm text-gray-700">Music</span>
          </label>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Danh mục</label
          >
          <select
            id="template-category"
            class="w-full px-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-rose-300"
          >
            <option value="traditional">Traditional</option>
            <option value="modern">Modern</option>
            <option value="luxury">Luxury</option>
            <option value="minimal">Minimal</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Trạng thái</label
          >
          <select
            id="template-status"
            class="w-full px-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-rose-300"
          >
            <option value="active">Active</option>
            <option value="coming_soon">Coming Soon</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1"
          >Thứ tự hiển thị</label
        >
        <input
          id="template-sort-order"
          type="number"
          value="0"
          class="w-full px-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-rose-300"
        />
        <p class="text-xs text-gray-500 mt-1">
          <i class="fas fa-info-circle"></i> Số nhỏ hiển thị trước
        </p>
      </div>

      <div class="flex items-center gap-2 p-3 bg-gray-50 rounded-lg">
        <input
          id="template-is-active"
          type="checkbox"
          checked
          class="w-4 h-4 text-rose-500 border-gray-300 rounded focus:ring-rose-500"
        />
        <label
          for="template-is-active"
          class="text-sm text-gray-700 font-medium"
          >Kích hoạt template</label
        >
      </div>
    </div>

    <div class="flex gap-3 mt-6">
      <button
        onclick="closeTemplateModal()"
        class="flex-1 px-4 py-2 border border-gray-200 rounded-lg text-sm hover:bg-gray-50"
      >
        Hủy
      </button>
      <button
        onclick="saveTemplate()"
        class="flex-1 px-4 py-2 bg-rose-400 hover:bg-rose-500 text-white rounded-lg text-sm"
      >
        Lưu
      </button>
    </div>
  </div>
</div>

<!-- Modal: Scan Log -->
<div id="modal-scan" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
  <div class="bg-white rounded-2xl p-6 w-full max-w-lg shadow-2xl">
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-base font-semibold text-gray-800 flex items-center gap-2">
        <i class="fas fa-camera text-violet-500"></i> Scan Image IFrame
      </h3>
      <button id="scan-close-btn" onclick="closeScanModal()"
        class="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
    </div>
    <div id="scan-log"
      class="bg-gray-950 text-green-400 font-mono text-xs rounded-xl p-3 h-56 overflow-y-auto space-y-0.5 mb-4"></div>
    <div id="scan-done-bar" class="hidden mb-4 flex items-center gap-3">
      <div class="flex-1 h-1.5 bg-gray-100 rounded-full overflow-hidden">
        <div id="scan-progress-fill" class="h-full bg-violet-500 transition-all duration-500" style="width:0%"></div>
      </div>
      <span id="scan-done-label" class="text-xs text-gray-500 whitespace-nowrap"></span>
    </div>
    <!-- "Vẫn lưu" chỉ hiện ở nhánh báo scan server chưa bật (showScanServerHelp),
         lúc scan chạy bình thường thì ẩn. -->
    <div class="flex justify-end gap-2">
      <button id="scan-continue-btn" onclick="scanHelpContinue()"
        class="hidden px-4 py-2 bg-rose-400 hover:bg-rose-500 text-white rounded-lg text-sm">Vẫn lưu, bỏ scan</button>
      <button id="scan-dismiss-btn" onclick="closeScanModal()" class="px-4 py-2 border border-gray-200 rounded-lg text-sm hover:bg-gray-50">Đóng</button>
    </div>
  </div>
</div>
