<!-- Tab Content: Weddings -->
<div id="content-weddings" class="hidden">
  <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
    <!-- Search bar -->
    <div class="p-3 sm:p-4 md:p-6 border-b border-gray-100">
      <div class="flex gap-2 sm:gap-4 items-center">
        <input
          id="search-input"
          type="text"
          placeholder="Tìm kiếm theo slug, tên..."
          class="flex-1 px-3 sm:px-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-rose-300"
        />
        <x-button onclick="searchWeddings()" class="sm:px-6">
          Tìm kiếm
        </x-button>
      </div>
    </div>

    <!-- Table -->
    <div class="p-3 sm:p-4 md:p-6 overflow-x-auto">
      <table class="w-full min-w-[800px] lg:min-w-0">
        <thead>
          <tr class="border-b border-gray-200">
            <th class="text-left py-3 px-4 text-sm font-medium text-gray-700">
              Slug
            </th>
            <th class="text-left py-3 px-4 text-sm font-medium text-gray-700">
              URL Thiệp
            </th>
            <th class="text-left py-3 px-4 text-sm font-medium text-gray-700">
              Link Quản lý
            </th>
            <th class="text-left py-3 px-4 text-sm font-medium text-gray-700">
              Chú rể
            </th>
            <th class="text-left py-3 px-4 text-sm font-medium text-gray-700">
              Cô dâu
            </th>
            <th class="text-left py-3 px-4 text-sm font-medium text-gray-700">
              Mã đơn hàng
            </th>
            <th class="text-left py-3 px-4 text-sm font-medium text-gray-700">
              Trạng thái
            </th>
            <th class="text-left py-3 px-4 text-sm font-medium text-gray-700">
              Ngày tạo
            </th>
            <th class="text-left py-3 px-4 text-sm font-medium text-gray-700">
              Thao tác
            </th>
          </tr>
        </thead>
        <tbody id="wedding-list">
          <tr>
            <td colspan="9" class="text-center py-8 text-gray-400">
              Đang tải...
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div
      class="flex flex-col sm:flex-row items-center justify-between gap-3 px-3 sm:px-4 md:px-6 pb-3 sm:pb-4 md:pb-6"
    >
      <div class="text-xs sm:text-sm text-gray-600">
        Trang <span id="current-page">1</span> /
        <span id="total-pages">1</span> (<span id="total-records">0</span>
        bản ghi)
      </div>
      <div class="flex gap-2">
        <x-button variant="outline" tone="neutral" size="sm" onclick="loadPage(currentPage - 1)" id="btn-prev" class="sm:px-4 sm:text-sm">
          Trước
        </x-button>
        <x-button variant="outline" tone="neutral" size="sm" onclick="loadPage(currentPage + 1)" id="btn-next" class="sm:px-4 sm:text-sm">
          Sau
        </x-button>
      </div>
    </div>
  </div>
</div>

<!-- Modal: Edit Wedding Slug -->
<div
  id="modal-edit"
  class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4"
>
  <div class="bg-white rounded-2xl p-4 sm:p-6 w-full max-w-md">
    <h3 class="text-base sm:text-lg font-semibold text-gray-800 mb-4">
      Sửa Slug
    </h3>
    <input
      id="edit-slug-input"
      type="text"
      class="w-full px-3 sm:px-4 py-2 sm:py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-rose-300 mb-4"
    />
    <div class="flex gap-3">
      <x-button variant="outline" tone="neutral" onclick="closeModal()" class="flex-1">
        Hủy
      </x-button>
      <x-button onclick="saveSlug()" class="flex-1">
        Lưu
      </x-button>
    </div>
  </div>
</div>
