<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=540" />
    <title>Sân khấu video quảng cáo</title>
    <!--
      Sân khấu 9:16 của "Tạo Video Quảng Cáo": mẫu thiệp chạy trong iframe, nằm trong
      khung iPhone. Khổ CỐ ĐỊNH 540×960 — bộ quay (scripts/promo-video.mjs) chụp ở
      deviceScaleFactor 2 ra 1080×1920; tab admin thu nhỏ trang này để xem trước.
      Tham số URL: theme, dur, title, sub, foot, music (0 = giấu nút nhạc), play.
      Chữ chỉ nằm ở phần đầu, dưới 64px trên cùng: TikTok phủ thanh tab lên đỉnh màn và
      phủ tên tài khoản + chú thích lên khoảng 1/4 dưới — chữ để ở đó là bị che.
    -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../styles/build.css" />
    <style>
      html,
      body {
        width: 540px;
        height: 960px;
        margin: 0;
        overflow: hidden;
        background: #fdf2f4;
      }
      .pv {
        position: relative;
        width: 540px;
        height: 960px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: "Be Vietnam Pro", system-ui, sans-serif;
        color: #3b2a2f;
      }
      /* Nền = ảnh chụp chính mẫu đó, nhoè + phủ sáng → mỗi video tự ăn tông mẫu. */
      .pv-bg {
        position: absolute;
        inset: -40px;
        background: linear-gradient(160deg, #fde7ec 0%, #fff7f0 55%, #f6e9ff 100%);
      }
      .pv-bg img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: blur(36px) saturate(1.2);
        opacity: 0.85;
      }
      .pv-bg::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgb(255 255 255 / 0.68) 0%,
          rgb(255 255 255 / 0.28) 40%,
          rgb(255 255 255 / 0.28) 64%,
          rgb(255 255 255 / 0.72) 100%
        );
      }
      .pv-head {
        position: relative;
        z-index: 1;
        margin-top: 64px;
        padding-bottom: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: 0 24px;
        text-align: center;
      }
      .pv-kicker {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: #b4566d;
      }
      .pv-kicker:empty,
      .pv-name:empty,
      .pv-foot:empty {
        display: none;
      }
      .pv-name {
        font-family: "Playfair Display", Georgia, serif;
        font-style: italic;
        font-weight: 500;
        font-size: 40px;
        line-height: 48px;
        color: #2e1e23;
      }
      /* Thân máy: tỉ lệ 383×785 của assets/images/iphone_mockup.svg — ô màn dùng lại
         bộ inset .cx-pshell-screen của khung xem thử trên máy tính. */
      .pv-phone {
        position: relative;
        z-index: 1;
        width: 360px;
        height: 738px;
      }
      .pv-phone .cx-pshell-frame {
        filter: drop-shadow(0 24px 40px rgb(60 20 30 / 0.28));
      }
      .pv-foot {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        padding: 4px 16px;
        border-radius: 999px;
        background: rgb(255 255 255 / 0.72);
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 1px;
        color: #3b2a2f;
      }
      .pv-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #e0607e;
      }
    </style>
  </head>
  <body>
    <div class="pv">
      <div class="pv-bg"><img id="pv-bg-img" alt="" hidden /></div>
      <header class="pv-head">
        <div class="pv-kicker" id="pv-title"></div>
        <div class="pv-name" id="pv-sub"></div>
        <div class="pv-foot" id="pv-foot"></div>
      </header>
      <div class="pv-phone" id="pv-phone">
        <div class="cx-pshell-screen">
          <div id="pv-chrome"></div>
          <div class="cx-pviewport">
            <iframe id="pv-view" class="cx-pshell-view" title="Thiệp" allow="autoplay"></iframe>
          </div>
          <div class="cx-ppad"></div>
        </div>
        <img src="../../assets/images/iphone_mockup.svg" alt="" class="cx-pshell-frame" />
      </div>
    </div>
    <script src="../../core/helpers/phone-chrome.js"></script>
    <script src="stage.js"></script>
  </body>
</html>
