<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cưới Xinh — Quản trị</title>
    <link rel="icon" type="image/png" href="../assets/icons/logo.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind build local (npm run build:css) — thay cho Play CDN; đã gồm cả
         phần dùng chung của common.css cũ. Xem tailwind.config.js. -->
    <link rel="stylesheet" href="../styles/build.css" />
    <!-- Leaflet: dùng cho picker chọn địa điểm ở tab "Dữ liệu mẫu"
         (core/helpers/maps-helper.js, chung với trang thiết lập thiệp) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
  </head>
  <!-- font-inter thay cho fontFamily.sans = Inter trong config inline cũ: nay
       dùng chung một build với trang chủ nên đặt font ở đây, không đổi mặc định
       toàn site. -->
  <body class="font-inter bg-gray-50 min-h-screen p-2 sm:p-4 md:p-6">
    <div class="max-w-7xl mx-auto">
      <div class="flex items-center justify-between mb-4 sm:mb-6 md:mb-8 px-2">
        <h1 class="text-2xl sm:text-3xl">
          <button
            type="button"
            onclick="switchTab('dashboard')"
            class="text-sm sm:text-base font-semibold hover:opacity-80 transition-opacity align-middle"
            style="color: rgb(var(--focus-ring-rgb))"
          >
            Trang chủ
          </button>
          <span class="text-sm sm:text-base font-normal text-gray-300 mx-1 align-middle">/</span>
          <span
            id="breadcrumb-current"
            class="text-sm sm:text-base font-normal text-gray-400 align-middle"
            >Quản lý Hệ thống</span
          >
        </h1>
        <a href="/" class="shrink-0">
          <img src="../assets/icons/logo.png" alt="Cưới Xinh" class="h-9 w-auto" />
        </a>
      </div>

      <!-- Nội dung từng màn được nạp động từ partials/ — xem loader.js.
           Không còn tab bar: điều hướng qua card ở Dashboard + breadcrumb ở
           header (switchTab() vẫn giữ tên cũ, chỉ đổi UI gọi nó). -->
      <span id="mount-dashboard" hidden></span>
      <span id="mount-weddings" hidden></span>
      <span id="mount-templates" hidden></span>
      <span id="mount-sample-images" hidden></span>
      <span id="mount-asset-images" hidden></span>
      <span id="mount-background" hidden></span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8" integrity="sha384-Tve8O+C6PBzsIMK/IRCwHbi8fyEzXIlIs6OfVBZHubplwYhaQF/4Mzxqgg+pp/oy" crossorigin="anonymous"></script>
    <!-- Nạp partials/*.html vào các thẻ mount ở trên, rồi mới chèn script theo tab
         (js/00-core.js, 01-weddings.js, 02-templates.js). Xem loader.js. -->
    <script src="loader.js"></script>
  </body>
</html>
