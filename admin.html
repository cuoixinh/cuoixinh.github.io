<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Quản lý Thiệp Cưới</title>
    <link rel="icon" type="image/png" href="assets/icons/logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .status-badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 9999px;
        font-size: 11px;
        font-weight: 500;
      }
      .status-active {
        background: #dcfce7;
        color: #166534;
      }
      .status-inactive {
        background: #fee2e2;
        color: #991b1b;
      }
    </style>
  </head>
  <body class="bg-gray-50 min-h-screen p-4">
    <div class="max-w-7xl mx-auto">
      <h1 class="text-3xl font-semibold text-gray-800 mb-8">
        Quản lý Thiệp Cưới
      </h1>

      <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
        <!-- Search bar -->
        <div class="p-6 border-b border-gray-100">
          <div class="flex gap-4 items-center">
            <input
              id="search-input"
              type="text"
              placeholder="Tìm kiếm theo slug, tên chú rể, cô dâu..."
              class="flex-1 px-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-rose-300"
            />
            <button
              onclick="searchWeddings()"
              class="px-6 py-2 bg-rose-400 hover:bg-rose-500 text-white rounded-lg text-sm font-medium transition-colors"
            >
              Tìm kiếm
            </button>
            <button
              onclick="clearSearch()"
              class="px-6 py-2 border border-gray-200 hover:bg-gray-50 text-gray-600 rounded-lg text-sm font-medium transition-colors"
            >
              Xóa
            </button>
            <div class="border-l border-gray-300 h-8 mx-2"></div>
            <button
              id="purge-cache-btn"
              onclick="purgeTemplatesCache()"
              class="px-6 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg text-sm font-medium transition-colors flex items-center gap-2"
              title="Xóa cache Cloudflare để cập nhật templates mới"
            >
              <i class="fas fa-sync"></i>
              Xóa Cache
            </button>
          </div>
        </div>

        <!-- Table -->
        <div class="overflow-x-auto p-6">
          <table class="w-full">
            <thead>
              <tr class="border-b border-gray-200">
                <th
                  class="text-left py-3 px-4 text-sm font-medium text-gray-700"
                >
                  Slug
                </th>
                <th
                  class="text-left py-3 px-4 text-sm font-medium text-gray-700"
                >
                  URL Thiệp
                </th>
                <th
                  class="text-left py-3 px-4 text-sm font-medium text-gray-700"
                >
                  Link Quản lý
                </th>
                <th
                  class="text-left py-3 px-4 text-sm font-medium text-gray-700"
                >
                  Chú rể
                </th>
                <th
                  class="text-left py-3 px-4 text-sm font-medium text-gray-700"
                >
                  Cô dâu
                </th>
                <th
                  class="text-left py-3 px-4 text-sm font-medium text-gray-700"
                >
                  Mã đơn hàng
                </th>
                <th
                  class="text-left py-3 px-4 text-sm font-medium text-gray-700"
                >
                  Trạng thái
                </th>
                <th
                  class="text-left py-3 px-4 text-sm font-medium text-gray-700"
                >
                  Ngày tạo
                </th>
                <th
                  class="text-left py-3 px-4 text-sm font-medium text-gray-700"
                >
                  Thao tác
                </th>
              </tr>
            </thead>
            <tbody id="wedding-list">
              <tr>
                <td colspan="9" class="text-center py-8 text-gray-400">
                  Đang tải...
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Pagination -->
        <div class="flex items-center justify-between px-6 pb-6">
          <div class="text-sm text-gray-600">
            Trang <span id="current-page">1</span> /
            <span id="total-pages">1</span> (<span id="total-records">0</span>
            bản ghi)
          </div>
          <div class="flex gap-2">
            <button
              onclick="loadPage(currentPage - 1)"
              id="btn-prev"
              class="px-4 py-2 border border-gray-200 rounded-lg text-sm hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed"
            >
              Trước
            </button>
            <button
              onclick="loadPage(currentPage + 1)"
              id="btn-next"
              class="px-4 py-2 border border-gray-200 rounded-lg text-sm hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed"
            >
              Sau
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal: Edit Slug -->
    <div
      id="modal-edit"
      class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50"
    >
      <div class="bg-white rounded-2xl p-6 w-full max-w-md mx-4">
        <h3 class="text-lg font-semibold text-gray-800 mb-4">Sửa Slug</h3>
        <input
          id="edit-slug-input"
          type="text"
          class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-rose-300 mb-4"
        />
        <div class="flex gap-3">
          <button
            onclick="closeModal()"
            class="flex-1 px-4 py-2 border border-gray-200 rounded-lg text-sm hover:bg-gray-50"
          >
            Hủy
          </button>
          <button
            onclick="saveSlug()"
            class="flex-1 px-4 py-2 bg-rose-400 hover:bg-rose-500 text-white rounded-lg text-sm"
          >
            Lưu
          </button>
        </div>
      </div>
    </div>

    <script src="config.js"></script>
    <script>
      const EDGE_URL = CONFIG.supabase.edgeUrl;
      const ANON_KEY = CONFIG.supabase.anonKey;
      const DOMAIN = window.location.origin;

      let ADMIN_TOKEN = sessionStorage.getItem("admin_token");
      if (!ADMIN_TOKEN) {
        ADMIN_TOKEN = prompt("Nhập mã quản trị:");
        if (ADMIN_TOKEN) {
          sessionStorage.setItem("admin_token", ADMIN_TOKEN);
        } else {
          document.body.innerHTML =
            '<p style="text-align:center;margin-top:40px;color:#999">Không có quyền truy cập</p>';
        }
      }

      let currentPage = 1;
      let totalPages = 1;
      let currentSearch = "";
      let editingId = null;

      function searchWeddings() {
        currentSearch = document.getElementById("search-input").value.trim();
        loadPage(1);
      }

      function clearSearch() {
        document.getElementById("search-input").value = "";
        currentSearch = "";
        loadPage(1);
      }

      async function loadPage(page) {
        if (page < 1 || page > totalPages) return;
        currentPage = page;
        try {
          let url = `${EDGE_URL}?list=true&page=${page}&limit=10&token=${ADMIN_TOKEN}`;
          if (currentSearch)
            url += `&search=${encodeURIComponent(currentSearch)}`;
          const res = await fetch(url, {
            headers: { Authorization: `Bearer ${ANON_KEY}` },
          });
          const result = await res.json();
          if (!res.ok) throw new Error(result.error || "Lỗi tải danh sách");
          renderList(result.data);
          updatePagination(result.pagination);
        } catch (e) {
          document.getElementById("wedding-list").innerHTML =
            `<tr><td colspan="8" class="text-center py-8 text-red-500">${e.message}</td></tr>`;
        }
      }

      function renderList(weddings) {
        const tbody = document.getElementById("wedding-list");
        if (!weddings || weddings.length === 0) {
          tbody.innerHTML = `<tr><td colspan="9" class="text-center py-8 text-gray-400">Chưa có thiệp nào</td></tr>`;
          return;
        }
        tbody.innerHTML = weddings
          .map(
            (w) => `
          <tr class="border-b border-gray-100 hover:bg-gray-50">
            <td class="py-3 px-4 text-sm text-gray-700 font-mono">${w.slug || "-"}</td>
            <td class="py-3 px-4 text-sm">
              <a href="${DOMAIN}/themes/template1.html?slug=${w.slug}" target="_blank" class="text-rose-500 hover:underline text-xs">${DOMAIN}/${w.slug}</a>
            </td>
            <td class="py-3 px-4 text-sm">
              <button onclick="copyManageLink('${w.id}')" class="text-blue-600 hover:underline text-xs">📋 Copy link</button>
            </td>
            <td class="py-3 px-4 text-sm text-gray-700">${w.groom_name || "-"}</td>
            <td class="py-3 px-4 text-sm text-gray-700">${w.bride_name || "-"}</td>
            <td class="py-3 px-4 text-sm">
              <span class="text-xs font-mono ${w.payment_order_id ? "text-blue-600" : "text-gray-400"}">${w.payment_order_id || "-"}</span>
            </td>
            <td class="py-3 px-4 text-sm">
              <span class="status-badge ${w.is_active ? "status-active" : "status-inactive"}">${w.is_active ? "Hoạt động" : "Tắt"}</span>
            </td>
            <td class="py-3 px-4 text-sm text-gray-500">${formatDate(w.created_at)}</td>
            <td class="py-3 px-4 text-sm">
              <div class="flex gap-2">
                <button onclick="toggleStatus('${w.id}', ${!w.is_active})" title="${w.is_active ? "Tắt" : "Bật"}">${w.is_active ? "🔒" : "🔓"}</button>
                <button onclick="openEditModal('${w.id}', '${w.slug}')" title="Sửa slug">✏️</button>
                <button onclick="deleteWedding('${w.id}', '${w.slug}')" title="Xóa">🗑️</button>
              </div>
            </td>
          </tr>`,
          )
          .join("");
      }

      function formatDate(dateStr) {
        return new Date(dateStr).toLocaleDateString("vi-VN", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function updatePagination(pagination) {
        currentPage = pagination.page;
        totalPages = pagination.totalPages;
        document.getElementById("current-page").textContent = pagination.page;
        document.getElementById("total-pages").textContent =
          pagination.totalPages;
        document.getElementById("total-records").textContent = pagination.total;
        document.getElementById("btn-prev").disabled = pagination.page === 1;
        document.getElementById("btn-next").disabled =
          pagination.page === pagination.totalPages;
      }

      function copyManageLink(id) {
        navigator.clipboard.writeText(
          `${DOMAIN}/manage-by-customer.html?id=${id}`,
        );
        alert("Đã copy link quản lý!");
      }

      async function toggleStatus(id, newStatus) {
        if (
          !confirm(`Bạn có chắc muốn ${newStatus ? "bật" : "tắt"} thiệp này?`)
        )
          return;
        try {
          const res = await fetch(`${EDGE_URL}?token=${ADMIN_TOKEN}`, {
            method: "PATCH",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${ANON_KEY}`,
            },
            body: JSON.stringify({ id, is_active: newStatus }),
          });
          if (!res.ok) throw new Error("Lỗi cập nhật trạng thái");
          loadPage(currentPage);
        } catch (e) {
          alert(e.message);
        }
      }

      function openEditModal(id, slug) {
        editingId = id;
        document.getElementById("edit-slug-input").value = slug;
        document.getElementById("modal-edit").classList.remove("hidden");
        document.getElementById("modal-edit").classList.add("flex");
      }

      function closeModal() {
        editingId = null;
        document.getElementById("modal-edit").classList.add("hidden");
        document.getElementById("modal-edit").classList.remove("flex");
      }

      async function saveSlug() {
        const newSlug = document.getElementById("edit-slug-input").value.trim();
        if (!newSlug) {
          alert("Vui lòng nhập slug");
          return;
        }
        try {
          const res = await fetch(`${EDGE_URL}?token=${ADMIN_TOKEN}`, {
            method: "PATCH",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${ANON_KEY}`,
            },
            body: JSON.stringify({ id: editingId, slug: newSlug }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "Lỗi cập nhật slug");
          closeModal();
          loadPage(currentPage);
        } catch (e) {
          alert(e.message);
        }
      }

      async function deleteWedding(id, slug) {
        if (
          !confirm(
            `Bạn có chắc muốn xóa thiệp "${slug}"?\n\nThao tác này không thể hoàn tác!`,
          )
        )
          return;
        try {
          const res = await fetch(`${EDGE_URL}?id=${id}&token=${ADMIN_TOKEN}`, {
            method: "DELETE",
            headers: { Authorization: `Bearer ${ANON_KEY}` },
          });
          if (!res.ok) throw new Error("Lỗi xóa thiệp");
          loadPage(currentPage);
        } catch (e) {
          alert(e.message);
        }
      }

      document
        .getElementById("search-input")
        .addEventListener("keydown", (e) => {
          if (e.key === "Enter") searchWeddings();
        });

      // Purge templates cache
      async function purgeTemplatesCache() {
        const btn = document.getElementById("purge-cache-btn");
        const originalHTML = btn.innerHTML;

        try {
          btn.disabled = true;
          btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang xóa...';

          const response = await fetch(
            CONFIG.cloudflare.templatesCache + "/purge",
            {
              method: "POST",
              headers: {
                "X-Purge-Secret": CONFIG.cloudflare.purgeSecret,
                "Content-Type": "application/json",
              },
            },
          );

          const result = await response.json();

          if (response.ok && result.success) {
            alert(
              "✅ Đã xóa cache thành công!\n\nTemplates mới sẽ được load trong lần truy cập tiếp theo.",
            );
          } else {
            alert("❌ Lỗi: " + (result.error || "Không thể xóa cache"));
          }
        } catch (error) {
          alert("❌ Lỗi kết nối: " + error.message);
        } finally {
          btn.disabled = false;
          btn.innerHTML = originalHTML;
        }
      }
      localStorage.removeItem("PURGE_SECRET");
      alert("✅ Đã xóa secret đã lưu");

      // Load danh sách ngay khi vào trang
      loadPage(1);
    </script>
  </body>
</html>
