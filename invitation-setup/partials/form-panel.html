<!-- Form Panel (toggle with preview) -->
<div id="form-panel">
  <!-- Vùng nội dung là THẺ NỔI thứ ba, cùng khổ và cùng kiểu bo góc với thanh
       trên (#setup-topcard) và navbar (#nav-card) — vỏ ngoài chỉ giữ lề, nền
       nằm ở #setup-scroll. Trang KHÔNG cuộn (xem .cx-setup trong
       styles/_setup.css): chỉ thẻ này cuộn, nên nội dung không bao giờ chui
       xuống dưới navbar. Chiều cao do CSS tính từ --cx-top-h + --nav-h. -->
  <div id="setup-main" class="px-2 sm:px-4">
    <div id="setup-scroll" class="max-w-4xl mx-auto my-4">
      <!-- Đệm đáy chừa chỗ cho cặp nút nổi #step-nav (nằm đè lên đáy thẻ). -->
      <div class="pb-[84px]">
        <!-- Form -->
        <form
          id="wedding-form"
          class="flex flex-col gap-6 scroll-mt-4"
          autocomplete="on"
        >
          <input type="hidden" name="cover_image_url" />
          <input type="hidden" name="groom_image_url" />
          <input type="hidden" name="bride_image_url" />
          <input type="hidden" name="groom_qr_url" />
          <input type="hidden" name="bride_qr_url" />
          <textarea name="gallery_images_raw" class="hidden"></textarea>
          <input
            type="hidden"
            name="rsvp_enabled"
            id="rsvp_enabled"
            value="true"
          />
          <input type="hidden" name="timeline" id="timeline-value" value="[]" />
          <input
            type="hidden"
            name="love_story"
            id="love-story-value"
            value="[]"
          />

          <input
            type="hidden"
            name="ceremony_lunar"
            id="ceremony-lunar-value"
          />
          <input
            type="hidden"
            name="groom_party_lunar"
            id="groom-party-lunar-value"
          />
          <input
            type="hidden"
            name="bride_party_lunar"
            id="bride-party-lunar-value"
          />
          <!-- Section visibility toggles -->
          <input
            type="hidden"
            name="enable_family"
            id="enable_family"
            value="true"
          />
          <input
            type="hidden"
            name="enable_party"
            id="enable_party"
            value="true"
          />
          <input
            type="hidden"
            name="enable_photos"
            id="enable_photos"
            value="true"
          />
          <input
            type="hidden"
            name="enable_timeline"
            id="enable_timeline"
            value="true"
          />
          <input
            type="hidden"
            name="enable_love_story"
            id="enable_love_story"
            value="true"
          />
          <input
            type="hidden"
            name="enable_music"
            id="enable_music"
            value="true"
          />
          <input
            type="hidden"
            name="enable_gift"
            id="enable_gift"
            value="true"
          />
          <input
            type="hidden"
            name="enable_footer"
            id="enable_footer"
            value="true"
          />

          <span id="mount-step-couple" hidden></span>

          <span id="mount-step-ceremony" hidden></span>

          <span id="mount-step-family" hidden></span>

          <span id="mount-step-party" hidden></span>

          <span id="mount-step-photos" hidden></span>

          <span id="mount-step-timeline" hidden></span>

          <span id="mount-step-love_story" hidden></span>

          <span id="mount-step-rsvp" hidden></span>

          <span id="mount-step-gift" hidden></span>

          <span id="mount-step-footer" hidden></span>
        </form>
      </div>
    </div>
  </div>

  <!-- Cặp nút điều hướng NỔI trên navbar. `fixed` nên không chiếm một dòng nào
       trong luồng form; phần đệm đáy của form (pb-…) đã chừa chỗ cho chúng.
       Nằm ngoài <form> để Enter trong ô nhập không đụng tới, và nằm TRONG
       #form-panel để tự ẩn khi chuyển sang tab Xem trước / Cấu hình.
       `bottom` bám --nav-h (chiều cao thật của navbar, do _syncNavHeight đo);
       thẻ AI nổi cũng được đẩy lên trên cụm này nên không đè lên nhau. -->
  <div
    id="step-nav"
    class="pointer-events-none fixed inset-x-0 z-[47] flex justify-center px-4 sm:px-6"
    style="bottom: calc(var(--nav-h, 60px) + 12px)"
  >
    <!-- Cụm nằm ở MÉP PHẢI cột nội dung (max-w-4xl như các thẻ nổi khác) chứ
         không giữa màn: tay cầm máy ở đó, và giữa màn là chỗ đang đọc form. -->
    <!-- MỘT viên thuốc nổi: nút lùi chỉ còn mũi tên (việc phụ), số bước ở giữa
         cho biết đang ở đâu, nút tiến là nút chính có nhãn. Bước đầu giấu nút
         lùi thì cụm tự co lại quanh phần còn lại. -->
    <div class="w-full max-w-4xl flex justify-end">
      <div class="cx-stepnav pointer-events-auto">
        <x-button
          type="button"
          id="step-prev"
          variant="ghost"
          tone="neutral"
          size="sm"
          icon-only
          onclick="cxStepPrev()"
          title="Bước trước"
          aria-label="Bước trước"
        >
          <!-- Cỡ icon bằng class, KHÔNG style inline: lucide bê nguyên style
               sang <svg> nên media query thu nhỏ ở mobile sẽ không đè nổi. -->
          <i data-lucide="chevron-left" class="w-4 h-4"></i>
        </x-button>
        <span id="step-count" class="cx-stepnav-count">1/1</span>
        <x-button type="button" id="step-next" size="sm" onclick="cxStepNext()">
          <span id="step-next-label">Tiếp</span>
          <i data-lucide="chevron-right" class="w-4 h-4"></i>
        </x-button>
      </div>
    </div>
  </div>
</div>
<!-- /form-panel -->

<!-- Xem trực tiếp: dải cố định sát mép phải màn hình, chạy chính thiệp đang
     chỉnh và tự tải lại sau mỗi thay đổi (js/22-live-preview.js). Để NGOÀI
     #form-panel vì nó `fixed`, không thuộc luồng form; ẩn/hiện theo tab do
     _syncRail() lo. Chỉ có từ 820px trở lên. -->
<aside id="live-dock" class="cx-live-dock" aria-label="Xem trực tiếp thiệp">
  <div class="cx-phone">
    <div class="cx-phone-screen">
      <!-- Không khai allow="autoplay": khung này chạy cạnh form nên nhạc nền tự
           phát mỗi lần tải lại là phiền. Nghe nhạc thì sang tab Xem trước. -->
      <iframe
        id="live-preview-iframe"
        src=""
        class="cx-phone-view"
        title="Xem trực tiếp thiệp"
      ></iframe>
    </div>
    <!-- Vỏ máy nằm ĐÈ lên iframe (vùng màn hình của ảnh là trong suốt). -->
    <img src="../assets/images/screen_ip.png" alt="" class="cx-phone-frame" />
  </div>
  <!-- Nhãn "Xem trực tiếp" + nút tải lại, treo DƯỚI máy. -->
  <div class="cx-live-head">
    <div class="cx-live-bar">
      <span class="cx-live-dot"></span>
      <span class="cx-live-title">Xem trực tiếp</span>
      <x-button
        type="button"
        id="live-reload"
        variant="bare"
        class="cx-live-reload"
        onclick="cxLiveRefresh()"
        aria-label="Tải lại bản xem trực tiếp"
        title="Tải lại"
      >
        <i data-lucide="rotate-cw"></i>
      </x-button>
    </div>
  </div>
</aside>
