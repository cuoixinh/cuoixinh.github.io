<!-- Form Panel (toggle with preview) -->
<div id="form-panel">
  <!-- Vùng nội dung là THẺ NỔI thứ ba, cùng khổ và cùng kiểu bo góc với thanh
       trên (#setup-topcard) và navbar (#nav-card) — vỏ ngoài chỉ giữ lề, nền
       nằm ở #setup-scroll. Trang KHÔNG cuộn (xem .cx-setup trong
       styles/_setup.css): chỉ thẻ này cuộn, nên nội dung không bao giờ chui
       xuống dưới navbar. Chiều cao do CSS tính từ --cx-top-h + --nav-h. -->
  <div id="setup-main" class="px-2 sm:px-4">
    <div id="setup-scroll" class="max-w-4xl mx-auto my-4">
      <!-- Dòng bước đang mở + vạch tiến độ, DÍNH mép trên khung cuộn. Chữ và độ
           dài vạch do _cxRenderHead() (js/20-steps.js) điền. Cả dòng là nút mở
           ngăn chip các bước bên dưới (cxStepBarToggle) — ngăn mặc định THU cho
           đỡ tốn chiều cao, tự thu lại khi chọn bước / cuộn / bấm ra ngoài. -->
      <div id="step-head" class="cx-stephead">
        <x-button
          variant="bare"
          id="step-head-toggle"
          class="cx-stephead-toggle"
          aria-expanded="false"
          aria-controls="step-drawer"
          onclick="cxStepBarToggle()"
        >
          <span class="cx-stephead-title">
            <span id="step-head-num" class="cx-stephead-num"></span>
            <span id="step-head-label"></span>
          </span>
          <i data-lucide="chevron-down" class="cx-stephead-chev"></i>
          <span id="step-head-done" class="cx-stephead-done"></span>
        </x-button>
        <div
          id="step-head-track"
          class="cx-stephead-track"
          role="progressbar"
          aria-label="Số mục đã điền đủ"
          aria-valuemin="0"
        >
          <div id="step-head-fill" class="cx-stephead-fill"></div>
        </div>

        <!-- Ngăn chip các bước: chip do js/20-steps.js đổ ra từ CX_STEPS (✓ đủ ·
             ⚠ thiếu · nét đứt chưa điền), cuộn ngang vì 10 bước không vừa bề
             ngang điện thoại. Thu bằng grid-rows 0fr chứ không display:none nên
             chip vẫn có khổ thật — kéo chip đang mở vào giữa vẫn đo được. -->
        <div id="step-drawer" class="cx-stepdrawer">
          <div class="cx-stepdrawer-in">
            <!-- .cx-stepbar-wrap vẽ vệt trắng mờ hai mép báo còn cuộn được;
                 hai nút kẹp hai đầu chỉ CUỘN dãy chip, _cxSyncBarFade() làm mờ
                 nút khi phía đó đã hết chip. -->
            <div class="flex items-center gap-0.5 pt-2">
              <x-button
                type="button"
                id="stepbar-prev"
                variant="ghost"
                tone="neutral"
                size="sm"
                icon-only
                onclick="cxStepBarScroll(-1)"
                title="Xem các bước trước"
                aria-label="Cuộn thanh bước sang trái"
                class="shrink-0"
              >
                <i data-lucide="chevron-left" class="w-4 h-4"></i>
              </x-button>
              <div class="cx-stepbar-wrap flex-1 min-w-0">
                <div
                  id="step-bar"
                  class="flex items-center gap-1 overflow-x-auto px-1 py-1 scrollbar-hide"
                  role="tablist"
                  aria-label="Các bước điền thông tin thiệp"
                ></div>
              </div>
              <x-button
                type="button"
                id="stepbar-next"
                variant="ghost"
                tone="neutral"
                size="sm"
                icon-only
                onclick="cxStepBarScroll(1)"
                title="Xem các bước sau"
                aria-label="Cuộn thanh bước sang phải"
                class="shrink-0"
              >
                <i data-lucide="chevron-right" class="w-4 h-4"></i>
              </x-button>
            </div>
          </div>
        </div>
      </div>

      <div class="cx-setup-body">
        <!-- Form -->
        <form
          id="wedding-form"
          class="flex flex-col gap-6 scroll-mt-4"
          autocomplete="on"
        >
          <input type="hidden" name="cover_image_url" />
          <input type="hidden" name="groom_image_url" />
          <input type="hidden" name="bride_image_url" />
          <input type="hidden" name="groom_qr_url" />
          <input type="hidden" name="bride_qr_url" />
          <textarea name="gallery_images_raw" class="hidden"></textarea>
          <input
            type="hidden"
            name="rsvp_enabled"
            id="rsvp_enabled"
            value="true"
          />
          <input type="hidden" name="timeline" id="timeline-value" value="[]" />
          <input
            type="hidden"
            name="love_story"
            id="love-story-value"
            value="[]"
          />

          <input
            type="hidden"
            name="ceremony_lunar"
            id="ceremony-lunar-value"
          />
          <input
            type="hidden"
            name="groom_party_lunar"
            id="groom-party-lunar-value"
          />
          <input
            type="hidden"
            name="bride_party_lunar"
            id="bride-party-lunar-value"
          />
          <!-- Section visibility toggles -->
          <input
            type="hidden"
            name="enable_family"
            id="enable_family"
            value="true"
          />
          <input
            type="hidden"
            name="enable_party"
            id="enable_party"
            value="true"
          />
          <input
            type="hidden"
            name="enable_photos"
            id="enable_photos"
            value="true"
          />
          <input
            type="hidden"
            name="enable_timeline"
            id="enable_timeline"
            value="true"
          />
          <input
            type="hidden"
            name="enable_love_story"
            id="enable_love_story"
            value="true"
          />
          <input
            type="hidden"
            name="enable_music"
            id="enable_music"
            value="true"
          />
          <input
            type="hidden"
            name="enable_gift"
            id="enable_gift"
            value="true"
          />
          <input
            type="hidden"
            name="enable_footer"
            id="enable_footer"
            value="true"
          />
          <input
            type="hidden"
            name="enable_wishes"
            id="enable_wishes"
            value="true"
          />

          <span id="mount-step-couple" hidden></span>

          <span id="mount-step-ceremony" hidden></span>

          <span id="mount-step-family" hidden></span>

          <span id="mount-step-party" hidden></span>

          <span id="mount-step-photos" hidden></span>

          <span id="mount-step-timeline" hidden></span>

          <span id="mount-step-love_story" hidden></span>

          <span id="mount-step-rsvp" hidden></span>

          <span id="mount-step-gift" hidden></span>

          <span id="mount-step-footer" hidden></span>
        </form>
      </div>

      <!-- Thanh Lùi/Tiếp ở ĐÁY khung nội dung: DÍNH mép dưới khung cuộn
           (sticky) nên không bao giờ đè lên ô nhập như nút nổi. Nằm ngoài
           <form> để Enter trong ô nhập không đụng tới; nằm trong #form-panel
           nên tự ẩn theo tab. Nút Tiếp ghi tên bước kế (_cxRenderNav). -->
      <div id="step-nav" class="cx-stepnav">
        <x-button
          type="button"
          id="step-prev"
          variant="ghost"
          tone="neutral"
          onclick="cxStepPrev()"
          title="Bước trước"
        >
          <i data-lucide="chevron-left" class="w-4 h-4"></i>
          <span>Lùi</span>
        </x-button>
        <x-button
          type="button"
          id="step-next"
          class="ml-auto"
          onclick="cxStepNext()"
        >
          <span id="step-next-label">Tiếp</span>
          <i data-lucide="chevron-right" class="w-4 h-4"></i>
        </x-button>
      </div>
    </div>
  </div>
</div>
<!-- /form-panel -->

<!-- Xem trực tiếp: dải cố định sát mép phải màn hình, chạy chính thiệp đang
     chỉnh và tự tải lại sau mỗi thay đổi (js/22-live-preview.js). Để NGOÀI
     #form-panel vì nó `fixed`, không thuộc luồng form; ẩn/hiện theo tab do
     _syncRail() lo. Chỉ có từ 820px trở lên. -->
<aside id="live-dock" class="cx-live-dock" aria-label="Xem trực tiếp thiệp">
  <div class="cx-phone">
    <!-- Chrome (thanh trạng thái + thanh tiêu đề) do
         core/helpers/phone-chrome.js chèn vào đầu ô màn lúc chạy. -->
    <div class="cx-phone-screen">
      <div class="cx-pviewport">
        <!-- Không khai allow="autoplay": khung này chạy cạnh form nên nhạc nền
             tự phát mỗi lần tải lại là phiền. Nghe nhạc thì sang tab Xem trước. -->
        <iframe
          id="live-preview-iframe"
          src=""
          class="cx-phone-view"
          title="Xem trực tiếp thiệp"
        ></iframe>
      </div>
      <!-- Dải trắng đáy: giữ thiệp khỏi chạm góc bo của thân máy. -->
      <div class="cx-ppad"></div>
    </div>
    <!-- Vỏ máy nằm ĐÈ lên iframe (vùng màn hình của ảnh là trong suốt). -->
    <img src="../assets/images/iphone_mockup.svg" alt="" class="cx-phone-frame" />
  </div>
  <!-- Nhãn "Xem trực tiếp" + nút tải lại, treo DƯỚI máy. -->
  <div class="cx-live-head">
    <div class="cx-live-bar">
      <span class="cx-live-dot"></span>
      <span class="cx-live-title">Xem trực tiếp</span>
      <x-button
        type="button"
        id="live-reload"
        variant="bare"
        class="cx-live-reload"
        onclick="cxLiveRefresh()"
        aria-label="Tải lại bản xem trực tiếp"
        title="Tải lại"
      >
        <i data-lucide="rotate-cw"></i>
      </x-button>
    </div>
  </div>
</aside>
