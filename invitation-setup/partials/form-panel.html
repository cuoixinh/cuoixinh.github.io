<!-- Form Panel (toggle with preview) -->
<div id="form-panel">
  <!-- Đệm đáy = chiều cao THẬT của navbar (--nav-h, do _syncNavHeight đo) + 32px:
       bước có nội dung ngắn vẫn xem hết được phần cuối, không bị navbar che.
       scroll-mt chừa chỗ cho header + thanh bước (đều sticky) khi cxGoStep cuộn tới. -->
  <div class="max-w-4xl mx-auto px-4 py-8 pb-[calc(var(--nav-h,60px)+32px)]">
    <!-- Form -->
    <form
      id="wedding-form"
      class="flex flex-col gap-6 scroll-mt-28"
      autocomplete="on"
    >
      <input type="hidden" name="cover_image_url" />
      <input type="hidden" name="groom_image_url" />
      <input type="hidden" name="bride_image_url" />
      <input type="hidden" name="groom_qr_url" />
      <input type="hidden" name="bride_qr_url" />
      <textarea name="gallery_images_raw" class="hidden"></textarea>
      <input type="hidden" name="rsvp_enabled" id="rsvp_enabled" value="true" />
      <input type="hidden" name="timeline" id="timeline-value" value="[]" />
      <input type="hidden" name="love_story" id="love-story-value" value="[]" />

      <input type="hidden" name="ceremony_lunar" id="ceremony-lunar-value" />
      <input
        type="hidden"
        name="groom_party_lunar"
        id="groom-party-lunar-value"
      />
      <input
        type="hidden"
        name="bride_party_lunar"
        id="bride-party-lunar-value"
      />
      <!-- Section visibility toggles -->
      <input
        type="hidden"
        name="enable_family"
        id="enable_family"
        value="true"
      />
      <input type="hidden" name="enable_party" id="enable_party" value="true" />
      <input
        type="hidden"
        name="enable_photos"
        id="enable_photos"
        value="true"
      />
      <input
        type="hidden"
        name="enable_timeline"
        id="enable_timeline"
        value="true"
      />
      <input
        type="hidden"
        name="enable_love_story"
        id="enable_love_story"
        value="true"
      />
      <input type="hidden" name="enable_music" id="enable_music" value="true" />
      <input type="hidden" name="enable_gift" id="enable_gift" value="true" />
      <input
        type="hidden"
        name="enable_footer"
        id="enable_footer"
        value="true"
      />

      <span id="mount-step-couple" hidden></span>

      <span id="mount-step-ceremony" hidden></span>

      <span id="mount-step-family" hidden></span>

      <span id="mount-step-party" hidden></span>

      <span id="mount-step-photos" hidden></span>

      <span id="mount-step-timeline" hidden></span>

      <span id="mount-step-love_story" hidden></span>

      <span id="mount-step-rsvp" hidden></span>

      <span id="mount-step-gift" hidden></span>

      <span id="mount-step-footer" hidden></span>
    </form>
  </div>
</div>
<!-- /form-panel -->
