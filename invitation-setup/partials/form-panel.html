<!-- Form Panel (toggle with preview) -->
<div id="form-panel">
  <div class="max-w-4xl mx-auto px-4 py-8 pb-24">
    <!-- Form -->
    <form id="wedding-form" class="flex flex-col gap-6" autocomplete="on">
      <input type="hidden" name="cover_image_url" />
      <input type="hidden" name="groom_image_url" />
      <input type="hidden" name="bride_image_url" />
      <input type="hidden" name="groom_qr_url" />
      <input type="hidden" name="bride_qr_url" />
      <textarea name="gallery_images_raw" class="hidden"></textarea>
      <input type="hidden" name="rsvp_enabled" id="rsvp_enabled" value="true" />
      <input type="hidden" name="timeline" id="timeline-value" value="[]" />
      <input type="hidden" name="love_story" id="love-story-value" value="[]" />

      <input type="hidden" name="ceremony_lunar" id="ceremony-lunar-value" />
      <input
        type="hidden"
        name="groom_party_lunar"
        id="groom-party-lunar-value"
      />
      <input
        type="hidden"
        name="bride_party_lunar"
        id="bride-party-lunar-value"
      />
      <!-- Section visibility toggles -->
      <input
        type="hidden"
        name="enable_family"
        id="enable_family"
        value="true"
      />
      <input type="hidden" name="enable_party" id="enable_party" value="true" />
      <input
        type="hidden"
        name="enable_photos"
        id="enable_photos"
        value="true"
      />
      <input
        type="hidden"
        name="enable_timeline"
        id="enable_timeline"
        value="true"
      />
      <input
        type="hidden"
        name="enable_love_story"
        id="enable_love_story"
        value="true"
      />
      <input type="hidden" name="enable_music" id="enable_music" value="true" />
      <input type="hidden" name="enable_gift" id="enable_gift" value="true" />
      <input
        type="hidden"
        name="enable_footer"
        id="enable_footer"
        value="true"
      />

      <span id="mount-step-couple" hidden></span>

      <span id="mount-step-ceremony" hidden></span>

      <span id="mount-step-family" hidden></span>

      <span id="mount-step-party" hidden></span>

      <span id="mount-step-photos" hidden></span>

      <span id="mount-step-timeline" hidden></span>

      <span id="mount-step-love_story" hidden></span>

      <span id="mount-step-rsvp" hidden></span>

      <span id="mount-step-gift" hidden></span>

      <span id="mount-step-footer" hidden></span>

      <!-- Điều hướng bước. Nằm TRONG form nên nút phải ghi rõ type="button",
           không thì Enter trong ô nhập sẽ submit. Nội dung do js/20-steps.js đổ.
           Dính đáy để bước nào cũng với tới được mà không phải cuộn hết group.
           `bottom` bám --cx-step-nav-bottom (chiều cao thanh nav dưới) do ai-modal.js
           cập nhật; thẻ AI cũng được đẩy lên trên thanh này nên không đè lên nhau. -->
      <div
        id="step-nav"
        class="sticky z-[46] -mx-4 mt-2 flex items-center gap-3 border-t border-gray-100 bg-white/95 px-4 py-2.5 backdrop-blur"
        style="bottom: var(--cx-step-nav-bottom, 60px)"
      >
        <x-button
          type="button"
          id="step-prev"
          variant="outline"
          tone="neutral"
          onclick="cxStepPrev()"
        >
          <i data-lucide="chevron-left" style="width: 14px; height: 14px"></i>
          Quay lại
        </x-button>
        <span
          id="step-nav-hint"
          class="flex-1 whitespace-nowrap text-center text-[11px] text-gray-400"
        ></span>
        <x-button type="button" id="step-next" onclick="cxStepNext()">
          <span id="step-next-label">Tiếp theo</span>
          <i data-lucide="chevron-right" style="width: 14px; height: 14px"></i>
        </x-button>
      </div>
    </form>
  </div>
</div>
<!-- /form-panel -->
