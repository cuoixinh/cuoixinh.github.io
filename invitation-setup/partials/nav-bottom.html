      <!-- Bottom Navigation Bar -->
      <div
        id="bottom-nav-bar"
        class="fixed bottom-0 left-0 right-0 z-[300] bg-white border-t border-rose-100 shadow-[0_-2px_12px_rgb(var(--scrim-rgb)/0.06)]"
      >
        <!-- Popover của nút "Tùy chọn". Đặt ở tầng navbar (không lồng trong ô
             nút) vì js/21-shell.js tự tính `left` theo tâm nút rồi kẹp trong màn
             hình. Menu ngữ cảnh: hàng danh sách icon + nhãn, KHÔNG dùng
             <x-button> (pill dành cho nút hành động). -->
        <div
          id="nav-more-pop"
          class="cx-nav-pop hidden absolute bottom-full left-0 mb-3 w-60 flex flex-col gap-0.5 rounded-3xl border border-gray-100 bg-white p-1.5 shadow-xl"
          role="menu"
        >
          <button
            type="button"
            id="nav-ai-btn"
            role="menuitem"
            onclick="openAiModal()"
            class="cx-nav-pop-item"
          >
            <span class="cx-nav-pop-ico">
              <i data-lucide="sparkles" style="width: 15px; height: 15px"></i>
            </span>
            Tạo thiệp với AI
          </button>

          <!-- Giao diện: hàng menu chứ không phải tab dưới → trạng thái đang mở
               đánh dấu bằng .is-active (xem .cx-nav-pill). -->
          <button
            type="button"
            id="tab-theme"
            role="menuitem"
            onclick="switchTab('theme')"
            class="cx-nav-pop-item cx-nav-pill relative"
          >
            <span class="cx-nav-pop-ico">
              <i data-lucide="palette" style="width: 15px; height: 15px"></i>
            </span>
            Giao diện
            <span
              class="tab-dirty-star hidden ml-auto text-rose-500 text-[14px] font-bold leading-none"
              title="Có thay đổi chưa lưu"
              >*</span
            >
          </button>
        </div>

        <div class="max-w-4xl mx-auto flex items-stretch">
          <!-- Edit/Preview Switch. lg+ : chỉ còn "Chỉnh sửa" nên cụm này thôi
               đóng vai segmented switch, #switch-edit mặc bộ đồ của các tab khác
               (xem @media trong styles/_setup.css) → bỏ luôn lề và gạch của vỏ. -->
          <div
            class="flex-1 sm:flex-[2] lg:flex-1 flex items-center justify-center px-2 sm:px-3 lg:px-0 border-t-2 border-transparent lg:border-t-0"
          >
            <div id="tour-view-switch" class="flex w-full bg-gray-100 rounded-full p-0.5 gap-0.5">
              <button
                type="button"
                id="switch-edit"
                onclick="switchTab('edit')"
                class="relative flex-1 flex items-center justify-center gap-1 h-8 rounded-full text-[11px] font-semibold bg-white shadow-sm text-gray-700 transition-all"
              >
                <span class="tab-dirty-star hidden absolute top-0.5 right-1.5 lg:top-1 lg:right-3 text-rose-500 text-[13px] font-bold leading-none" title="Có thay đổi chưa lưu">*</span>
                <!-- Cỡ icon bằng class (không phải style inline) để lg đổi được:
                     lucide bê nguyên style sang <svg>, inline thì CSS không đè nổi. -->
                <i data-lucide="pen" class="w-3 h-3 lg:w-5 lg:h-5"></i>
                <span class="hidden sm:inline">Chỉnh sửa</span>
              </button>
              <!-- lg+ : thiệp đã hiện sẵn trong khung điện thoại cạnh form
                   (js/22-live-preview.js) nên không còn chế độ Xem trước riêng —
                   ẩn nút đi, chỉ còn "Chỉnh sửa". -->
              <button
                type="button"
                id="switch-preview"
                onclick="switchTab('preview')"
                class="flex-1 lg:hidden flex items-center justify-center gap-1 h-8 rounded-full text-[11px] font-medium text-gray-400 transition-all"
              >
                <i data-lucide="eye" style="width: 12px; height: 12px"></i>
                <span class="hidden sm:inline">Xem trước</span>
              </button>
            </div>
          </div>
          <button
            type="button"
            onclick="switchTab('config')"
            id="tab-config"
            class="relative flex-none px-3 sm:flex-1 sm:px-0 flex flex-col items-center justify-center gap-1 py-3 text-gray-400 border-t-2 border-transparent transition-colors"
          >
            <span class="tab-dirty-star hidden absolute top-1 right-1.5 sm:right-3 text-rose-500 text-[13px] font-bold leading-none" title="Có thay đổi chưa lưu">*</span>
            <i data-lucide="settings" class="text-base"></i>
            <span class="hidden sm:inline text-[11px] font-medium"
              >Cấu hình</span
            >
          </button>
          <button
            type="button"
            onclick="openGuestsPage(event)"
            id="tab-guests"
            class="flex-none px-3 sm:flex-1 sm:px-0 flex flex-col items-center justify-center gap-1 py-3 text-gray-400 border-t-2 border-transparent transition-colors"
          >
            <i data-lucide="users" class="text-base"></i>
            <span class="hidden sm:inline text-[11px] font-medium"
              >Khách mời</span
            >
          </button>
          <!-- "Tùy chọn" — mở #nav-more-pop ở trên (js/21-shell.js). Dấu * chưa
               lưu của tab Giao diện dội lên chính nút này, vì mục kia nằm trong
               popover nên lúc đóng không ai thấy. -->
          <div class="flex-none lg:flex-1 flex">
            <button
              type="button"
              onclick="cxNavMore()"
              id="nav-more"
              aria-haspopup="true"
              aria-expanded="false"
              aria-controls="nav-more-pop"
              class="relative flex-none px-3 lg:w-full lg:px-0 flex flex-col items-center justify-center gap-1 py-3 text-gray-400 border-t-2 border-transparent transition-colors"
            >
              <span class="tab-dirty-star hidden absolute top-1 right-1.5 lg:right-3 text-rose-500 text-[13px] font-bold leading-none" title="Có thay đổi chưa lưu">*</span>
              <i data-lucide="more-horizontal" class="text-base"></i>
              <span class="hidden sm:inline text-[11px] font-medium"
                >Tùy chọn</span
              >
            </button>
          </div>

          <!-- Cặp nút hành động tách khỏi dãy tab bằng một khe rõ ràng: sát nhau
               thì "Tùy chọn" trông như nằm trong cùng cụm với "Lưu nháp". -->
          <div id="tab-draft-wrap" class="flex-1 flex items-center justify-center px-1.5 py-2 lg:ml-4">
            <button
              type="button"
              onclick="saveDraft()"
              id="tab-draft"
              class="w-full flex items-center justify-center gap-1.5 h-9 rounded-full border border-gray-300 text-gray-500 bg-white text-[11px] font-medium transition-all active:opacity-75"
            >
              <i data-lucide="file-text" style="width: 13px; height: 13px"></i>
              <span>Lưu nháp</span>
            </button>
          </div>
          <div class="flex-1 flex items-center justify-center px-1.5 py-2">
            <button
              type="button"
              onclick="publishWedding()"
              id="tab-publish"
              class="w-full flex items-center justify-center gap-1 h-9 px-1 rounded-full bg-rose-500 text-white text-[11px] font-medium whitespace-nowrap transition-all active:opacity-75"
            >
              <i data-lucide="send" style="width: 13px; height: 13px" class="shrink-0"></i>
              <span>Xuất bản</span>
            </button>
          </div>
        </div>
      </div>
