<!-- Bottom Navigation Bar. Vỏ `fixed` mang nền nền-trang (--surface-tint-rgb)
           để hai bên thẻ nav luôn cùng một màu ở mọi tab; #nav-card mới là thẻ
           NỔI có nền trắng, rộng đúng bằng cột form (max-w-4xl),
           bo tròn 4 góc và cách mép dưới 8px. Chiều cao --nav-h đo ở vỏ này nên
           đã gồm cả khoảng hở đó — thứ gì bám navbar không phải cộng thêm.
           Lề trong của #nav-card chừa chỗ cho pill và vòng focus của ô đầu/cuối,
           đừng bỏ đi nếu không chúng dính vào viền bo. -->
<div
  id="bottom-nav-bar"
  class="fixed bottom-0 left-0 right-0 z-[300] px-2 sm:px-4 pb-2 bg-[rgb(var(--surface-tint-rgb))]"
>
  <div
    id="nav-card"
    class="relative max-w-4xl mx-auto px-1.5 sm:px-2 bg-white border border-rose-100 rounded-3xl shadow-[0_-4px_18px_rgb(var(--scrim-rgb)/0.08)]"
  >
    <!-- Popover của nút "Tùy chọn". Đặt ở tầng #nav-card (không lồng trong ô
             nút) vì js/21-shell.js tự tính `left` theo tâm nút rồi kẹp trong bề
             ngang thẻ. RỖNG trong HTML: các mục .cx-navitem do js/21-shell.js
             chuyển vào đây khi navbar hết chỗ. -->
    <div
      id="nav-more-pop"
      class="cx-nav-pop hidden absolute bottom-full left-0 mb-3 w-60 flex flex-col gap-0.5 rounded-3xl border border-gray-100 bg-white p-1.5 shadow-xl"
      role="menu"
    ></div>

    <div id="nav-row" class="flex items-stretch">
      <!-- Edit/Preview Switch. pad+ (820px): chỉ còn "Chỉnh sửa" nên cụm này
               thôi đóng vai segmented switch, #switch-edit mặc bộ đồ của các tab
               khác (xem @media trong styles/_setup.css) → bỏ luôn lề và gạch của
               vỏ. -->
      <div
        id="switch-wrap"
        class="flex-none flex items-center justify-center px-1 sm:px-3"
      >
        <div
          id="tour-view-switch"
          class="flex w-full bg-gray-100 rounded-full p-0.5 gap-0.5"
        >
          <button
            type="button"
            id="switch-edit"
            onclick="switchTab('edit')"
            class="relative flex-1 flex items-center justify-center gap-1 h-8 rounded-full text-[11px] font-semibold bg-white shadow-sm text-gray-700 transition-all"
          >
            <span
              class="tab-dirty-star hidden absolute top-0.5 right-1.5 pad:top-1 pad:right-3 text-rose-500 text-[13px] font-bold leading-none"
              title="Có thay đổi chưa lưu"
              >*</span
            >
            <!-- Cỡ icon bằng class (không phải style inline) để pad đổi được:
                     lucide bê nguyên style sang <svg>, inline thì CSS không đè nổi. -->
            <i data-lucide="pen" class="w-3 h-3 pad:w-4 pad:h-4"></i>
            <span class="hidden sm:inline">Chỉnh sửa</span>
          </button>
          <!-- pad+ (820px): thiệp đã hiện sẵn trong dải xem trực tiếp bên phải
                   (js/22-live-preview.js) nên không còn chế độ Xem trước riêng —
                   ẩn nút đi, chỉ còn "Chỉnh sửa". -->
          <button
            type="button"
            id="switch-preview"
            onclick="switchTab('preview')"
            class="flex-1 pad:hidden flex items-center justify-center gap-1 h-8 rounded-full text-[11px] font-medium text-gray-400 transition-all"
          >
            <i data-lucide="eye" style="width: 12px; height: 12px"></i>
            <span class="hidden sm:inline">Xem trước</span>
          </button>
        </div>
      </div>

      <!-- Chỗ đứng của các mục tràn được. Mục nào còn chỗ thì ở lại đây, hết
               chỗ mới lùi vào #nav-more-pop — thứ tự ưu tiên khai ở CX_NAV_ITEMS
               (js/21-shell.js), riêng "Cấu hình" ghim cứng, không bao giờ lùi.
               Cùng một phần tử dùng cho cả hai chỗ: hình dạng do CHA quyết định
               (xem .cx-navitem trong styles/_setup.css). -->
      <div id="nav-slots" class="flex items-stretch">
        <button
          type="button"
          onclick="switchTab('config')"
          id="tab-config"
          class="cx-navitem"
        >
          <span class="cx-navitem-ico">
            <i data-lucide="settings"></i>
          </span>
          <span class="cx-navitem-label">Cấu hình</span>
          <span
            class="tab-dirty-star hidden text-rose-500 text-[13px] font-bold leading-none"
            title="Có thay đổi chưa lưu"
            >*</span
          >
        </button>

        <button
          type="button"
          onclick="openGuestsPage(event)"
          id="tab-guests"
          class="cx-navitem"
        >
          <span class="cx-navitem-ico">
            <i data-lucide="users"></i>
          </span>
          <span class="cx-navitem-label">Khách mời</span>
        </button>

        <button
          type="button"
          id="tab-theme"
          onclick="switchTab('theme')"
          class="cx-navitem"
        >
          <span class="cx-navitem-ico">
            <i data-lucide="palette"></i>
          </span>
          <span class="cx-navitem-label">Giao diện</span>
          <span
            class="tab-dirty-star hidden text-rose-500 text-[13px] font-bold leading-none"
            title="Có thay đổi chưa lưu"
            >*</span
          >
        </button>

        <!-- data-cx-new: đánh dấu mục còn mới — chữ trong thuộc tính chính là
             nhãn huy hiệu (xem .cx-navitem[data-cx-new] ở styles/_setup.css).
             Bỏ thuộc tính là huy hiệu biến mất, không phải sửa gì thêm. -->
        <button
          type="button"
          id="nav-ai-btn"
          onclick="openAiModal()"
          class="cx-navitem"
          data-cx-new="Mới"
        >
          <span class="cx-navitem-ico">
            <i data-lucide="sparkles"></i>
          </span>
          <span class="cx-navitem-label">Tạo với AI</span>
        </button>
      </div>

      <!-- "Tùy chọn" — mở #nav-more-pop ở trên. Vỏ ngoài mới là chỗ gắn
               `hidden` (popover rỗng thì ẩn cả nút): cờ đó phải thắng luật hình
               dạng của .cx-navitem nên không đặt thẳng lên nút. Dấu * chưa lưu
               của các mục đang khuất trong popover dội lên chính nút này. -->
      <div id="nav-more-wrap" class="hidden flex items-stretch">
        <button
          type="button"
          onclick="cxNavMore()"
          id="nav-more"
          aria-haspopup="true"
          aria-expanded="false"
          aria-controls="nav-more-pop"
          class="cx-navitem"
        >
          <span class="cx-navitem-ico">
            <i data-lucide="more-horizontal"></i>
          </span>
          <span class="cx-navitem-label">Tùy chọn</span>
          <span
            class="tab-dirty-star hidden text-rose-500 text-[13px] font-bold leading-none"
            title="Có thay đổi chưa lưu"
            >*</span
          >
        </button>
      </div>

      <!-- Cặp nút hành động DỒN SANG PHẢI (`ml-auto` nuốt hết chỗ thừa) —
               dãy tab bên trái vì thế xếp sát nhau từ trái sang, mỗi nút một khổ
               cố định thay vì giãn ra chiếm chỗ trống. Khe `ml-auto` cũng là thứ
               tách chúng khỏi "Tùy chọn", đừng cho nút nào ở đây co giãn. -->
      <div id="nav-actions" class="ml-auto flex items-stretch sm:pl-2">
        <div
          id="tab-draft-wrap"
          class="flex-none flex items-center justify-center px-1 sm:px-1.5 py-2"
        >
          <!-- Khổ riêng (h-9, chữ 11px) chồng lên khổ `sm` của <x-button>: hàng
               navbar thấp hơn nút thường. Màu nền/viền do _setDirty() đổi theo
               trạng thái chưa lưu, nên đừng thêm tone khác ở đây. -->
          <x-button
            type="button"
            onclick="saveDraft()"
            id="tab-draft"
            variant="outline"
            tone="neutral"
            size="sm"
            full
            title="Lưu nháp"
            aria-label="Lưu nháp"
            class="h-9 gap-1.5 px-3 sm:px-4 text-[11px] font-medium"
          >
            <i data-lucide="file-text" class="w-3.5 h-3.5 shrink-0"></i>
            <span>Lưu nháp</span>
          </x-button>
        </div>
        <div
          id="tab-publish-wrap"
          class="flex-none flex items-center justify-center px-1 sm:px-1.5 py-2"
        >
          <x-button
            type="button"
            onclick="publishWedding()"
            id="tab-publish"
            size="sm"
            full
            class="h-9 gap-1.5 px-3 sm:px-4 text-[11px] font-medium"
          >
            <i data-lucide="send" class="w-3.5 h-3.5 shrink-0"></i>
            <span>Xuất bản</span>
          </x-button>
        </div>
      </div>
    </div>
  </div>
</div>
