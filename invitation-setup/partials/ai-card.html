    <!-- Thẻ Soft "Tạo với AI" — nổi góc dưới-phải, hiển thị ở cả PC lẫn mobile.
         Ẩn khi đang skeleton (hidden-boot), gỡ trong _showContent() khi content hiện. -->
    <div class="ai-fab hidden-boot">
      <!-- Thẻ mời (glassmorphism) — bấm cả thẻ hoặc nút để mở popup AI -->
      <div
        class="ai-card"
        role="button"
        tabindex="0"
        onclick="openAiModal()"
        aria-label="Tạo nội dung bằng AI"
      >
        <x-button variant="ghost" icon-only type="button" aria-label="Đóng gợi ý" title="Đóng gợi ý" onclick="
            event.stopPropagation();
            dismissAiFab();
          " class="ai-fab-close">
          <i data-lucide="x"></i>
        </x-button>
        <div class="ai-icon"><i data-lucide="sparkles"></i></div>
        <div class="ai-title">Tạo thiệp với AI</div>
        <div class="ai-desc">
          Vài dòng thông tin, AI hoàn thiện cả tấm thiệp.
        </div>
        <x-button tone="neutral" full type="button" onclick="
            event.stopPropagation();
            openAiModal();
          ">
          Thử ngay ✨
        </x-button>
      </div>
      <!-- Nút thu gọn: hiện sau khi đóng thẻ, vẫn là lối vào AI -->
      <x-button variant="bare" type="button" onclick="openAiModal()" aria-label="Tạo nội dung bằng AI" data-tooltip="Tạo thiệp với AI" data-tooltip-pos="left" class="ai-mini">
        <i data-lucide="sparkles"></i>
      </x-button>
    </div>
