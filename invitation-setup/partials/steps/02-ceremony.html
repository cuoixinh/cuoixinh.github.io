<!-- Bước "Sự kiện cưới" — một mục trong CX_STEPS (js/20-steps.js).
     Chèn vào #mount-step-ceremony của form-panel.html; khai báo ở STEP_PARTIALS (loader.js). -->
<div data-step="ceremony"
  class="cx-block animate-fade-in"
>
  <div id="section-ceremony-body" class="px-4 py-5 sm:p-6 space-y-4">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <x-date label="Ngày cưới" name="ceremony_date" required></x-date>
      <x-input
        label="Tên nghi lễ"
        name="ceremony_name"
        icon="tag"
        placeholder="Lễ thành hôn"
      ></x-input>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <x-time label="Giờ tổ chức lễ" name="ceremony_time"></x-time>
    </div>
    <p id="ceremony-lunar-display" class="text-sm text-gray-500 italic">
      Chọn ngày để tự động tính ngày âm lịch
    </p>
    <div class="space-y-3">
        <label for="ceremony_map_query" class="text-sm font-medium text-gray-800 flex items-center gap-2">
          <i data-lucide="map-pin" class="text-color-secondary"></i>Địa điểm lễ cưới
        </label>
        <!-- Ô vị trí không có name (không vào FormData): nó chỉ dựng ceremony_map_embed_url
             (maps-helper.js → cxMapFromQuery). Tên khách thấy là ô ceremony_location. -->
        <div>
          <x-input
            id="ceremony_map_query"
            label="Vị trí trên bản đồ"
            placeholder="Nhập tên vị trí hoặc tọa độ trên Maps"
            suffix-btn-label="Bản đồ"
            suffix-btn-icon="map-pin"
            suffix-btn-action="openMapPicker('ceremony')"
          ></x-input>
          <p class="mt-1.5 text-xs text-gray-400">Ví dụ: GEM Center Nguyễn Bỉnh Khiêm, hoặc <x-button variant="bare" onclick="openCoordGuide()" class="cx-coord-help" title="Xem cách lấy tọa độ">tọa độ</x-button> chép từ Google Maps.</p>
        </div>
        <x-input
          name="ceremony_location"
          label="Tên hiện trên thiệp"
          placeholder="Ví dụ: Trung tâm hội nghị tiệc cưới GEM Center, 8 Nguyễn Bỉnh Khiêm, TP.HCM"
        ></x-input>
        <input type="hidden" name="ceremony_map_embed_url" id="ceremony_map_embed_url" />
        <div id="ceremony-map-display" class="hidden"></div>
      </div>
    <div class="pt-2 border-t border-gray-100">
      <div class="flex items-center justify-between gap-3">
        <div>
          <p class="text-sm font-medium text-gray-700">Lễ vu quy</p>
          <p class="text-xs text-gray-400 mt-0.5">
            Hiển thị thay cho lễ thành hôn trong thiệp nhà gái
          </p>
        </div>
        <input
          type="hidden"
          name="vu_quy_enabled"
          id="vu_quy_enabled"
          value="true"
        />
        <x-switch key="vu-quy" onclick="toggleVuQuy(event)"></x-switch>
      </div>
      <div id="vu-quy-fields" class="space-y-4 mt-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <x-date label="Ngày vu quy" name="vu_quy_date"></x-date>
          <x-time label="Giờ vu quy" name="vu_quy_time"></x-time>
        </div>
        <!-- Bỏ trống ngày = cùng ngày lễ thành hôn (thiệp tự lấy ceremony_date). -->
        <p id="vu-quy-lunar-display" class="text-sm text-gray-500 italic">
          Bỏ trống thì lấy theo ngày lễ thành hôn
        </p>
        <div class="space-y-3">
        <label for="vu_quy_map_query" class="text-sm font-medium text-gray-800 flex items-center gap-2">
          <i data-lucide="map-pin" class="text-color-secondary"></i>Địa điểm vu quy
        </label>
        <!-- Ô vị trí không có name (không vào FormData): nó chỉ dựng vu_quy_map_embed_url
             (maps-helper.js → cxMapFromQuery). Tên khách thấy là ô vu_quy_location. -->
        <div>
          <x-input
            id="vu_quy_map_query"
            label="Vị trí trên bản đồ"
            placeholder="Nhập tên vị trí hoặc tọa độ trên Maps"
            suffix-btn-label="Bản đồ"
            suffix-btn-icon="map-pin"
            suffix-btn-action="openMapPicker('vu_quy')"
          ></x-input>
          <p class="mt-1.5 text-xs text-gray-400">Ví dụ: Trống Đồng Palace Hoàng Quốc Việt, hoặc <x-button variant="bare" onclick="openCoordGuide()" class="cx-coord-help" title="Xem cách lấy tọa độ">tọa độ</x-button> chép từ Google Maps.</p>
        </div>
        <x-input
          name="vu_quy_location"
          label="Tên hiện trên thiệp"
          placeholder="Ví dụ: Nhà hàng tiệc cưới Trống Đồng Palace, 489 Hoàng Quốc Việt, Hà Nội"
        ></x-input>
        <input type="hidden" name="vu_quy_map_embed_url" id="vu_quy_map_embed_url" />
        <div id="vu_quy-map-display" class="hidden"></div>
      </div>
      </div>
    </div>
  </div>
</div>
