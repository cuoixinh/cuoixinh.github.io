<!-- Bước "Hộp mừng cưới" — một mục trong CX_STEPS (js/20-steps.js).
     Chèn vào #mount-step-gift của form-panel.html; khai báo ở STEP_PARTIALS (loader.js). -->
<div data-step="gift"
  class="cx-block animate-fade-in"
>
  <!-- Tiêu đề bước nằm ở #step-head (form-panel.html); hàng này chỉ còn
       công tắc bật/tắt mục trên thiệp. -->
  <div class="cx-block-head">
    <div class="cx-vis">
      <div class="min-w-0">
        <p class="cx-vis-t">Hiện mục này trên thiệp</p>
        <p class="cx-vis-d">Mục đang ẩn — bật lên để điền và hiện trên thiệp.</p>
      </div>
      <x-switch
        key="gift"
        onclick="toggleSectionVis('gift', event)"
      ></x-switch>
    </div>
  </div>
  <div id="section-gift-body" class="px-4 py-5 sm:p-6 space-y-6">
    <div class="overflow-hidden sm:rounded-2xl sm:border sm:border-gray-100">
      <div
        class="pb-3 sm:px-5 sm:py-3 sm:bg-rose-50 sm:border-b sm:border-rose-100 flex items-center gap-2"
      >
        <i data-lucide="mars" class="w-4 h-4 text-color-secondary"></i>
        <span class="text-sm font-semibold text-gray-700">Nhà trai</span>
      </div>
      <div class="sm:p-5 space-y-4">
        <div class="relative">
          <label
            for="groom-bank-input"
            class="block text-sm text-gray-700 mb-2 flex items-center gap-2"
            ><i data-lucide="landmark" class="text-color-secondary"></i
            >Tên ngân hàng</label
          >
          <input
            type="text"
            id="groom-bank-input"
            placeholder="Tìm theo tên hoặc mã ngân hàng..."
            class="w-full h-10 px-3 border border-gray-200 rounded-lg text-sm text-gray-800 bg-white outline-none transition-all placeholder:text-gray-400/50 focus:ring-2 focus:ring-rose-500/30"
            autocomplete="off"
          />
          <input
            type="hidden"
            name="groom_bank_name"
            id="groom-bank-value"
          />
          <div
            id="groom-bank-dropdown"
            class="hidden absolute z-10 w-full mt-1 bg-white border border-gray-200 rounded-2xl shadow-lg max-h-60 overflow-y-auto"
          ></div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <x-input
            label="Số tài khoản"
            name="groom_bank_number"
            icon="credit-card"
            placeholder="Ví dụ: 0123456789"
            mono
          ></x-input>
          <x-input
            label="Tên chủ tài khoản"
            name="groom_bank_owner"
            icon="user"
            placeholder="Ví dụ: DOAN QUANG VINH"
            uppercase
          ></x-input>
        </div>
        <div>
          <p
            class="block text-sm text-gray-700 mb-2 flex items-center gap-2"
            ><i data-lucide="qr-code" class="text-color-secondary"></i>Ảnh
            QR chuyển khoản</p>
          <div id="groom-qr-container" class="w-full"></div>
          <input
            type="file"
            id="groom-qr-file-input"
            accept="image/jpeg,image/png,image/webp,image/gif,image/avif"
            class="hidden"
            onchange="handleImageUpload(event, 'groom_qr_url')"
          />
        </div>
      </div>
    </div>
    <div class="overflow-hidden sm:rounded-2xl sm:border sm:border-gray-100">
      <div
        class="pb-3 sm:px-5 sm:py-3 sm:bg-rose-50 sm:border-b sm:border-rose-100 flex items-center gap-2"
      >
        <i data-lucide="venus" class="w-4 h-4 text-color-secondary"></i>
        <span class="text-sm font-semibold text-gray-700">Nhà gái</span>
      </div>
      <div class="sm:p-5 space-y-4">
        <div class="relative">
          <label
            for="bride-bank-input"
            class="block text-sm text-gray-700 mb-2 flex items-center gap-2"
            ><i data-lucide="landmark" class="text-color-secondary"></i
            >Tên ngân hàng</label
          >
          <input
            type="text"
            id="bride-bank-input"
            placeholder="Tìm theo tên hoặc mã ngân hàng..."
            class="w-full h-10 px-3 border border-gray-200 rounded-lg text-sm text-gray-800 bg-white outline-none transition-all placeholder:text-gray-400/50 focus:ring-2 focus:ring-rose-500/30"
            autocomplete="off"
          />
          <input
            type="hidden"
            name="bride_bank_name"
            id="bride-bank-value"
          />
          <div
            id="bride-bank-dropdown"
            class="hidden absolute z-10 w-full mt-1 bg-white border border-gray-200 rounded-2xl shadow-lg max-h-60 overflow-y-auto"
          ></div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <x-input
            label="Số tài khoản"
            name="bride_bank_number"
            icon="credit-card"
            placeholder="Ví dụ: 0987654321"
            mono
          ></x-input>
          <x-input
            label="Tên chủ tài khoản"
            name="bride_bank_owner"
            icon="user"
            placeholder="Ví dụ: VUONG THI HAI YEN"
            uppercase
          ></x-input>
        </div>
        <div>
          <p
            class="block text-sm text-gray-700 mb-2 flex items-center gap-2"
            ><i data-lucide="qr-code" class="text-color-secondary"></i>Ảnh
            QR chuyển khoản</p>
          <div id="bride-qr-container" class="w-full"></div>
          <input
            type="file"
            id="bride-qr-file-input"
            accept="image/jpeg,image/png,image/webp,image/gif,image/avif"
            class="hidden"
            onchange="handleImageUpload(event, 'bride_qr_url')"
          />
        </div>
      </div>
    </div>
  </div>
</div>
