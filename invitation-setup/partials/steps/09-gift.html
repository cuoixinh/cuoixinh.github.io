<!-- Bước "Hộp mừng cưới" — một mục trong CX_STEPS (js/20-steps.js).
     Chèn vào #mount-step-gift của form-panel.html; khai báo ở STEP_PARTIALS (loader.js). -->
<div data-step="gift"
  class="bg-white rounded-xl overflow-hidden animate-fade-in border border-gray-200"
>
  <div
    class="bg-white px-6 py-4 border-b border-gray-100"
  >
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i
          data-lucide="gift"
          class="text-[18px] text-color-secondary"
        ></i>
        <p class="text-sm text-gray-700">Hộp mừng cưới</p>
      </div>
      <div class="flex items-center gap-3">
        <x-switch
          key="gift"
          onclick="toggleSectionVis('gift', event)"
        ></x-switch>
      </div>
    </div>
  </div>
  <div id="section-gift-body" class="p-6 space-y-6">
    <div class="rounded-2xl border border-gray-100 overflow-hidden">
      <div
        class="px-5 py-3 bg-rose-50 border-b border-rose-100 flex items-center gap-2"
      >
        <i data-lucide="mars" class="w-4 h-4 text-color-secondary"></i>
        <span class="text-sm font-semibold text-gray-700">Nhà trai</span>
      </div>
      <div class="p-5 space-y-4">
        <div class="relative">
          <label
            class="block text-sm text-gray-700 mb-2 flex items-center gap-2"
            ><i data-lucide="landmark" class="text-color-secondary"></i
            >Tên ngân hàng</label
          >
          <input
            type="text"
            id="groom-bank-input"
            placeholder="Tìm theo tên hoặc mã ngân hàng..."
            class="w-full h-10 px-3 py-2 border border-gray-200 rounded-md text-sm text-gray-800 bg-white outline-none transition-all placeholder:text-gray-400/50 focus:ring-2 focus:ring-rose-500/30 focus:ring-offset-2"
            autocomplete="off"
          />
          <input
            type="hidden"
            name="groom_bank_name"
            id="groom-bank-value"
          />
          <div
            id="groom-bank-dropdown"
            class="hidden absolute z-10 w-full mt-1 bg-white border border-gray-200 rounded-2xl shadow-lg max-h-60 overflow-y-auto"
          ></div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <x-input
            label="Số tài khoản"
            name="groom_bank_number"
            icon="credit-card"
            placeholder="Ví dụ: 0123456789"
            mono
          ></x-input>
          <x-input
            label="Tên chủ tài khoản"
            name="groom_bank_owner"
            icon="user"
            placeholder="Ví dụ: DOAN QUANG VINH"
            uppercase
          ></x-input>
        </div>
        <div>
          <label
            class="block text-sm text-gray-700 mb-2 flex items-center gap-2"
            ><i data-lucide="qr-code" class="text-color-secondary"></i>Ảnh
            QR chuyển khoản</label
          >
          <div id="groom-qr-container" class="w-32"></div>
          <input
            type="file"
            id="groom-qr-file-input"
            accept="image/jpeg,image/png,image/webp,image/gif,image/avif"
            class="hidden"
            onchange="handleImageUpload(event, 'groom_qr_url')"
          />
        </div>
      </div>
    </div>
    <div class="rounded-2xl border border-gray-100 overflow-hidden">
      <div
        class="px-5 py-3 bg-rose-50 border-b border-rose-100 flex items-center gap-2"
      >
        <i data-lucide="venus" class="w-4 h-4 text-color-secondary"></i>
        <span class="text-sm font-semibold text-gray-700">Nhà gái</span>
      </div>
      <div class="p-5 space-y-4">
        <div class="relative">
          <label
            class="block text-sm text-gray-700 mb-2 flex items-center gap-2"
            ><i data-lucide="landmark" class="text-color-secondary"></i
            >Tên ngân hàng</label
          >
          <input
            type="text"
            id="bride-bank-input"
            placeholder="Tìm theo tên hoặc mã ngân hàng..."
            class="w-full h-10 px-3 py-2 border border-gray-200 rounded-md text-sm text-gray-800 bg-white outline-none transition-all placeholder:text-gray-400/50 focus:ring-2 focus:ring-rose-500/30 focus:ring-offset-2"
            autocomplete="off"
          />
          <input
            type="hidden"
            name="bride_bank_name"
            id="bride-bank-value"
          />
          <div
            id="bride-bank-dropdown"
            class="hidden absolute z-10 w-full mt-1 bg-white border border-gray-200 rounded-2xl shadow-lg max-h-60 overflow-y-auto"
          ></div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <x-input
            label="Số tài khoản"
            name="bride_bank_number"
            icon="credit-card"
            placeholder="Ví dụ: 0987654321"
            mono
          ></x-input>
          <x-input
            label="Tên chủ tài khoản"
            name="bride_bank_owner"
            icon="user"
            placeholder="Ví dụ: VUONG THI HAI YEN"
            uppercase
          ></x-input>
        </div>
        <div>
          <label
            class="block text-sm text-gray-700 mb-2 flex items-center gap-2"
            ><i data-lucide="qr-code" class="text-color-secondary"></i>Ảnh
            QR chuyển khoản</label
          >
          <div id="bride-qr-container" class="w-32"></div>
          <input
            type="file"
            id="bride-qr-file-input"
            accept="image/jpeg,image/png,image/webp,image/gif,image/avif"
            class="hidden"
            onchange="handleImageUpload(event, 'bride_qr_url')"
          />
        </div>
      </div>
    </div>
  </div>
</div>
