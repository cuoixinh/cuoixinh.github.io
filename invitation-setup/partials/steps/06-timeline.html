<!-- Bước "Lịch trình ngày cưới" — một mục trong CX_STEPS (js/20-steps.js).
     Chèn vào #mount-step-timeline của form-panel.html; khai báo ở STEP_PARTIALS (loader.js). -->
<div data-step="timeline"
  class="cx-block animate-fade-in"
>
  <!-- Tiêu đề bước nằm ở #step-head (form-panel.html); hàng này chỉ còn
       công tắc bật/tắt mục trên thiệp. -->
  <div class="cx-block-head">
    <div class="cx-vis">
      <div class="min-w-0">
        <p class="cx-vis-t">Hiện mục này trên thiệp</p>
        <p class="cx-vis-d">Mục đang ẩn — bật lên để điền và hiện trên thiệp.</p>
      </div>
      <x-switch
        key="timeline"
        onclick="toggleSectionVis('timeline', event)"
      ></x-switch>
    </div>
  </div>
  <div id="section-timeline-body" class="px-4 pt-4 pb-6 space-y-3">
    <!-- Tick = MỘT lịch trình cho cả hai link; bỏ tick = dải Nhà trai / Nhà gái, mỗi bên một
         danh sách riêng (js/14-timeline-story.js). Mỗi ngày tự đặt tên + ngày. -->
    <x-check
      key="timeline-shared"
      label="Dùng chung cho cả hai nhà"
      checked
      onchange="toggleTimelineShared(event)"
    ></x-check>
    <div id="timeline-seg-wrap" class="hidden">
    <div id="timeline-seg" class="cx-seg" style="--n: 2" role="tablist">
      <button
        type="button"
        role="tab"
        aria-selected="true"
        onclick="switchTimelineSide('groom')"
        id="timeline-tab-groom"
        class="cx-seg-btn is-on"
      >
        <i data-lucide="mars" class="w-3.5 h-3.5"></i> Nhà trai
      </button>
      <button
        type="button"
        role="tab"
        aria-selected="false"
        onclick="switchTimelineSide('bride')"
        id="timeline-tab-bride"
        class="cx-seg-btn"
      >
        <i data-lucide="venus" class="w-3.5 h-3.5"></i> Nhà gái
      </button>
    </div>
    </div>
    <div id="timeline-days" class="space-y-3"></div>
    <x-button variant="outline" type="button" onclick="addTimelineDay()">
      <i data-lucide="calendar-plus"></i> Thêm ngày
    </x-button>
  </div>
</div>
