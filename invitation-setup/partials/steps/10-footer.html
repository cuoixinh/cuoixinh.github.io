<!-- Bước "Lời cảm ơn / Footer" — một mục trong CX_STEPS (js/20-steps.js).
     Chèn vào #mount-step-footer của form-panel.html; khai báo ở STEP_PARTIALS (loader.js). -->
<div data-step="footer"
  class="cx-block animate-fade-in"
>
  <!-- Tiêu đề bước nằm ở #step-head (form-panel.html); hàng này chỉ còn
       công tắc bật/tắt mục trên thiệp. -->
  <div class="cx-block-head">
    <div class="cx-vis">
      <div class="min-w-0">
        <p class="cx-vis-t">Hiện mục này trên thiệp</p>
        <p class="cx-vis-d">Mục đang ẩn — bật lên để điền và hiện trên thiệp.</p>
      </div>
      <x-switch
        key="footer"
        onclick="toggleSectionVis('footer', event)"
      ></x-switch>
    </div>
  </div>
  <div id="section-footer-body" class="px-4 py-5 sm:p-6 space-y-4">
    <x-textarea
      label="Lời cảm ơn / Footer"
      icon="heart"
      name="footer_text"
      placeholder="Ví dụ: Trân trọng cảm ơn sự hiện diện của quý khách. Sự có mặt của bạn là niềm vinh hạnh lớn nhất của chúng tôi."
    ></x-textarea>
  </div>
</div>
