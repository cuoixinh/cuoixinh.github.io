<!-- Bước "Câu chuyện tình yêu" — một mục trong CX_STEPS (js/20-steps.js).
     Chèn vào #mount-step-love_story của form-panel.html; khai báo ở STEP_PARTIALS (loader.js). -->
<div data-step="love_story"
  class="bg-white rounded-xl overflow-hidden animate-fade-in border border-gray-200"
>
  <div
    class="bg-white px-6 py-4 border-b border-gray-100"
  >
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i
          data-lucide="heart"
          class="text-[18px] text-color-secondary"
        ></i>
        <p class="text-sm text-gray-700">Câu chuyện tình yêu</p>
      </div>
      <div class="flex items-center gap-3">
        <x-switch
          key="love_story"
          onclick="toggleSectionVis('love_story', event)"
        ></x-switch>
      </div>
    </div>
  </div>
  <div id="section-love_story-body" class="p-6 space-y-4">
    <div class="flex items-start justify-between gap-3">
      <p class="text-xs text-gray-500">
        Kể lại hành trình tình yêu của hai bạn. Ví dụ: lần đầu gặp, ngày
        hẹn hò, ngày cầu hôn...
      </p>
      <x-button variant="bare" type="button" onclick="toggleLoveAiPanel()" class="btn-ai flex-shrink-0">
        <i data-lucide="pencil-sparkles" class="w-4 h-4"></i> Tạo bằng AI
      </x-button>
    </div>

    <!-- Panel nhập chuyện tình (ẩn mặc định) — AI tách thành từng mốc -->
    <div
      id="love-ai-panel"
      class="hidden rounded-xl border border-violet-200 bg-violet-50/50 p-4 space-y-3"
    >
      <label class="block text-xs font-medium text-violet-700">
        Kể tự do câu chuyện của hai bạn, AI sẽ tự tách thành các mốc
      </label>
      <textarea
        id="love-ai-input"
        style="height: 130px"
        placeholder="Ví dụ: Tụi mình quen nhau mùa thu 2019 khi học chung lớp tiếng Anh. Năm sau thì chính thức yêu, cùng nhau đi phượt Đà Lạt. Đến Giáng sinh 2022 anh cầu hôn trong bất ngờ..."
        class="w-full px-3 py-2.5 rounded-lg border border-violet-200 text-sm text-gray-700 bg-white outline-none focus:border-violet-400 resize-y placeholder:text-gray-400/60"
      ></textarea>
      <div class="flex items-center gap-2">
        <x-button variant="bare" type="button" onclick="generateLoveStoryAi(this)" class="btn-ai">
          <i data-lucide="pencil-sparkles" class="w-4 h-4"></i> Tạo
        </x-button>
        <x-button variant="outline" tone="neutral" type="button" onclick="toggleLoveAiPanel(false)">
          Đóng
        </x-button>
        <span class="text-xs text-gray-400"
          >Lưu ý: sẽ thay các mốc hiện có</span
        >
      </div>
    </div>

    <div id="love-story-list" class="space-y-3"></div>
    <x-button type="button" onclick="addLoveStoryItem()" class="mt-2">
      <i data-lucide="plus"></i> Thêm mốc
    </x-button>
  </div>
</div>
