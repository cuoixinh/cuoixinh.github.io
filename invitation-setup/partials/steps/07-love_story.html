<!-- Bước "Câu chuyện tình yêu" — một mục trong CX_STEPS (js/20-steps.js).
     Chèn vào #mount-step-love_story của form-panel.html; khai báo ở STEP_PARTIALS (loader.js). -->
<div data-step="love_story"
  class="cx-block animate-fade-in"
>
  <!-- Tiêu đề bước nằm ở #step-head (form-panel.html); hàng này chỉ còn
       công tắc bật/tắt mục trên thiệp. -->
  <div class="cx-block-head">
    <div class="cx-vis">
      <div class="min-w-0">
        <p class="cx-vis-t">Hiện mục này trên thiệp</p>
        <p class="cx-vis-d">Mục đang ẩn — bật lên để điền và hiện trên thiệp.</p>
      </div>
      <x-switch
        key="love_story"
        onclick="toggleSectionVis('love_story', event)"
      ></x-switch>
    </div>
  </div>
  <div id="section-love_story-body" class="px-4 py-5 sm:p-6 space-y-4">
    <!-- Đầu sợi chỉ thời gian (.cx-ls-head ở styles/_setup.css): chỉ hiện khi đã có
         mốc — lúc rỗng khối .cx-empty dưới danh sách lo phần giới thiệu + hai nút.
         #love-count do renderLoveStoryList() điền. aria-expanded do toggleLoveAiPanel() đặt. -->
    <div class="cx-ls-head">
      <span class="cx-ls-head-ico" aria-hidden="true">
        <i data-lucide="book-heart" style="width: 14px; height: 14px"></i>
      </span>
      <div class="min-w-0">
        <p class="cx-ls-head-t">Hành trình của hai bạn</p>
        <p id="love-count" class="cx-ls-head-d"></p>
      </div>
      <!-- Chỉ hiện khi có từ 2 mốc (renderLoveStoryList gạt .hidden). -->
      <x-button
        id="love-sort-btn"
        variant="bare"
        type="button"
        onclick="openLoveStorySort(this)"
        aria-haspopup="dialog"
        class="cx-ls-sort hidden"
      >
        <i data-lucide="arrow-down-up" style="width: 14px; height: 14px"></i> Sắp xếp
      </x-button>
      <x-button
        id="love-ai-toggle"
        variant="bare"
        type="button"
        onclick="toggleLoveAiPanel()"
        aria-expanded="false"
        aria-controls="love-ai-panel"
        class="btn-ai"
      >
        <i data-icon="xuxi" data-size="18"></i> Viết lại bằng XuXi AI
      </x-button>
    </div>

    <!-- Khung kể chuyện cho XuXi tách thành các mốc (ẩn mặc định). Style ở
         .cx-ai-panel (styles/_setup.css). -->
    <div id="love-ai-panel" class="cx-ai-panel hidden animate-fade-in">
      <div class="cx-ai-panel-head">
        <i data-icon="xuxi" data-size="20"></i>
        <p class="flex-1 text-sm font-semibold">XuXi chia mốc giúp bạn</p>
        <x-button
          variant="ghost"
          tone="neutral"
          size="sm"
          icon-only
          type="button"
          onclick="toggleLoveAiPanel(false)"
          aria-label="Đóng khung tạo bằng AI"
          title="Đóng"
        >
          <i data-lucide="x" class="w-4 h-4"></i>
        </x-button>
      </div>

      <div class="space-y-2 p-4">
        <label for="love-ai-input" class="block text-sm text-gray-700">
          Kể tự do câu chuyện của hai bạn
        </label>
        <!-- id chuyển xuống <textarea> con. Thanh Mic + Hoàn tác/Làm lại do
             js/19-ai-optimize.js gắn (attachUndoRedo) sau khi nạp xong. -->
        <x-textarea
          bare
          id="love-ai-input"
          height="128px"
          placeholder="Ví dụ: Tụi mình quen nhau mùa thu 2019 khi học chung lớp tiếng Anh. Năm sau thì chính thức yêu, cùng nhau đi phượt Đà Lạt. Đến Giáng sinh 2022 anh cầu hôn trong bất ngờ..."
          input-class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm text-gray-800 bg-white outline-none transition-all placeholder:text-gray-400/50 focus:border-gray-400 resize-none"
        ></x-textarea>
      </div>

      <div class="cx-ai-panel-foot">
        <!-- Chỉ hiện khi danh sách đang có mốc (CSS dò #love-story-list:empty). -->
        <p class="cx-ai-warn">
          <i data-lucide="triangle-alert" style="width: 14px; height: 14px"></i>
          Các mốc đang có sẽ bị thay
        </p>
        <!-- Hai nhãn đổi nhau theo data-loading mà generateLoveStoryAi đặt lên nút. -->
        <x-button
          type="button"
          onclick="generateLoveStoryAi(this)"
          class="ml-auto"
        >
          <i data-icon="xuxi" data-size="18"></i>
          <span class="cx-idle-lbl">Tách mốc</span>
          <span class="cx-busy-lbl">XuXi đang viết…</span>
        </x-button>
      </div>
    </div>

    <div id="love-story-list"></div>
    <!-- Gợi ý khi danh sách rỗng: CSS tự hiện khi #love-story-list không có con
         (.cx-empty ở styles/_setup.css), nên phải đứng NGAY sau danh sách. Lúc
         rỗng, hai nút trong khối này thay cho nút "Tạo bằng AI" đầu bước và nút
         "Thêm mốc" cuối sợi chỉ (CSS giấu hai nút kia, ẩn khối khi khung XuXi mở). -->
    <!-- Cùng dáng cửa chọn chế độ của chat XuXi (.aichat-gate): hai thẻ đứng cạnh
         nhau, bấm là làm luôn. Thẻ viết <button> tay (ngoại lệ "thẻ tuỳ chọn"). -->
    <div class="cx-empty cx-ls-empty">
      <p class="cx-ls-empty-hd">Bạn muốn kể chuyện tình yêu thế nào?</p>
      <div class="cx-ls-opts">
        <button type="button" class="cx-ls-opt" onclick="toggleLoveAiPanel(true)" aria-controls="love-ai-panel">
          <span class="cx-ls-opt-t"><span class="cx-ls-opt-r" aria-hidden="true"></span>Tạo bằng XuXi AI</span>
          <span class="cx-ls-opt-s">Kể vài dòng về hai bạn, XuXi tách thành từng mốc và viết lời cho mỗi mốc.</span>
          <span class="cx-ls-opt-fig" aria-hidden="true">
            <img src="/assets/images/chat/mode-tao-thiep.svg" alt="" loading="lazy" />
          </span>
        </button>
        <button type="button" class="cx-ls-opt" onclick="addLoveStoryItem()">
          <span class="cx-ls-opt-t"><span class="cx-ls-opt-r" aria-hidden="true"></span>Tự thêm mốc</span>
          <span class="cx-ls-opt-s">Thêm từng mốc rồi điền thời gian, tên mốc và lời kể, kèm ảnh nếu muốn.</span>
          <span class="cx-ls-opt-fig" aria-hidden="true">
            <img src="/assets/images/setup/love-story-manual.svg" alt="" loading="lazy" />
          </span>
        </button>
      </div>
    </div>
    <!-- Đầu mút sợi chỉ thời gian: vòng rỗng + nút thêm mốc kế tiếp. -->
    <div id="love-add-btn" class="cx-ls-end">
      <x-button type="button" variant="dashed" full onclick="addLoveStoryItem()">
        <i data-lucide="plus"></i> Thêm mốc
      </x-button>
    </div>
  </div>
</div>
