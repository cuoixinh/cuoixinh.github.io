<!-- Bước "Xác nhận tham dự (RSVP)" — một mục trong CX_STEPS (js/20-steps.js).
     Chèn vào #mount-step-rsvp của form-panel.html; khai báo ở STEP_PARTIALS (loader.js). -->
<div data-step="rsvp"
  class="cx-block animate-fade-in"
>
  <div class="cx-block-head">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i
          data-lucide="circle-check"
          class="text-[18px] text-color-secondary"
        ></i>
        <p class="text-sm text-gray-700">Xác nhận tham dự</p>
      </div>
      <div class="flex items-center gap-3">
        <x-switch
          key="rsvp"
          onclick="toggleSectionVis('rsvp', event)"
        ></x-switch>
      </div>
    </div>
  </div>
  <div id="section-rsvp-body" class="p-6 space-y-6">
    <div>
      <x-textarea
        label="Lời nhắn xác nhận tham dự"
        icon="message-circle"
        name="rsvp_message"
        placeholder="Ví dụ: Sự có mặt của bạn là món quà ý nghĩa nhất với chúng mình."
      ></x-textarea>
    </div>

    <!-- Lời chúc đi cùng bước RSVP (không phải một bước riêng): cùng là chuyện
         khách mời phản hồi trên thiệp. Công tắc khai ở SECTION_VIS_FIELDS
         (js/03-form-sections.js) → ghi vào ô ẩn #enable_wishes của form. -->
    <div class="pt-2 border-t border-gray-100">
      <div class="flex items-center justify-between gap-4">
        <div class="flex items-center gap-2">
          <i data-lucide="message-square-heart" class="text-[18px] text-color-secondary"></i>
          <p class="text-sm text-gray-700">Cho khách mời gửi lời chúc</p>
        </div>
        <x-switch
          key="wishes"
          onclick="toggleSectionVis('wishes', event)"
        ></x-switch>
      </div>
      <p class="mt-2 text-xs text-gray-500">
        Thiệp hiện mục Lời chúc và một ô viết ghim ở đáy màn hình. Chỉ khách mời
        nhận thiệp riêng mới gửi được (tối đa 3 lời chúc mỗi người); ai mở thiệp
        cũng đọc được danh sách.
      </p>
    </div>
  </div>
</div>
