<!-- Bước "Tiệc cưới" — một mục trong CX_STEPS (js/20-steps.js).
     Chèn vào #mount-step-party của form-panel.html; khai báo ở STEP_PARTIALS (loader.js). -->
<div data-step="party"
  class="cx-block animate-fade-in"
>
  <!-- Tiêu đề bước nằm ở #step-head (form-panel.html); hàng này chỉ còn
       công tắc bật/tắt mục trên thiệp. -->
  <div class="cx-block-head">
    <div class="cx-vis">
      <div class="min-w-0">
        <p class="cx-vis-t">Hiện mục này trên thiệp</p>
        <p class="cx-vis-d">Mục đang ẩn — bật lên để điền và hiện trên thiệp.</p>
      </div>
      <x-switch
        key="party"
        onclick="toggleSectionVis('party', event)"
      ></x-switch>
    </div>
  </div>
  <div id="section-party-body">
    <!-- Tab bar: dải segmented có con trượt chạy (.cx-seg ở styles/_common.css). -->
    <div class="px-4 pt-4">
      <div id="party-seg" class="cx-seg" style="--n: 2" role="tablist">
        <button
          type="button"
          role="tab"
          aria-selected="true"
          onclick="switchPartyTab('groom')"
          id="party-tab-groom"
          class="cx-seg-btn is-on"
        >
          <i data-lucide="mars" class="w-3.5 h-3.5"></i> Nhà trai
        </button>
        <button
          type="button"
          role="tab"
          aria-selected="false"
          onclick="switchPartyTab('bride')"
          id="party-tab-bride"
          class="cx-seg-btn"
        >
          <i data-lucide="venus" class="w-3.5 h-3.5"></i> Nhà gái
        </button>
      </div>
    </div>

    <!-- Nhà trai panel -->
    <div id="party-panel-groom" class="px-4 py-5 sm:p-6 space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <x-date label="Ngày đãi tiệc" name="groom_party_date"></x-date>
        <x-time label="Giờ đãi tiệc" name="groom_party_time"></x-time>
      </div>
      <p
        id="groom-party-lunar-display"
        class="text-sm text-gray-500 italic"
      >
        Chọn ngày để tự động tính ngày âm lịch
      </p>
      <div class="space-y-3">
        <label for="groom_party_map_query" class="text-sm font-medium text-gray-800 flex items-center gap-2">
          <i data-lucide="map-pin" class="text-color-secondary"></i>Địa điểm tiệc
        </label>
        <!-- x-check là display:contents → bọc div để nhận khoảng cách của space-y. -->
        <div>
          <x-check
            key="groom-party-same"
            label="Trùng địa điểm lễ thành hôn"
            onchange="togglePartySameLoc('groom', event)"
          ></x-check>
        </div>
        <!-- Ô vị trí không có name (không vào FormData): nó chỉ dựng groom_party_map_embed_url
             (maps-helper.js → cxMapFromQuery). Tên khách thấy là ô groom_party_location. -->
        <div>
          <x-input
            id="groom_party_map_query"
            label="Vị trí trên bản đồ"
            placeholder="Nhập tên vị trí hoặc tọa độ trên Maps"
            suffix-btn-label="Bản đồ"
            suffix-btn-icon="map-pin"
            suffix-btn-action="openMapPicker('groom_party')"
          ></x-input>
          <p class="mt-1.5 text-xs text-gray-400">Ví dụ: White Palace Phạm Văn Đồng, hoặc <x-button variant="bare" onclick="openCoordGuide()" class="cx-coord-help" title="Xem cách lấy tọa độ">tọa độ</x-button> chép từ Google Maps.</p>
        </div>
        <x-input
          name="groom_party_location"
          type="textarea"
          rows="2"
          label="Tên hiện trên thiệp"
          placeholder="Ví dụ: Trung tâm tiệc cưới White Palace Phạm Văn Đồng, TP.HCM"
        ></x-input>
        <input type="hidden" name="groom_party_map_embed_url" id="groom_party_map_embed_url" />
        <div id="groom_party-map-display" class="hidden"></div>
      </div>
    </div>

    <!-- Nhà gái panel -->
    <div id="party-panel-bride" class="hidden px-4 py-5 sm:p-6 space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <x-date label="Ngày đãi tiệc" name="bride_party_date"></x-date>
        <x-time label="Giờ đãi tiệc" name="bride_party_time"></x-time>
      </div>
      <p
        id="bride-party-lunar-display"
        class="text-sm text-gray-500 italic"
      >
        Chọn ngày để tự động tính ngày âm lịch
      </p>
      <div class="space-y-3">
        <label for="bride_party_map_query" class="text-sm font-medium text-gray-800 flex items-center gap-2">
          <i data-lucide="map-pin" class="text-color-secondary"></i>Địa điểm tiệc
        </label>
        <!-- x-check là display:contents → bọc div để nhận khoảng cách của space-y. -->
        <div>
          <x-check
            key="bride-party-same"
            label="Trùng địa điểm lễ vu quy"
            onchange="togglePartySameLoc('bride', event)"
          ></x-check>
        </div>
        <!-- Ô vị trí không có name (không vào FormData): nó chỉ dựng bride_party_map_embed_url
             (maps-helper.js → cxMapFromQuery). Tên khách thấy là ô bride_party_location. -->
        <div>
          <x-input
            id="bride_party_map_query"
            label="Vị trí trên bản đồ"
            placeholder="Nhập tên vị trí hoặc tọa độ trên Maps"
            suffix-btn-label="Bản đồ"
            suffix-btn-icon="map-pin"
            suffix-btn-action="openMapPicker('bride_party')"
          ></x-input>
          <p class="mt-1.5 text-xs text-gray-400">Ví dụ: Riverside Palace Bến Vân Đồn, hoặc <x-button variant="bare" onclick="openCoordGuide()" class="cx-coord-help" title="Xem cách lấy tọa độ">tọa độ</x-button> chép từ Google Maps.</p>
        </div>
        <x-input
          name="bride_party_location"
          type="textarea"
          rows="2"
          label="Tên hiện trên thiệp"
          placeholder="Ví dụ: Nhà hàng Riverside Palace, 360D Bến Vân Đồn, TP.HCM"
        ></x-input>
        <input type="hidden" name="bride_party_map_embed_url" id="bride_party_map_embed_url" />
        <div id="bride_party-map-display" class="hidden"></div>
      </div>
    </div>
  </div>
</div>
