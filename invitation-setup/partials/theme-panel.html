<!-- Theme Panel: mobile = thanh chỉnh ở đáy; md+ = cột chỉnh bên phải -->
<div
  id="theme-panel"
  class="hidden fixed inset-0 bottom-[var(--nav-h)] z-[200] bg-[rgb(var(--surface-tint-rgb))] flex flex-col"
>
  <!-- Cụm preview + controls: mobile xếp dọc full; md+ xếp ngang full-width để
       iframe đủ rộng cho thiệp nở tới max (768px). Controls là card ~1/4 nằm
       NGOÀI bên phải, cách preview đúng thanh kéo (16px). -->
  <div class="relative flex-1 min-h-0 w-full flex flex-col md:flex-row md:p-4">
    <!-- Preview thiệp (cập nhật trực tiếp khi chỉnh) — LUÔN chạy trong khung
         điện thoại như tab Xem trước: iframe full-bleed co theo cột chỉnh nên
         thiệp rơi vào bố cục màn rộng, khách chỉnh một đằng thấy một nẻo. Cùng
         markup .cx-phone với hai khung kia, khổ do js/22-live-preview.js đo. -->
    <div id="theme-preview-stage" class="cx-preview-stage cx-theme-stage">
      <div class="cx-phone">
        <!-- Chrome (thanh trạng thái + thanh tiêu đề) do
             core/helpers/phone-chrome.js chèn vào đầu ô màn lúc chạy. -->
        <div class="cx-phone-screen">
          <div class="cx-pviewport">
            <iframe
              id="theme-preview-iframe"
              src=""
              class="cx-phone-view"
              allow="autoplay; encrypted-media"
              allowfullscreen
            ></iframe>
          </div>
          <!-- Dải trắng đáy: giữ thiệp khỏi chạm góc bo của thân máy. -->
          <div class="cx-ppad"></div>
        </div>
        <!-- Vỏ máy nằm ĐÈ lên iframe (vùng màn hình của ảnh là trong suốt). -->
        <img src="../assets/images/iphone_mockup.svg" alt="" class="cx-phone-frame" />
      </div>
    </div>

    <!-- Thanh kéo đổi rộng cột chỉnh (chỉ desktop; cũng đóng vai khe 16px) -->
    <div
      id="theme-resize"
      role="separator"
      aria-orientation="vertical"
      aria-label="Kéo để đổi độ rộng bảng chỉnh"
      title="Kéo để đổi độ rộng"
      class="hidden md:flex md:w-4 shrink-0 items-center justify-center cursor-col-resize select-none touch-none group"
    >
      <span
        class="w-1 h-10 rounded-full bg-gray-200 transition-colors group-hover:bg-rose-300 group-active:bg-rose-400"
      ></span>
    </div>

    <!-- Thanh chỉnh giao diện: mobile = thanh dưới full (như navbar); md+ = card
             ~1/4 bên phải, kéo rộng được theo --theme-ctrl-w (styles/_setup.css).
             Ở mobile thanh này NỔI (absolute) đè lên thiệp chứ không chiếm chỗ
             trong luồng: iframe cao trọn khung nên thiệp giữ đúng tỉ lệ điện
             thoại, không bị bóp lùn theo chiều cao thanh chỉnh. Từ md+ trả về
             static để nằm cạnh preview như cột phải. -->
    <div
      id="theme-controls"
      class="absolute inset-x-0 bottom-0 z-10 md:static md:z-auto shrink-0 bg-white border-t border-gray-200 shadow-[0_-4px_16px_rgb(var(--scrim-rgb)/0.12)] md:rounded-3xl md:border md:border-gray-100 md:shadow-[0_4px_18px_rgb(var(--scrim-rgb)/0.07)]"
    >
      <!-- Đầu bảng + vùng cuộn DÙNG CHUNG cho mọi bảng (chung, chỉnh chữ, thêm
           văn bản, trang trí, thành phần, điều chỉnh): nhờ vậy bảng nào cũng cao
           bằng nhau — mặc định 200px cho đỡ che thiệp, kéo tay nắm lên khi cần
           xem nhiều hơn (chỉ có tác dụng ở mobile; md+ cả cột đã tự cuộn).
           Đầu bảng (vạch kéo + hàng nút) và dải tab dưới nằm NGOÀI vùng cuộn
           nên đứng yên khi cuộn nội dung; chữ trong đầu bảng do _syncCtrlHead()
           (js/05-theme-panel.js) đổ vào theo bảng đang mở. -->
      <div id="cx-ctrl-handle" class="cx-sheet-handle">
        <span
          class="cx-sheet-grip"
          role="separator"
          aria-orientation="horizontal"
          aria-label="Kéo lên để mở rộng bảng chỉnh"
          title="Kéo lên để mở rộng"
        ></span>
        <!-- Đầu bảng 3 ô (nút trái · tên bảng · nút phải) DÙNG CHUNG cho mọi
             bảng: chữ và việc của từng nút do _syncCtrlHead() đổ vào theo bảng
             khai CTRL_VIEWS (js/05-theme-panel.js), nên thêm bảng mới chỉ khai
             một dòng ở đó chứ không thêm markup ở đây. -->
        <div id="cx-ctrl-actions" class="cx-sheet-actions cx-ch">
          <div class="cx-ch-side">
            <button
              type="button"
              id="cx-ch-back"
              onclick="cxCtrlBack()"
              class="cx-le-back hidden"
              aria-label="Quay lại"
            >
              <i data-lucide="arrow-left" class="w-4 h-4"></i>
            </button>
            <button
              type="button"
              id="cx-ch-reset"
              onclick="cxCtrlReset()"
              class="cx-ch-reset"
            >
              <!-- Chữ trần, không icon: có icon là phần CHỮ thụt vào, hết thẳng
                   cột với nội dung bên dưới. -->
              <span id="cx-ch-reset-txt">Đặt lại</span>
            </button>
          </div>
          <span id="cx-ch-title" class="cx-ch-title">Bộ màu</span>
          <div class="cx-ch-side cx-ch-end">
            <!-- Chỉ mobile: thu bảng chỉnh xuống để xem trọn thiệp (desktop cột
                 chỉnh nằm cạnh thiệp nên không che gì). -->
            <button
              type="button"
              id="cx-ch-done"
              onclick="cxCtrlDone()"
              class="cx-ch-done md:hidden"
              title="Thu gọn bảng chỉnh để xem trọn thiệp"
              aria-label="Xong"
            >
              <i data-lucide="check" class="w-5 h-5"></i>
            </button>
          </div>
        </div>
      </div>
      <div class="cx-sheet">
        <div id="cx-ctrl-scroll" class="cx-sheet-body">
          <div
            class="w-full max-w-4xl mx-auto px-4 pb-3 md:px-5 md:py-5"
          >
            

            <!-- Nhóm chỉnh chung của cả thiệp — ẩn khi mở bảng chỉnh 1 dòng -->
            <div id="theme-main-controls" class="space-y-3 md:space-y-6">
              <!-- Bộ màu: đổi CẢ bảng màu thiệp (chữ, nền, vạch kẻ, màn bìa,
                   hoạ tiết) trong một lần chọn. Đây là chỗ chỉnh màu DUY NHẤT ở
                   mức toàn thiệp — muốn khác đi thì bấm thẳng vào phần tử trên
                   thiệp mà chỉnh riêng. -->
              <div class="md:space-y-2.5">
                <div class="flex items-center gap-2 md:w-full">
                  <label
                    for="theme-palette"
                    class="text-[12px] text-gray-500 shrink-0 whitespace-nowrap md:text-[12.5px] md:w-16 md:text-right"
                    >Bộ màu</label
                  >
                  <x-combobox
                    id="theme-palette"
                    preview-swatch
                    onchange="onCardPaletteChange()"
                    class="flex-1 min-w-0"
                  ></x-combobox>
                </div>

                <!-- Độ đậm của bộ màu: 50% = đúng bộ như danh mục khai, kéo lên
                     là cả thiệp đậm tông hơn. ẨN HẲN khi đang ở "Mặc định" — lúc
                     đó màu là của chính mẫu chứ không phải của bộ, để lại thanh
                     kéo mờ mờ chỉ tổ khiến khách tưởng mình bấm hỏng
                     (_syncPaletteStrength() ở js/05-theme-panel.js). -->
                <div
                  id="theme-palette-strength-row"
                  class="hidden flex items-center gap-2 md:w-full mt-2 md:mt-0"
                >
                  <label
                    for="theme-palette-strength"
                    class="text-[12px] text-gray-500 shrink-0 whitespace-nowrap md:text-[12.5px] md:w-16 md:text-right"
                    >Độ đậm</label
                  >
                  <!-- CXProgress (core/components/progress.js) bọc input này
                       thành thanh viên thuốc và tự hiện số % — _syncPaletteStrength(). -->
                  <input
                    id="theme-palette-strength"
                    type="range"
                    min="0"
                    max="100"
                    step="5"
                    value="50"
                    oninput="onPaletteStrengthInput()"
                    onchange="onPaletteStrengthCommit()"
                    class="flex-1 min-w-0"
                    aria-label="Độ đậm của bộ màu"
                  />
                </div>
              </div>

            </div>
            <!-- /theme-main-controls -->

            <!-- Bảng chỉnh CHI TIẾT 1 dòng chữ (hiện khi click text trên preview) -->
            <div
              id="theme-line-editor"
              class="hidden space-y-3 md:space-y-4"
            >
              <!-- Nhắc đang chỉnh dòng nào — ẩn khi có ô sửa Nội dung (đã thấy chữ ở đó) -->
              <p id="cx-le-sample-row" class="text-[12px] text-gray-500">
                Nội dung đang chọn:
                <span id="cx-le-sample" class="font-medium text-gray-700"></span>
              </p>

              <!-- Nhóm control CHỮ (nội dung/font/cỡ/màu/kiểu/căn) -->
              <div id="cx-le-text" class="space-y-3 md:space-y-4">
                <!-- Nội dung — chỉ hiện khi text tĩnh sửa được (bound/không-text-thuần → ẩn hẳn) -->
                <div id="cx-le-content">
                  <label class="cx-le-label-block">Nội dung</label>
                  <textarea
                    id="cx-line-text"
                    rows="2"
                    oninput="onLineTextChange()"
                    placeholder="Nhập nội dung…"
                    class="cx-le-textarea"
                  ></textarea>
                </div>
                <!-- Phông -->
                <div class="cx-le-row">
                  <label class="cx-le-label">Phông</label>
                  <x-combobox
                    id="cx-line-font"
                    preview-font
                    placeholder="Mặc định"
                    onchange="onLineFontChange()"
                    class="flex-1 min-w-0"
                  ></x-combobox>
                </div>

                <!-- Cỡ chữ -->
                <div class="cx-le-row">
                  <label class="cx-le-label">Cỡ chữ</label>
                  <div class="cx-le-size">
                    <x-button variant="ghost" type="button" onclick="stepLineSize(-1)" aria-label="Giảm cỡ chữ">
                      −
                    </x-button>
                    <input
                      id="cx-line-size"
                      type="number"
                      min="8"
                      max="200"
                      readonly
                      tabindex="-1"
                    />
                    <span class="cx-le-unit">px</span>
                    <x-button variant="ghost" type="button" onclick="stepLineSize(1)" aria-label="Tăng cỡ chữ">
                      +
                    </x-button>
                  </div>
                </div>

                <!-- Màu — bật nút chuyển màu thì hiện thêm ô thứ hai: chữ đổ
                     từ màu ô 1 sang màu ô 2 -->
                <div class="cx-le-row">
                  <label class="cx-le-label">Màu chữ</label>
                  <div class="flex items-center gap-2">
                    <div class="color-chip">
                      <input
                        type="text"
                        inputmode="none"
                        id="cx-line-color"
                        class="theme-color-input"
                        aria-label="Màu chữ dòng này"
                      />
                    </div>
                    <div id="cx-line-color2-wrap" class="hidden color-chip">
                      <input
                        type="text"
                        inputmode="none"
                        id="cx-line-color2"
                        class="theme-color-input"
                        aria-label="Màu cuối của dải chuyển màu"
                      />
                    </div>
                    <div class="cx-le-seg">
                      <x-button variant="ghost" icon-only type="button" id="cx-line-gradient" onclick="toggleLineGradient()" title="Chuyển màu (gradient)">
                        <i data-lucide="droplets" class="w-4 h-4"></i>
                      </x-button>
                    </div>
                  </div>
                </div>

                <!-- Đậm / Nghiêng -->
                <div class="cx-le-row">
                  <label class="cx-le-label">Kiểu</label>
                  <div class="cx-le-seg">
                    <x-button variant="ghost" icon-only type="button" id="cx-line-bold" onclick="toggleLineStyle('bold')" title="Đậm">
                      <i data-lucide="bold" class="w-4 h-4"></i>
                    </x-button>
                    <x-button variant="ghost" icon-only type="button" id="cx-line-underline" onclick="toggleLineStyle('underline')" title="Gạch chân">
                      <i data-lucide="underline" class="w-4 h-4"></i>
                    </x-button>
                    <x-button variant="ghost" icon-only type="button" id="cx-line-italic" onclick="toggleLineStyle('italic')" title="Nghiêng">
                      <i data-lucide="italic" class="w-4 h-4"></i>
                    </x-button>
                  </div>
                </div>

                <!-- Căn lề -->
                <div class="cx-le-row">
                  <label class="cx-le-label">Căn lề</label>
                  <div class="cx-le-seg" id="cx-line-align">
                    <x-button variant="ghost" icon-only type="button" data-align="left" onclick="setLineAlign('left')" title="Trái">
                      <i data-lucide="align-left" class="w-4 h-4"></i>
                    </x-button>
                    <x-button variant="ghost" icon-only type="button" data-align="center" onclick="setLineAlign('center')" title="Giữa">
                      <i data-lucide="align-center" class="w-4 h-4"></i>
                    </x-button>
                    <x-button variant="ghost" icon-only type="button" data-align="right" onclick="setLineAlign('right')" title="Phải">
                      <i data-lucide="align-right" class="w-4 h-4"></i>
                    </x-button>
                  </div>
                </div>
              </div>
              <!-- /cx-le-text -->

              <!-- Nhóm control ẢNH (rộng/cao + giữ tỉ lệ) -->
              <div id="cx-le-image" class="hidden space-y-3 md:space-y-4">
                <div class="cx-le-row">
                  <label class="cx-le-label">Rộng</label>
                  <div class="cx-le-size">
                    <x-button variant="ghost" type="button" onclick="stepImgSize('w', -1)" aria-label="Giảm rộng">
                      −
                    </x-button>
                    <input
                      id="cx-img-w"
                      type="number"
                      min="8"
                      max="2000"
                      inputmode="numeric"
                      onchange="onImgSizeChange('w')"
                    />
                    <span class="cx-le-unit">px</span>
                    <x-button variant="ghost" type="button" onclick="stepImgSize('w', 1)" aria-label="Tăng rộng">
                      +
                    </x-button>
                  </div>
                </div>
                <div class="cx-le-row">
                  <label class="cx-le-label">Cao</label>
                  <div class="cx-le-size">
                    <x-button variant="ghost" type="button" onclick="stepImgSize('h', -1)" aria-label="Giảm cao">
                      −
                    </x-button>
                    <input
                      id="cx-img-h"
                      type="number"
                      min="8"
                      max="2000"
                      inputmode="numeric"
                      onchange="onImgSizeChange('h')"
                    />
                    <span class="cx-le-unit">px</span>
                    <x-button variant="ghost" type="button" onclick="stepImgSize('h', 1)" aria-label="Tăng cao">
                      +
                    </x-button>
                  </div>
                </div>
                <label class="cx-le-check">
                  <input
                    type="checkbox"
                    id="cx-img-ratio"
                    checked
                    onchange="onImgRatioToggle()"
                  />
                  <span>Giữ nguyên tỉ lệ</span>
                </label>
              </div>
              <!-- /cx-le-image -->
            </div>
            <!-- /theme-line-editor -->

            <!-- Bảng THÊM VĂN BẢN (thay chỗ nhóm chỉnh chung, giống bảng chỉnh 1 dòng) -->
            <div id="theme-addtext-panel" class="hidden space-y-3 md:space-y-4">
              <p class="text-[12px] text-gray-500">
                Giữ rồi kéo mẫu thả lên thiệp.
              </p>
              <!-- Ô mẫu dựng động từ CX_TEXT_PRESETS
                   (core/helpers/text-preset-helper.js) — kể cả mẫu cơ bản
                   "Văn bản" — nên thêm mẫu mới không phải sửa file này. -->
              <div id="cx-addtext-palette" class="cx-pick-grid"></div>
            </div>
            <!-- /theme-addtext-panel -->

            <!-- Bảng chọn HOẠ TIẾT: kéo ảnh từ đây thả vào bất kỳ chỗ nào trên
                 thiệp (lưu theo toạ độ %). Danh sách nạp từ /assets/flowers. -->
            <div
              id="theme-decor-panel"
              class="hidden space-y-3 md:space-y-4"
            >
              <p class="text-[12px] text-gray-500">
                Giữ rồi kéo mẫu thả lên thiệp.
              </p>
              <div id="cx-decor-palette" class="cx-pal-grid"></div>
              <p id="cx-decor-empty" class="hidden text-[12px] text-gray-400"></p>
            </div>
            <!-- /theme-decor-panel -->

            <!-- Bảng THẺ NHẠC: bấm ô mẫu để dùng ngay, hoặc kéo thả vào chỗ bất kỳ
                 trên thiệp, lưu theo toạ độ như hoạ tiết. Danh mục nạp từ
                 window.CX_ELEMENTS nên thêm thành phần mới không phải sửa HTML này. -->
            <div
              id="theme-elements-panel"
              class="hidden space-y-3 md:space-y-4"
            >
              <p class="text-[12px] text-gray-500">
                Bấm để đổi mẫu, giữ rồi kéo để thả vào chỗ khác.
              </p>
              <div id="cx-elements-palette" class="cx-pick-grid"></div>
            </div>
            <!-- /theme-elements-panel -->

            <!-- Bảng HỘP MỪNG CƯỚI: chọn kiểu che phần mã QR — "Mặc định" (mẫu tự
                 lo), "Không hộp" (hiện thẳng QR) hoặc một mẫu hộp. Danh mục ở
                 core/helpers/gift-box-helper.js nên thêm mẫu không phải sửa HTML
                 này. Bấm là đổi ngay: khung xem trước nạp lại rồi cuộn tới mục. -->
            <div
              id="theme-gift-panel"
              class="hidden space-y-3 md:space-y-4"
            >
              <p class="text-[12px] text-gray-500">
                Hộp che mã QR, khách chạm vào mới mở.
              </p>
              <div id="cx-gift-palette" class="cx-pick-grid"></div>
            </div>
            <!-- /theme-gift-panel -->

            <!-- Bảng LỜI CHÚC: chọn cách hiện lời chúc của khách mời —
                 "Livestream" (dải nổi ghim đáy màn, lời chúc trôi lên) hoặc
                 "Bình luận" (một mục ngay trên hộp mừng cưới, liệt kê hết và tự
                 cuộn). Runtime ở core/helpers/wishes-helper.js; bấm là đổi ngay
                 trong khung xem trước, không nạp lại. -->
            <div
              id="theme-wish-panel"
              class="hidden space-y-3 md:space-y-4"
            >
              <p class="text-[12px] text-gray-500">
                Cách khách thấy lời chúc; bật/tắt ở bước “Xác nhận tham dự”.
              </p>
              <div id="cx-wish-palette" class="cx-pick-grid"></div>
            </div>
            <!-- /theme-wish-panel -->

            <!-- Bảng ĐIỀU CHỈNH THÀNH PHẦN: mở khi vừa thả hoặc bấm vào thành phần
                 trên thiệp. Mẫu / kích thước là phần chung; các tuỳ chọn riêng dựng
                 từ window.CX_ELEMENTS[…].options nên thêm thành phần mới không phải
                 sửa HTML này — trừ 3 ô màu, Coloris cần input có sẵn trong DOM. -->
            <div
              id="theme-element-editor"
              class="hidden space-y-3 md:space-y-4"
            >

              <!-- Không có mục "Mẫu" ở đây: đổi mẫu bằng nút trên chính widget, giữ
                   bảng gọn và CAO KHÔNG ĐỔI (xem ghi chú chiều cao ở styles/_setup.css). -->
              <div class="cx-le-row">
                <label class="cx-le-label">Kích thước</label>
                <!-- CXProgress (core/components/progress.js) bọc input này thành
                     thanh viên thuốc và tự hiện số % — xem _initElWidthSlider(). -->
                <input
                  id="cx-el-width"
                  type="range"
                  min="8"
                  max="100"
                  step="1"
                  oninput="onElementWidthInput()"
                  onchange="onElementWidthCommit()"
                  class="flex-1 min-w-0"
                  aria-label="Bề ngang thành phần"
                />
              </div>

              <!-- Tuỳ chọn dạng "chọn 1 trong nhiều" -->
              <div id="cx-el-options" class="space-y-3 md:space-y-4"></div>

              <!-- Ô màu: dựng sẵn EL_COLOR_SLOTS thẻ (cùng kiểu thẻ với nhóm Màu sắc),
                   panel bật/tắt và đặt nhãn theo `colors` của mẫu đang chọn
                   (core/helpers/element-color-enum.js). Phải có sẵn trong DOM —
                   Coloris chỉ bọc được input đã tồn tại. -->
              <div id="cx-el-colors" class="cx-color-grid hidden">
                <label
                  id="cx-el-color-row-0"
                  for="cx-el-color-0"
                  class="cx-color-card hidden"
                >
                  <span class="color-chip">
                    <input
                      type="text"
                      inputmode="none"
                      id="cx-el-color-0"
                      class="theme-color-input"
                    />

           chiều cao cho nội dung). Dải cuộn ngang khi không đủ chỗ, tab đang mở
           được _syncCtrlHead() tô và tự kéo vào tầm nhìn.
           `data-ctab` phải trùng `key` của CTRL_VIEWS (js/05-theme-panel.js);
