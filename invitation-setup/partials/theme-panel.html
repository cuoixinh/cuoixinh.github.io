<!-- Theme Panel: mobile = thanh chỉnh ở đáy; md+ = cột chỉnh bên phải -->
<div
  id="theme-panel"
  class="hidden fixed inset-0 bottom-[var(--nav-h)] z-[200] bg-white flex flex-col"
>
  <!-- Cụm preview + controls:
             mobile = xếp dọc full; md+ = xếp ngang full-width để iframe đủ rộng
             cho thiệp nở tới max (768px). Controls là card ~1/4 nằm NGOÀI bên phải,
             cách preview đúng thanh kéo (16px). p-4 = 16px đệm quanh cụm. -->
  <div class="flex-1 min-h-0 w-full flex flex-col md:flex-row md:p-4">
    <!-- Preview thiệp (cập nhật trực tiếp khi chỉnh) -->
    <iframe
      id="theme-preview-iframe"
      src=""
      class="flex-1 border-0 w-full min-h-0 min-w-0 md:rounded-xl md:border md:border-gray-200 md:shadow-sm"
      allowfullscreen
    ></iframe>

    <!-- Thanh kéo đổi rộng cột chỉnh (chỉ desktop; cũng đóng vai khe 16px) -->
    <div
      id="theme-resize"
      role="separator"
      aria-orientation="vertical"
      aria-label="Kéo để đổi độ rộng bảng chỉnh"
      title="Kéo để đổi độ rộng"
      class="hidden md:flex md:w-4 shrink-0 items-center justify-center cursor-col-resize select-none touch-none group"
    >
      <span
        class="w-1 h-10 rounded-full bg-gray-200 transition-colors group-hover:bg-rose-300 group-active:bg-rose-400"
      ></span>
    </div>

    <!-- Thanh chỉnh giao diện
             mobile: thanh dưới full (nền/viền/bóng trên như navbar)
             md+:   card ~1/4 bên phải (viền + bóng đủ 4 cạnh, kéo rộng được),
                    rộng theo --theme-ctrl-w (xem setup.css), cuộn dọc nếu tràn -->
    <div
      id="theme-controls"
      class="shrink-0 bg-white border-t border-gray-200 shadow-[0_-4px_12px_rgba(0,0,0,0.04)] md:overflow-y-auto md:rounded-xl md:border md:border-gray-200 md:shadow-lg"
    >
      <div
        class="w-full max-w-4xl mx-auto px-4 py-3 space-y-3 md:px-5 md:py-5 md:space-y-6"
      >
        <!-- Gợi ý: click chữ trên thiệp để chỉnh riêng (dismissible, nhớ localStorage) -->
        <div
          id="theme-edit-hint"
          class="hidden flex items-start gap-2 rounded-lg bg-rose-50 border border-rose-100 px-3 py-2"
        >
          <i
            data-lucide="mouse-pointer-click"
            class="w-4 h-4 text-rose-400 shrink-0 mt-0.5"
          ></i>
          <p class="flex-1 text-[12px] leading-snug text-gray-600">
            <b class="font-semibold text-gray-700">Mẹo:</b> Nhấp vào bất kỳ dòng
            chữ nào trên thiệp để chỉnh riêng phông, cỡ, màu…
          </p>
          <button
            type="button"
            onclick="dismissEditHint()"
            class="shrink-0 text-gray-400 hover:text-gray-600"
            aria-label="Đóng gợi ý"
          >
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
          </button>
        </div>

        <!-- Nhóm chỉnh chung (phông + màu toàn thiệp) — ẩn khi mở bảng chỉnh 1 dòng -->
        <div id="theme-main-controls" class="space-y-3 md:space-y-6">
        <!-- Phông chữ -->
        <div class="md:space-y-2.5">
          <p
            class="hidden md:block text-[11px] font-semibold uppercase tracking-[0.08em] text-gray-400"
          >
            Phông chữ
          </p>
          <!-- mobile: 2 selector cạnh nhau; md+: xếp dọc trong cột -->
          <div
            class="flex items-center gap-2 md:flex-col md:items-stretch md:gap-4"
          >
            <div class="flex items-center gap-2 flex-1 min-w-0 md:w-full">
              <label
                for="theme-heading-font"
                class="text-[12px] text-gray-500 shrink-0 whitespace-nowrap md:text-[12.5px] md:w-16 md:text-right"
                >Tiêu đề</label
              >
              <x-combobox
                id="theme-heading-font"
                preview-font
                onchange="onThemeSettingChange()"
                class="flex-1 min-w-0"
              ></x-combobox>
            </div>
            <div class="flex items-center gap-2 flex-1 min-w-0 md:w-full">
              <label
                for="theme-body-font"
                class="text-[12px] text-gray-500 shrink-0 whitespace-nowrap md:text-[12.5px] md:w-16 md:text-right"
                >Nội dung</label
              >
              <x-combobox
                id="theme-body-font"
                preview-font
                onchange="onThemeSettingChange()"
                class="flex-1 min-w-0"
              ></x-combobox>
            </div>
          </div>
        </div>

        <!-- Màu: mỗi phần 1 chip chọn màu tự do -->
        <div class="md:space-y-3">
          <p
            class="hidden md:block text-[11px] font-semibold uppercase tracking-[0.08em] text-gray-400"
          >
            Màu sắc
          </p>
          <!-- mobile: 4 chip + nút Khôi phục cùng hàng.
               md+: chip chiếm full ngang (giãn ĐỀU theo width), Khôi phục xuống dòng -->
          <div class="flex items-start gap-2 md:flex-wrap md:gap-y-3">
            <div
              class="flex-1 grid grid-cols-4 gap-2 md:gap-3 md:flex-none md:w-full"
            >
              <div class="flex flex-col items-center gap-1.5">
                <div class="color-chip">
                  <input
                    type="text"
                    inputmode="none"
                    id="theme-heading-color"
                    class="theme-color-input"
                    aria-label="Chọn màu tiêu đề"
                    title="Màu tiêu đề — tên, tiêu đề mục"
                  />
                </div>
                <span
                  class="text-[12px] text-gray-500 leading-none md:text-[12.5px] md:mt-0.5"
                  >Tiêu đề</span
                >
              </div>
              <div class="flex flex-col items-center gap-1.5">
                <div class="color-chip">
                  <input
                    type="text"
                    inputmode="none"
                    id="theme-body-color"
                    class="theme-color-input"
                    aria-label="Chọn màu nội dung"
                    title="Màu nội dung — lời mời, ngày giờ, địa chỉ"
                  />
                </div>
                <span
                  class="text-[12px] text-gray-500 leading-none md:text-[12.5px] md:mt-0.5"
                  >Nội dung</span
                >
              </div>
              <div class="flex flex-col items-center gap-1.5">
                <div class="color-chip">
                  <input
                    type="text"
                    inputmode="none"
                    id="theme-accent-color"
                    class="theme-color-input"
                    aria-label="Chọn màu nhấn"
                    title="Màu nhấn — icon, hoa văn, viền trang trí"
                  />
                </div>
                <span
                  class="text-[12px] text-gray-500 leading-none md:text-[12.5px] md:mt-0.5"
                  >Nhấn</span
                >
              </div>
              <div class="flex flex-col items-center gap-1.5">
                <div class="color-chip">
                  <input
                    type="text"
                    inputmode="none"
                    id="theme-background-color"
                    class="theme-color-input"
                    aria-label="Chọn màu nền"
                    title="Màu nền thiệp"
                  />
                </div>
                <span
                  class="text-[12px] text-gray-500 leading-none md:text-[12.5px] md:mt-0.5"
                  >Nền</span
                >
              </div>
            </div>
            <!-- Khôi phục — MOBILE: icon vuông + nhãn dưới (khớp 4 cột chip).
                 Cố ý KHÔNG tròn như chip màu vì đây là hành động, không phải giá trị màu. -->
            <button
              type="button"
              onclick="resetThemeSetting()"
              title="Khôi phục phông chữ và màu về mặc định của thiệp"
              class="shrink-0 flex flex-col items-center gap-1.5 group focus:outline-none md:hidden"
            >
              <span
                class="w-8 h-8 rounded-lg bg-gray-50 border border-gray-200 text-gray-400 flex items-center justify-center transition-all group-hover:bg-rose-50 group-hover:border-rose-200 group-hover:text-rose-400 group-active:scale-95 group-focus-visible:ring-2 group-focus-visible:ring-rose-200 group-focus-visible:ring-offset-2"
              >
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
              </span>
              <span
                class="text-[12px] text-gray-500 leading-none whitespace-nowrap transition-colors group-hover:text-rose-400"
                >Khôi phục</span
              >
            </button>
            <!-- Khôi phục — DESKTOP: nút button đầy đủ, chiếm nguyên dòng dưới hàng chip -->
            <button
              type="button"
              onclick="resetThemeSetting()"
              title="Khôi phục phông chữ và màu về mặc định của thiệp"
              class="hidden md:flex md:w-full md:items-center md:justify-center md:gap-2 md:px-4 md:py-2.5 md:rounded-lg md:border md:border-gray-200 md:bg-white md:text-[13px] md:font-medium md:text-gray-600 md:shadow-sm md:transition-colors md:hover:bg-rose-50 md:hover:border-rose-200 md:hover:text-rose-500 md:active:scale-[0.99] focus:outline-none md:focus-visible:ring-2 md:focus-visible:ring-rose-200 md:focus-visible:ring-offset-2"
            >
              <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
              <span>Khôi phục về mặc định</span>
            </button>
          </div>
        </div>
        <!-- /section Màu sắc -->
        </div>
        <!-- /theme-main-controls -->

        <!-- Bảng chỉnh CHI TIẾT 1 dòng chữ (hiện khi click text trên preview) -->
        <div
          id="theme-line-editor"
          class="hidden space-y-3 md:space-y-4 max-h-[52vh] overflow-y-auto md:max-h-none"
        >
          <div class="flex items-center justify-between gap-2">
            <button type="button" onclick="closeLineEditor()" class="cx-le-back">
              <i data-lucide="arrow-left" class="w-4 h-4"></i><span>Quay lại</span>
            </button>
            <button type="button" onclick="clearLineOverride()" class="cx-le-clear">
              <i data-lucide="rotate-ccw" class="w-4 h-4"></i><span>Lấy lại mặc định</span>
            </button>
          </div>
          <p class="text-[12px] text-gray-500">
            Đang chỉnh:
            <span id="cx-le-sample" class="font-medium text-gray-700"></span>
          </p>

          <!-- Nhóm control CHỮ (font/cỡ/màu/kiểu/căn) -->
          <div id="cx-le-text" class="space-y-3 md:space-y-4">
          <!-- Phông -->
          <div class="cx-le-row">
            <label class="cx-le-label">Phông</label>
            <x-combobox
              id="cx-line-font"
              preview-font
              placeholder="Mặc định"
              onchange="onLineFontChange()"
              class="flex-1 min-w-0"
            ></x-combobox>
          </div>

          <!-- Cỡ chữ -->
          <div class="cx-le-row">
            <label class="cx-le-label">Cỡ chữ</label>
            <div class="cx-le-size">
              <button type="button" onclick="stepLineSize(-1)" aria-label="Giảm cỡ chữ">−</button>
              <input
                id="cx-line-size"
                type="number"
                min="8"
                max="200"
                readonly
                tabindex="-1"
              />
              <span class="cx-le-unit">px</span>
              <button type="button" onclick="stepLineSize(1)" aria-label="Tăng cỡ chữ">+</button>
            </div>
          </div>

          <!-- Màu -->
          <div class="cx-le-row">
            <label class="cx-le-label">Màu chữ</label>
            <div class="color-chip">
              <input
                type="text"
                inputmode="none"
                id="cx-line-color"
                class="theme-color-input"
                aria-label="Màu chữ dòng này"
              />
            </div>
          </div>

          <!-- Đậm / Nghiêng -->
          <div class="cx-le-row">
            <label class="cx-le-label">Kiểu</label>
            <div class="cx-le-seg">
              <button type="button" id="cx-line-bold" onclick="toggleLineStyle('bold')" title="Đậm">
                <i data-lucide="bold" class="w-4 h-4"></i>
              </button>
              <button type="button" id="cx-line-underline" onclick="toggleLineStyle('underline')" title="Gạch chân">
                <i data-lucide="underline" class="w-4 h-4"></i>
              </button>
              <button type="button" id="cx-line-italic" onclick="toggleLineStyle('italic')" title="Nghiêng">
                <i data-lucide="italic" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <!-- Căn lề -->
          <div class="cx-le-row">
            <label class="cx-le-label">Căn lề</label>
            <div class="cx-le-seg" id="cx-line-align">
              <button type="button" data-align="left" onclick="setLineAlign('left')" title="Trái">
                <i data-lucide="align-left" class="w-4 h-4"></i>
              </button>
              <button type="button" data-align="center" onclick="setLineAlign('center')" title="Giữa">
                <i data-lucide="align-center" class="w-4 h-4"></i>
              </button>
              <button type="button" data-align="right" onclick="setLineAlign('right')" title="Phải">
                <i data-lucide="align-right" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
          </div>
          <!-- /cx-le-text -->

          <!-- Nhóm control ẢNH (rộng/cao + giữ tỉ lệ) -->
          <div id="cx-le-image" class="hidden space-y-3 md:space-y-4">
            <div class="cx-le-row">
              <label class="cx-le-label">Rộng</label>
              <div class="cx-le-size">
                <button type="button" onclick="stepImgSize('w', -1)" aria-label="Giảm rộng">−</button>
                <input
                  id="cx-img-w"
                  type="number"
                  min="8"
                  max="2000"
                  inputmode="numeric"
                  onchange="onImgSizeChange('w')"
                />
                <span class="cx-le-unit">px</span>
                <button type="button" onclick="stepImgSize('w', 1)" aria-label="Tăng rộng">+</button>
              </div>
            </div>
            <div class="cx-le-row">
              <label class="cx-le-label">Cao</label>
              <div class="cx-le-size">
                <button type="button" onclick="stepImgSize('h', -1)" aria-label="Giảm cao">−</button>
                <input
                  id="cx-img-h"
                  type="number"
                  min="8"
                  max="2000"
                  inputmode="numeric"
                  onchange="onImgSizeChange('h')"
                />
                <span class="cx-le-unit">px</span>
                <button type="button" onclick="stepImgSize('h', 1)" aria-label="Tăng cao">+</button>
              </div>
            </div>
            <label class="cx-le-check">
              <input type="checkbox" id="cx-img-ratio" checked onchange="onImgRatioToggle()" />
              <span>Giữ nguyên tỉ lệ</span>
            </label>
          </div>
          <!-- /cx-le-image -->
        </div>
        <!-- /theme-line-editor -->
      </div>
      <!-- /nội dung padding controls -->
    </div>
    <!-- /theme-controls -->
  </div>
  <!-- /cụm preview + controls (max-w-4xl) -->
</div>
<!-- /theme-panel -->
