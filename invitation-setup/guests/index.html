<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Quản lý khách mời</title>
    <link rel="icon" type="image/png" href="../../assets/icons/favicon.png" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8" integrity="sha384-Tve8O+C6PBzsIMK/IRCwHbi8fyEzXIlIs6OfVBZHubplwYhaQF/4Mzxqgg+pp/oy" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js" integrity="sha384-S3wQ/l0OsbJoFeJC81UIr3JOlx/OzNJpRt1bV+yhpWQxPAahfpQtpxBSfn+Isslc" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js" integrity="sha384-OUW9euuUyxyHcAhTqbhI+Iyb8LMssXt/cpz0yXhs9UWG2/R/uaWdakx/4cfww7Vb" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/lucide@1.26.0/dist/umd/lucide.min.js" integrity="sha384-8/6sFI5UzGbr1Dgef7WSZvE4UemcVc/jyaQNsM+MilmnHQ9sce/pRv86XXj5Cg5m" crossorigin="anonymous"></script>
    <!-- Tailwind build local (npm run build:css) — xem tailwind.config.js. Style
         riêng của trang là .gs-* ở styles/_setup.css. -->
    <link rel="stylesheet" href="../../styles/build.css" />
    <script src="../../core/helpers/no-zoom.js"></script>
    <!-- Khoá chiều cao một màn thành px (--vh) cho .gs-shell: 100vh bị thanh URL
         của trình duyệt di động che mất đáy. -->
    <script src="../../core/helpers/vh-lock.js"></script>
  </head>
  <!-- Nền dùng chung với trang thiết lập (--surface-tint-rgb): khung này chạy
       trong iframe của tab "Khách mời" nên lệch màu là thấy ngay. -->
  <body
    class="gs-shell font-inter bg-[rgb(var(--surface-tint-rgb))] flex flex-col overflow-hidden"
  >

    <!-- Header: THẺ NỔI ghim trên, cùng khổ (max-w-4xl) và cùng kiểu bo góc với
         thanh trên/navbar của trang thiết lập — khung này chạy trong iframe của
         tab "Khách mời" nên phải thẳng hàng với chúng. -->
    <div class="shrink-0 px-2 sm:px-4 pt-2 pb-2">
      <header class="gs-top max-w-4xl mx-auto">
        <x-button
          id="gs-back"
          variant="ghost"
          tone="neutral"
          icon-only
          onclick="goBack()"
          title="Quay lại thiết lập thiệp"
          aria-label="Quay lại thiết lập thiệp"
          class="shrink-0 -ml-1"
        >
          <i data-lucide="arrow-left" style="width:18px;height:18px"></i>
        </x-button>
        <div class="min-w-0 flex-1">
          <h1 class="gs-top-title">Khách mời</h1>
          <!-- Đường dẫn thiệp: _getWedding() đổ vào khi có slug. -->
          <p id="gs-top-sub" class="gs-top-sub"></p>
        </div>
        <!-- target="_top": trang này chạy trong iframe tab Khách mời, mở trang chủ
             ngay trong khung là hiện hai navbar lồng nhau. -->
        <a href="/" target="_top" class="shrink-0" aria-label="Về trang chủ CuoiXinh">
          <x-logo size="28"></x-logo>
        </a>
      </header>
    </div>

    <!-- Main: THẺ NỔI duy nhất được cuộn (trang không cuộn) — thanh cuộn nằm
         TRONG thẻ nên khổ không bị đẩy lệch so với header. -->
    <div class="flex-1 min-h-0 px-2 sm:px-4 pb-2">
      <div id="guests-scroll" class="gs-card h-full overflow-y-auto overscroll-contain max-w-4xl mx-auto">
        <div class="gs-body">
          <!-- Dải segmented có con trượt chạy (.cx-seg ở styles/_common.css);
               --i do switchTab() đặt, số khách mỗi bên do _syncCounts() đổ vào. -->
          <div id="guest-seg" class="cx-seg gs-seg" style="--n: 2" role="tablist" aria-label="Khách nhà trai hoặc nhà gái">
            <button type="button" id="tab-groom" role="tab" aria-selected="true" aria-controls="panel-groom"
              onclick="switchTab('groom')" class="cx-seg-btn is-on">
              <i data-lucide="mars" style="width:16px;height:16px"></i> Nhà trai
              <span id="tab-groom-n" class="gs-seg-n"></span>
            </button>
            <button type="button" id="tab-bride" role="tab" aria-selected="false" aria-controls="panel-bride"
              onclick="switchTab('bride')" class="cx-seg-btn">
              <i data-lucide="venus" style="width:16px;height:16px"></i> Nhà gái
              <span id="tab-bride-n" class="gs-seg-n"></span>
            </button>
          </div>

          <!-- Ô thống kê của bên đang mở — bấm một ô là lọc danh sách theo ô đó
               (aria-pressed). Số do _syncStats() đổ vào. -->
          <div class="gs-stats" role="group" aria-label="Lọc khách theo trạng thái">
            <button type="button" class="gs-stat" data-filter="all" aria-pressed="true">
              <span class="gs-stat-ico"><i data-lucide="users"></i></span>
              <span class="gs-stat-txt">
                <span class="gs-stat-n" data-stat="all">0</span>
                <span class="gs-stat-label">Khách mời</span>
              </span>
            </button>
            <button type="button" class="gs-stat" data-filter="viewed" aria-pressed="false">
              <span class="gs-stat-ico gs-stat-ico--info"><i data-lucide="eye"></i></span>
              <span class="gs-stat-txt">
                <span class="gs-stat-n" data-stat="viewed">0</span>
                <span class="gs-stat-label">Đã xem thiệp</span>
              </span>
            </button>
            <button type="button" class="gs-stat" data-filter="yes" aria-pressed="false">
              <span class="gs-stat-ico gs-stat-ico--ok"><i data-lucide="calendar-check"></i></span>
              <span class="gs-stat-txt">
                <span class="gs-stat-n" data-stat="yes">0</span>
                <span class="gs-stat-label">Sẽ tham dự</span>
              </span>
            </button>
            <button type="button" class="gs-stat" data-filter="wishes" aria-pressed="false">
              <span class="gs-stat-ico gs-stat-ico--wish"><i data-lucide="message-square-heart"></i></span>
              <span class="gs-stat-txt">
                <span class="gs-stat-n" data-stat="wishes">0</span>
                <span class="gs-stat-label">Gửi lời chúc</span>
              </span>
            </button>
          </div>

          <!-- Thanh công cụ dùng chung cho cả hai bên: mọi thao tác nhắm vào bên
               đang mở (_currentTab). Dưới sm ô tìm chiếm trọn một hàng. -->
          <div class="gs-toolbar">
            <label class="gs-search">
              <i data-lucide="search" style="width:16px;height:16px"></i>
              <input id="gs-search" type="search" placeholder="Tìm theo tên khách" autocomplete="off"
                aria-label="Tìm khách mời theo tên" oninput="onGuestSearch(this.value)" />
            </label>
            <div class="gs-actions">
              <x-button variant="outline" tone="neutral" onclick="pickExcel()" class="gs-act-excel">
                <i data-lucide="file-spreadsheet" class="gs-excel" style="width:16px;height:16px"></i>
                <span>Nhập Excel</span>
              </x-button>
              <x-button onclick="openAddGuestModal(_currentTab)">
                <i data-lucide="user-plus" style="width:16px;height:16px"></i>
                <span>Thêm khách</span>
              </x-button>
              <x-button
                id="gs-more"
                variant="outline"
                tone="neutral"
                icon-only
                onclick="toggleMoreMenu()"
                title="Thao tác khác"
                aria-label="Thao tác khác"
                aria-haspopup="menu"
              >
                <i data-lucide="ellipsis" style="width:18px;height:18px"></i>
              </x-button>
            </div>
            <input id="gs-file" type="file" class="hidden" accept=".xlsx,.xls" onchange="handleExcelUpload(event, _currentTab)" />
          </div>

          <!-- Danh sách mỗi bên: _renderGuestList() vẽ .gs-list (hàng khách) hoặc
               .gs-empty vào đây. -->
          <div id="panel-groom" role="tabpanel" aria-labelledby="tab-groom">
            <div id="guest-list-groom"></div>
          </div>
          <div id="panel-bride" role="tabpanel" aria-labelledby="tab-bride" class="hidden">
            <div id="guest-list-bride"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Báo cho trình đọc màn hình số khách sau mỗi lần tìm / lọc (_announce). -->
    <p id="gs-live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>

    <!-- Menu "⋯" của thanh công cụ và menu từng hàng khách (nạp mục bằng setItems). -->
    <x-popover id="gs-more-pop" anchor="#gs-more" placement="bottom" align="end" width="232"></x-popover>
    <x-popover id="gs-row-pop" placement="bottom" align="end" width="216"></x-popover>

    <!-- Popup thêm/sửa 1 khách (JS: _gmOpen ở index.js). Dưới sm là bottom sheet.
         Chip #add-guest-side cho biết đang thêm vào nhà trai hay nhà gái. -->
    <div id="add-guest-modal"
      class="cx-gm gs-modal hidden" role="dialog" aria-modal="true" aria-labelledby="add-guest-title">
      <div class="gs-sheet sm:max-w-[400px]">
        <div class="gs-sheet-head">
          <span id="add-guest-ico" class="gs-sheet-ico"></span>
          <div class="flex-1 min-w-0">
            <h2 id="add-guest-title" class="gs-sheet-title">Thêm khách mời</h2>
            <span id="add-guest-side" class="mt-1.5 inline-flex items-center gap-1 h-6 px-2.5 rounded-full text-[12px] font-semibold ring-1"></span>
          </div>
          <x-button variant="ghost" tone="neutral" icon-only type="button" onclick="closeAddGuestModal()"
            aria-label="Đóng" class="-mr-2 -mt-1">
            <i data-lucide="x" style="width:18px;height:18px"></i>
          </x-button>
        </div>

        <!-- Thân popup tự cuộn: điện thoại xoay ngang không đủ cao cho cả popup. -->
        <div class="flex-1 min-h-0 overflow-y-auto px-5 pb-4 space-y-3">
          <div class="space-y-1.5">
            <label for="add-guest-fullname" class="gs-label">Họ và tên <span class="text-rose-500">*</span></label>
            <div class="relative">
              <i data-lucide="user-round" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none" style="width:16px;height:16px"></i>
              <input id="add-guest-fullname" placeholder="VD: Nguyễn Văn A" autocomplete="off" class="gs-field pl-9"
                required aria-required="true" aria-describedby="add-guest-err" />
            </div>
            <!-- Lỗi ngay dưới ô (saveAddGuest bật, gõ lại là tắt). -->
            <p id="add-guest-err" class="gs-err hidden">
              <i data-lucide="circle-alert" style="width:14px;height:14px"></i>
              <span>Nhập họ và tên khách để tạo link mời.</span>
            </p>
          </div>
          <div class="grid grid-cols-[112px_1fr] gap-3">
            <div class="space-y-1.5 min-w-0">
              <label id="add-guest-rel-label" class="gs-label">Xưng hô</label>
              <x-combobox id="add-guest-relationship" placeholder="Chọn" searchable></x-combobox>
            </div>
            <div class="space-y-1.5 min-w-0">
              <label for="add-guest-displayname" class="gs-label">Tên trên thiệp</label>
              <input id="add-guest-displayname" placeholder="Trống = dùng họ tên" autocomplete="off" class="gs-field" />
            </div>
          </div>

          <!-- Xem trước dòng mời trên bìa thiệp (wedding-helper: "<lời mời> <xưng hô>" + tên)
               + link riêng khi khách đã lưu. -->
          <div class="gs-preview">
            <div class="px-4 pt-3 pb-3.5 text-center">
              <p class="gs-preview-cap">Khách sẽ thấy trên thiệp</p>
              <p class="mt-1.5 text-xs gs-preview-lead">Trân trọng kính mời <span id="add-guest-pv-rel" class="gs-preview-rel"></span></p>
              <p id="add-guest-pv-name" class="mt-0.5 text-lg font-semibold truncate"></p>
            </div>
            <div id="add-guest-result" class="hidden gs-preview-foot">
              <p id="add-guest-status" class="flex items-center gap-1.5 text-[12px] font-medium"></p>
              <div id="add-guest-link-row" class="flex items-center gap-2 transition-opacity">
                <input id="add-guest-link" readonly tabindex="-1" aria-label="Link mời riêng của khách"
                  class="flex-1 min-w-0 h-9 px-3 bg-white border border-gray-200 rounded-full text-[12px] text-gray-500 font-mono truncate outline-none" />
                <x-button variant="soft" tone="brand" size="sm" type="button" onclick="copyAddGuestLink()" class="shrink-0">
                  <i data-lucide="copy" style="width:14px;height:14px"></i>
                  <span>Sao chép</span>
                </x-button>
              </div>
            </div>
          </div>
        </div>

        <!-- "Lưu" là nút chính (lưu CHÍNH khách đang mở); "Thêm người khác" chỉ bật khi
             khách này đã lưu và mở form trống — khác "Lưu" cả kiểu nút lẫn icon. -->
        <div class="gs-sheet-foot">
          <x-button variant="ghost" tone="neutral" type="button" onclick="closeAddGuestModal()" class="-ml-2">Đóng</x-button>
          <div class="flex-1"></div>
          <x-button id="add-guest-new" variant="outline" tone="neutral" type="button" onclick="resetAddGuestForm()" disabled>
            <i data-lucide="user-plus" style="width:16px;height:16px"></i>
            <span>Thêm người khác</span>
          </x-button>
          <x-button id="add-guest-save" type="button" onclick="saveAddGuest()" class="min-w-[88px]">
            <i data-lucide="check" style="width:16px;height:16px"></i>
            <span>Lưu</span>
          </x-button>
        </div>
      </div>
    </div>

    <!-- Popup ghép cột khi nhập Excel (JS: _openMappingModal). Cùng vỏ với popup
         thêm khách: dưới sm là bottom sheet. -->
    <div id="import-mapping-modal" class="gs-modal hidden" role="dialog" aria-modal="true" aria-labelledby="map-title">
      <div class="gs-sheet sm:max-w-[480px]">
        <div class="gs-sheet-head">
          <span class="gs-sheet-ico gs-sheet-ico--ok"><i data-lucide="file-spreadsheet" style="width:20px;height:20px"></i></span>
          <div class="flex-1 min-w-0">
            <h2 id="map-title" class="gs-sheet-title">Nhập khách từ Excel</h2>
            <p id="map-sub" class="gs-sheet-sub">Ghép cột trong file với thông tin khách mời</p>
          </div>
          <x-button variant="ghost" tone="neutral" icon-only type="button" onclick="closeMappingModal()"
            aria-label="Đóng" class="-mr-2 -mt-1">
            <i data-lucide="x" style="width:18px;height:18px"></i>
          </x-button>
        </div>
        <div class="flex-1 min-h-0 overflow-y-auto px-5 pb-4 space-y-4">
          <div class="space-y-3">
            <div class="gs-map-row">
              <label for="map-full-name" class="gs-label">Họ và tên <span class="text-rose-500">*</span></label>
              <select id="map-full-name" class="gs-field gs-select"></select>
            </div>
            <div class="gs-map-row">
              <label for="map-display-name" class="gs-label">Tên trên thiệp</label>
              <select id="map-display-name" class="gs-field gs-select"></select>
            </div>
            <div class="gs-map-row">
              <label for="map-relationship" class="gs-label">Xưng hô</label>
              <select id="map-relationship" class="gs-field gs-select"></select>
            </div>
          </div>
          <div>
            <p class="gs-label mb-2">Xem trước dữ liệu</p>
            <div id="mapping-preview"></div>
          </div>
          <fieldset class="space-y-2">
            <legend class="gs-label mb-2">Khi nhập vào danh sách</legend>
            <label class="gs-radio">
              <input type="radio" name="import-mode" value="overwrite" checked />
              <span>
                <span class="gs-radio-title">Thay toàn bộ danh sách</span>
                <span class="gs-radio-desc">Xoá khách hiện có của bên này rồi nhập mới.</span>
              </span>
            </label>
            <label class="gs-radio">
              <input type="radio" name="import-mode" value="merge" />
              <span>
                <span class="gs-radio-title">Thêm vào danh sách</span>
                <span class="gs-radio-desc">Giữ khách cũ, bỏ qua dòng trùng Họ tên + Tên trên thiệp.</span>
              </span>
            </label>
          </fieldset>
        </div>
        <div class="gs-sheet-foot">
          <div class="flex-1"></div>
          <x-button variant="ghost" tone="neutral" type="button" onclick="closeMappingModal()">Huỷ</x-button>
          <x-button type="button" onclick="confirmImport()">
            <i data-lucide="file-up" style="width:16px;height:16px"></i>
            <span>Nhập khách</span>
          </x-button>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="../../core/x-button.js"></script>
    <script src="../../core/x-logo.js"></script>
    <script src="../../core/x-combobox.js"></script>
    <script src="../../core/x-popover.js"></script>
    <script src="../../core/cache-util.js"></script>
    <script src="../../core/dal/templates-dal.js"></script>
    <script src="../../core/config.js"></script>
    <!-- Trang này chạy trong iframe (không có AuthUI của trang cha) nhưng vẫn gọi
         guest-handler — vốn bắt buộc JWT của CHỦ THIỆP. Không nạp core/auth.js là
         request đi thiếu token và ăn 401. -->
    <script src="../../core/auth.js"></script>
    <script src="../../core/utils.js"></script>
    <script src="../../core/dal/wedding-dal.js"></script>
    <script src="../../core/dal/storage-dal.js"></script>
    <script src="../../core/dal/guest-dal.js"></script>
    <script src="../../core/bl/wedding-bl.js"></script>
    <script src="../../core/bl/image-bl.js"></script>
    <script src="../../core/bl/guest-bl.js"></script>
    <script src="../../core/supabase.js"></script>
    <script src="../../core/helpers/alert.js"></script>
    <script src="../../core/share-social.js"></script>
    <script src="index.js"></script>
  </body>
</html>
