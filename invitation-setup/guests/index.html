<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý khách mời</title>
    <link rel="icon" type="image/png" href="../../assets/icons/logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="../../styles/common.css" />
    <style>
      body { font-family: "Inter", sans-serif; background: #fdf8f9; }
    </style>
  </head>
  <body class="min-h-screen">

    <!-- Header -->
    <div class="bg-white border-b border-gray-100 sticky top-0 z-10">
      <div class="max-w-2xl mx-auto px-4 h-14 flex items-center gap-3">
        <button onclick="goBack()"
          class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-gray-100 transition-colors text-gray-500">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
        </button>
        <h1 class="text-sm font-semibold text-gray-800">Quản lý khách mời</h1>
      </div>
    </div>

    <!-- Main -->
    <div class="max-w-2xl mx-auto px-4 py-5 space-y-4">

      <!-- Tab bar -->
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <div class="flex border-b border-gray-100">
          <button type="button" id="tab-groom"
            onclick="switchTab('groom')"
            class="flex-1 py-3 text-sm font-medium flex items-center justify-center gap-1.5 bg-rose-50 text-rose-600 border-b-2 border-rose-500 transition-colors">
            <i data-lucide="mars" class="w-3.5 h-3.5"></i> Nhà trai
          </button>
          <button type="button" id="tab-bride"
            onclick="switchTab('bride')"
            class="flex-1 py-3 text-sm font-medium flex items-center justify-center gap-1.5 text-gray-500 hover:bg-gray-50 transition-colors">
            <i data-lucide="venus" class="w-3.5 h-3.5"></i> Nhà gái
          </button>
        </div>

        <!-- Panel nhà trai -->
        <div id="panel-groom" class="p-5 space-y-4">

          <!-- GAS URL -->
          <div class="space-y-2">
            <label class="text-xs text-gray-500">Google Apps Script URL (nhà trai)</label>
            <input id="gas-url-groom"
              placeholder="Dán liên kết Google Apps Script vào đây..."
              class="w-full h-10 px-3 border border-gray-200 rounded-lg text-xs text-gray-800 bg-white outline-none font-mono focus:ring-2 focus:ring-rose-500/30 placeholder:text-gray-400/50" />
            <div class="flex gap-2">
              <button type="button" onclick="testGASConnection('groom')" id="test-gas-btn-groom"
                class="h-8 px-3 rounded-lg text-xs border border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors flex items-center gap-1.5">
                <i data-lucide="plug" class="w-3 h-3"></i> Kiểm tra kết nối
              </button>
              <button type="button" onclick="saveGASUrl('groom')"
                class="h-8 px-3 rounded-lg text-xs font-medium text-white bg-gray-700 hover:bg-gray-800 transition-colors flex items-center gap-1.5">
                <i data-lucide="save" class="w-3 h-3"></i> Lưu
              </button>
            </div>
            <div id="gas-status-groom" class="hidden"></div>
          </div>

          <!-- Thêm 1 khách + Import -->
          <div class="border-t border-gray-100 pt-4 space-y-3">
            <p class="text-xs font-medium text-gray-600 flex items-center gap-1.5">
              <i data-lucide="users" class="w-3.5 h-3.5"></i>
              Danh sách khách mời
            </p>
            <div class="flex flex-wrap gap-2">
              <button type="button" onclick="openAddGuestModal('groom')"
                class="h-8 px-3 rounded-lg text-xs border border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors flex items-center gap-1.5">
                <i data-lucide="user-plus" class="w-3.5 h-3.5"></i> Thêm 1 khách
              </button>
              <button type="button" onclick="downloadGuestTemplate()"
                class="h-8 px-3 rounded-lg text-xs border border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors flex items-center gap-1.5">
                <i data-lucide="download" class="w-3.5 h-3.5"></i> Tải mẫu
              </button>
              <label class="h-8 px-3 rounded-lg text-xs font-medium text-white bg-rose-500 hover:bg-rose-600 transition-colors cursor-pointer flex items-center gap-1.5">
                <i data-lucide="file-up" class="w-3.5 h-3.5"></i> Nhập Excel
                <input type="file" class="hidden" accept=".xlsx,.xls" onchange="handleExcelUpload(event,'groom')">
              </label>
              <button type="button" onclick="exportGuestList('groom')"
                class="h-8 px-3 rounded-lg text-xs border border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors flex items-center gap-1.5">
                <i data-lucide="file-down" class="w-3.5 h-3.5"></i> Xuất Excel
              </button>
              <button type="button" onclick="regenerateLinks('groom')"
                class="h-8 px-3 rounded-lg text-xs border border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors flex items-center gap-1.5">
                <i data-lucide="link" class="w-3.5 h-3.5"></i> Tạo lại link
              </button>
            </div>
            <div id="guest-list-groom">
              <p class="text-xs text-gray-400 text-center py-4">Chưa có khách mời nào</p>
            </div>
          </div>
        </div>

        <!-- Panel nhà gái -->
        <div id="panel-bride" class="hidden p-5 space-y-4">

          <!-- GAS URL -->
          <div class="space-y-2">
            <label class="text-xs text-gray-500">Google Apps Script URL (nhà gái)</label>
            <input id="gas-url-bride"
              placeholder="Dán liên kết Google Apps Script vào đây..."
              class="w-full h-10 px-3 border border-gray-200 rounded-lg text-xs text-gray-800 bg-white outline-none font-mono focus:ring-2 focus:ring-rose-500/30 placeholder:text-gray-400/50" />
            <div class="flex gap-2">
              <button type="button" onclick="testGASConnection('bride')" id="test-gas-btn-bride"
                class="h-8 px-3 rounded-lg text-xs border border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors flex items-center gap-1.5">
                <i data-lucide="plug" class="w-3 h-3"></i> Kiểm tra kết nối
              </button>
              <button type="button" onclick="saveGASUrl('bride')"
                class="h-8 px-3 rounded-lg text-xs font-medium text-white bg-gray-700 hover:bg-gray-800 transition-colors flex items-center gap-1.5">
                <i data-lucide="save" class="w-3 h-3"></i> Lưu
              </button>
            </div>
            <div id="gas-status-bride" class="hidden"></div>
          </div>

          <!-- Thêm 1 khách + Import -->
          <div class="border-t border-gray-100 pt-4 space-y-3">
            <p class="text-xs font-medium text-gray-600 flex items-center gap-1.5">
              <i data-lucide="users" class="w-3.5 h-3.5"></i>
              Danh sách khách mời
            </p>
            <div class="flex flex-wrap gap-2">
              <button type="button" onclick="openAddGuestModal('bride')"
                class="h-8 px-3 rounded-lg text-xs border border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors flex items-center gap-1.5">
                <i data-lucide="user-plus" class="w-3.5 h-3.5"></i> Thêm 1 khách
              </button>
              <button type="button" onclick="downloadGuestTemplate()"
                class="h-8 px-3 rounded-lg text-xs border border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors flex items-center gap-1.5">
                <i data-lucide="download" class="w-3.5 h-3.5"></i> Tải mẫu
              </button>
              <label class="h-8 px-3 rounded-lg text-xs font-medium text-white bg-rose-500 hover:bg-rose-600 transition-colors cursor-pointer flex items-center gap-1.5">
                <i data-lucide="file-up" class="w-3.5 h-3.5"></i> Nhập Excel
                <input type="file" class="hidden" accept=".xlsx,.xls" onchange="handleExcelUpload(event,'bride')">
              </label>
              <button type="button" onclick="exportGuestList('bride')"
                class="h-8 px-3 rounded-lg text-xs border border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors flex items-center gap-1.5">
                <i data-lucide="file-down" class="w-3.5 h-3.5"></i> Xuất Excel
              </button>
              <button type="button" onclick="regenerateLinks('bride')"
                class="h-8 px-3 rounded-lg text-xs border border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors flex items-center gap-1.5">
                <i data-lucide="link" class="w-3.5 h-3.5"></i> Tạo lại link
              </button>
            </div>
            <div id="guest-list-bride">
              <p class="text-xs text-gray-400 text-center py-4">Chưa có khách mời nào</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Add Guest Modal -->
    <div id="add-guest-modal"
      class="fixed inset-0 z-[99999] bg-black/50 hidden items-center justify-center p-4">
      <div class="bg-white rounded-2xl w-full max-w-sm shadow-xl overflow-hidden">
        <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">
          <h3 class="text-sm font-semibold text-gray-800">Thêm 1 khách mời</h3>
          <button type="button" onclick="closeAddGuestModal()"
            class="w-7 h-7 rounded-full flex items-center justify-center hover:bg-gray-100 text-gray-400">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
        <div class="px-5 py-4 space-y-3">
          <div class="space-y-1.5">
            <label class="text-xs text-gray-500">Họ và tên <span class="text-rose-500">*</span></label>
            <input id="add-guest-fullname" placeholder="VD: Nguyễn Văn A"
              class="w-full h-9 px-3 border border-gray-200 rounded-lg text-xs text-gray-800 outline-none focus:ring-2 focus:ring-rose-500/30 placeholder:text-gray-400/50" />
          </div>
          <div class="space-y-1.5">
            <label class="text-xs text-gray-500">Tên hiển thị (trên thiệp)</label>
            <input id="add-guest-displayname" placeholder="VD: Anh Minh"
              class="w-full h-9 px-3 border border-gray-200 rounded-lg text-xs text-gray-800 outline-none focus:ring-2 focus:ring-rose-500/30 placeholder:text-gray-400/50" />
          </div>
          <div class="space-y-1.5">
            <label class="text-xs text-gray-500">Quan hệ</label>
            <input id="add-guest-relationship" placeholder="VD: Bạn thân, Đồng nghiệp"
              class="w-full h-9 px-3 border border-gray-200 rounded-lg text-xs text-gray-800 outline-none focus:ring-2 focus:ring-rose-500/30 placeholder:text-gray-400/50" />
          </div>
        </div>
        <div class="flex gap-2 px-5 py-4 border-t border-gray-100">
          <button type="button" onclick="closeAddGuestModal()"
            class="flex-1 h-9 rounded-lg text-xs border border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors">Huỷ</button>
          <button type="button" onclick="confirmAddGuest()"
            class="flex-1 h-9 rounded-lg text-xs font-medium text-white bg-rose-500 hover:bg-rose-600 transition-colors">Thêm khách</button>
        </div>
      </div>
    </div>

    <!-- Import Mapping Modal -->
    <div id="import-mapping-modal"
      class="fixed inset-0 z-[99999] bg-black/50 hidden items-center justify-center p-4">
      <div class="bg-white rounded-2xl w-full max-w-md shadow-xl overflow-hidden max-h-[90vh] flex flex-col">
        <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">
          <div>
            <h3 class="text-sm font-semibold text-gray-800">Mapping cột dữ liệu</h3>
            <p class="text-xs text-gray-400 mt-0.5">Chọn cột tương ứng từ file Excel</p>
          </div>
          <button type="button" onclick="closeMappingModal()"
            class="w-7 h-7 rounded-full flex items-center justify-center hover:bg-gray-100 text-gray-400">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
        <div class="flex-1 overflow-y-auto px-5 py-4 space-y-4">
          <div class="space-y-3">
            <div class="flex items-center gap-3">
              <span class="text-xs text-gray-600 w-28 shrink-0">Họ và tên <span class="text-rose-500">*</span></span>
              <select id="map-full-name"
                class="flex-1 h-9 px-2 border border-gray-200 rounded-lg text-xs text-gray-700 outline-none focus:ring-2 focus:ring-rose-500/30"></select>
            </div>
            <div class="flex items-center gap-3">
              <span class="text-xs text-gray-600 w-28 shrink-0">Tên hiển thị</span>
              <select id="map-display-name"
                class="flex-1 h-9 px-2 border border-gray-200 rounded-lg text-xs text-gray-700 outline-none focus:ring-2 focus:ring-rose-500/30"></select>
            </div>
            <div class="flex items-center gap-3">
              <span class="text-xs text-gray-600 w-28 shrink-0">Quan hệ</span>
              <select id="map-relationship"
                class="flex-1 h-9 px-2 border border-gray-200 rounded-lg text-xs text-gray-700 outline-none focus:ring-2 focus:ring-rose-500/30"></select>
            </div>
          </div>
          <div>
            <p class="text-xs font-medium text-gray-500 mb-2">Xem trước dữ liệu</p>
            <div id="mapping-preview"></div>
          </div>
          <div class="bg-gray-50 rounded-xl p-3 space-y-2">
            <p class="text-xs font-medium text-gray-600">Khi nhập khẩu:</p>
            <label class="flex items-center gap-2.5 cursor-pointer">
              <input type="radio" name="import-mode" value="overwrite" checked class="accent-rose-500 w-3.5 h-3.5">
              <span class="text-xs text-gray-700">Ghi đè toàn bộ</span>
            </label>
            <label class="flex items-center gap-2.5 cursor-pointer">
              <input type="radio" name="import-mode" value="merge" class="accent-rose-500 w-3.5 h-3.5">
              <span class="text-xs text-gray-700">Không ghi đè <span class="text-gray-400">(bỏ qua trùng Họ tên + Tên thiệp)</span></span>
            </label>
          </div>
        </div>
        <div class="flex gap-2 px-5 py-4 border-t border-gray-100">
          <button type="button" onclick="closeMappingModal()"
            class="flex-1 h-9 rounded-lg text-xs border border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors">Huỷ</button>
          <button type="button" onclick="confirmImport()"
            class="flex-1 h-9 rounded-lg text-xs font-medium text-white bg-rose-500 hover:bg-rose-600 transition-colors">Nhập khẩu</button>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="../../core/config.js"></script>
    <script src="../../core/utils.js"></script>
    <script src="../../core/dal/wedding-dal.js"></script>
    <script src="../../core/dal/storage-dal.js"></script>
    <script src="../../core/dal/guest-dal.js"></script>
    <script src="../../core/bl/wedding-bl.js"></script>
    <script src="../../core/bl/image-bl.js"></script>
    <script src="../../core/bl/guest-bl.js"></script>
    <script src="../../core/supabase.js"></script>
    <script src="../../core/helpers/alert.js"></script>
    <script src="index.js"></script>
  </body>
</html>
