<!doctype html>
<!-- cx-setup: cờ khoá phạm vi cho dải "Xem trực tiếp" + app shell (chỉ trang
     này mới không cuộn trang) — styles/build.css dùng chung cho mọi trang.
     cx-rail-off khai sẵn để lúc SKELETON trang chưa chừa lề phải cho dải xem
     trực tiếp (dải chưa có gì để vẽ, chừa chỗ là ra một mảng trống);
     _syncRail() gỡ cờ khi dữ liệu đã đổ xong và đang ở tab Chỉnh sửa. -->
<html lang="vi" class="cx-setup cx-rail-off">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>Cưới Xinh — Thiết lập Thiệp Cưới</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../assets/icons/logo.png" />

    <!-- Cropper.js for image cropping -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

    <!-- Coloris: bộ chọn màu cho tab Giao diện (gradient + hue/alpha + swatches) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@melloware/coloris@0.10.3/dist/coloris.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@melloware/coloris@0.10.3/dist/coloris.min.js"></script>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@1.26.0/dist/umd/lucide.min.js" integrity="sha384-8/6sFI5UzGbr1Dgef7WSZvE4UemcVc/jyaQNsM+MilmnHQ9sce/pRv86XXj5Cg5m" crossorigin="anonymous"></script>
    <!-- Font Awesome: bảng "Thành phần" (tab Giao diện) dựng trình phát nhạc
         bằng chính markup của thiệp (core/components/music-player.js), icon
         phát/tua trong đó là FA — không nạp thì ô xem trước trống trơn. -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Leaflet -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Flatpickr CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css" integrity="sha384-RkASv+6KfBMW9eknReJIJ6b3UnjKOKC5bOUaNgIY778NFbQ8MtWq9Lr/khUgqtTt" crossorigin="anonymous"
    />
    <!-- Tailwind build local (npm run build:css) — gộp cả 3 file CSS cũ của trang
         (_common.css, _ai-modal.css, _setup.css). PHẢI đứng sau CSS của
         Coloris/Flatpickr ở trên vì có các rule đè lên chúng. -->
    <link rel="stylesheet" href="../styles/build.css" />
  </head>
  <!-- font-inter thay cho fontFamily.sans = Inter trong config inline cũ. -->
  <body
    class="font-inter min-h-screen bg-[rgb(var(--surface-tint-rgb))] overflow-x-hidden"
  >
    <span id="mount-skeleton" hidden></span>

    <!-- Actual Content (hidden initially) -->
    <div id="actual-content" class="hidden">
      <span id="mount-header" hidden></span>
      <span id="mount-form-panel" hidden></span>

      <!-- Preview Fullscreen Overlay -->
      <div
        id="preview-panel"
        class="hidden fixed inset-0 bottom-[var(--nav-h)] z-[200] bg-[rgb(var(--surface-tint-rgb))] flex flex-col overflow-hidden"
      >
        <!-- Thiệp nằm trong THẺ NỔI cùng khổ/cùng bo góc với các tab khác; vỏ
             chỉ giữ lề 8px quanh thẻ. -->
        <div class="flex-1 min-h-0 px-2 sm:px-4 pt-2 pb-2">
          <div
            class="h-full max-w-4xl mx-auto overflow-hidden bg-white border border-gray-100 rounded-3xl shadow-[0_4px_18px_rgb(var(--scrim-rgb)/0.07)]"
          >
            <!-- allow="autoplay": trình phát nhạc là iframe youtube.com lồng bên
                 trong (khác origin) nên phải được uỷ quyền qua TỪNG lớp iframe,
                 thiếu là nhạc nền không tự phát dù đã chọn bài. -->
            <iframe
              id="preview-iframe"
              src=""
              class="w-full h-full border-0"
              allow="autoplay; encrypted-media"
              allowfullscreen
            ></iframe>
          </div>
        </div>
      </div>
      <!-- /preview-panel -->

      <span id="mount-config-panel" hidden></span>

      <span id="mount-theme-panel" hidden></span>

      <span id="mount-guests-panel" hidden></span>

      <span id="mount-nav-bottom" hidden></span>
      <!-- /actual-content -->

      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8" integrity="sha384-Tve8O+C6PBzsIMK/IRCwHbi8fyEzXIlIs6OfVBZHubplwYhaQF/4Mzxqgg+pp/oy" crossorigin="anonymous"></script>
      <!-- Flatpickr JS -->
      <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13" integrity="sha384-5JqMv4L/Xa0hfvtF06qboNdhvuYXUku9ZrhZh3bSk8VXF0A/RuSLHpLsSV9Zqhl6" crossorigin="anonymous"></script>
      <!-- CryptoJS for encryption -->
      <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

      <!-- SheetJS for Excel import/export -->
      <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

      <!-- Nạp partials/*.html vào các thẻ mount ở trên, rồi mới chèn script app
           (core/*, index.js, ai-modal.js, tour-setup.js). Xem loader.js. -->
      <script src="loader.js"></script>
    </div>
    <!-- End Actual Content -->

    <span id="mount-import-modal" hidden></span>

    <span id="mount-ai-card" hidden></span>
  </body>
</html>
