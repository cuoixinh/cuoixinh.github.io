<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>Cưới Xinh — Thiết lập Thiệp Cưới</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../assets/icons/logo.png" />

    <!-- Cropper.js for image cropping -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

    <!-- Coloris: bộ chọn màu cho tab Giao diện (gradient + hue/alpha + swatches) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@melloware/coloris@0.10.3/dist/coloris.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@melloware/coloris@0.10.3/dist/coloris.min.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
            },
            colors: {
              "pink-light": "rgb(255 163 181)",
              "pink-light-hover": "rgb(255 143 161)",
            },
            animation: {
              "fade-in": "fadeIn 0.3s ease-out",
            },
            keyframes: {
              fadeIn: {
                "0%": { opacity: "0", transform: "translateY(10px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
            },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <!-- Leaflet -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Flatpickr CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"
    />
    <!-- Common CSS -->
    <link rel="stylesheet" href="../styles/common.css" />
    <!-- AI modal CSS -->
    <link rel="stylesheet" href="ai-modal.css" />
    <!-- Style riêng của trang thiết lập -->
    <link rel="stylesheet" href="setup.css" />
  </head>
  <body
    class="min-h-screen bg-gradient-to-br from-slate-50 via-white to-slate-100 overflow-x-hidden"
  >
    <!-- Skeleton Loading -->
    <div id="skeleton-loader" class="min-h-screen">
      <!-- Bottom Bar Skeleton -->
      <div
        class="fixed bottom-0 left-0 right-0 z-50 bg-white border-t border-rose-100 shadow-[0_-2px_12px_rgba(0,0,0,0.06)]"
      >
        <div class="max-w-4xl mx-auto flex items-stretch">
          <!-- Chuyển Chỉnh sửa/Xem trước -->
          <div
            class="flex-1 sm:flex-[2] flex items-center justify-center px-2 sm:px-3"
          >
            <div class="h-8 w-full skeleton rounded-full"></div>
          </div>
          <!-- Cấu hình -->
          <div
            class="flex-none px-3 sm:flex-1 sm:px-0 flex flex-col items-center justify-center py-3 gap-1.5"
          >
            <div class="h-4 w-4 skeleton rounded"></div>
            <div class="h-2.5 w-10 skeleton rounded hidden sm:block"></div>
          </div>
          <!-- Khách mời -->
          <div
            class="flex-none px-3 sm:flex-1 sm:px-0 flex flex-col items-center justify-center py-3 gap-1.5"
          >
            <div class="h-4 w-4 skeleton rounded"></div>
            <div class="h-2.5 w-10 skeleton rounded hidden sm:block"></div>
          </div>
          <!-- Lưu nháp -->
          <div class="flex-1 flex items-center justify-center px-1.5 py-2">
            <div class="h-9 w-full skeleton rounded-full"></div>
          </div>
          <!-- Xuất bản -->
          <div class="flex-1 flex items-center justify-center px-1.5 py-2">
            <div class="h-9 w-full skeleton rounded-full"></div>
          </div>
        </div>
      </div>

      <div class="max-w-4xl mx-auto px-4 py-8">
        <!-- Link Section Skeleton -->
        <div
          class="bg-white rounded-3xl shadow-md border border-gray-100 p-6 mb-6"
        >
          <div class="h-6 w-48 skeleton rounded-lg mb-4"></div>
          <div class="space-y-4">
            <div class="bg-white rounded-2xl p-4 border border-gray-100">
              <div class="h-5 w-40 skeleton rounded mb-2"></div>
              <div class="h-12 skeleton rounded-xl"></div>
            </div>
            <div class="bg-white rounded-2xl p-4 border border-gray-100">
              <div class="h-5 w-40 skeleton rounded mb-2"></div>
              <div class="h-12 skeleton rounded-xl"></div>
            </div>
          </div>
        </div>

        <!-- General Info Skeleton -->
        <div
          class="bg-white rounded-3xl shadow-md border border-gray-100 overflow-hidden mb-6"
        >
          <div class="bg-white px-6 py-4 border-b border-gray-100">
            <div class="h-5 w-40 skeleton rounded"></div>
          </div>
          <div class="p-6 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
              <div class="h-14 skeleton rounded-2xl"></div>
              <div class="h-14 skeleton rounded-2xl"></div>
            </div>
            <div class="h-24 skeleton rounded-2xl"></div>
            <div class="aspect-[3/4] w-full max-w-xs skeleton rounded-lg"></div>
            <div class="grid grid-cols-4 gap-3">
              <div class="aspect-square skeleton rounded-lg"></div>
              <div class="aspect-square skeleton rounded-lg"></div>
              <div class="aspect-square skeleton rounded-lg"></div>
              <div class="aspect-square skeleton rounded-lg"></div>
            </div>
          </div>
        </div>

        <!-- Ceremony Skeleton -->
        <div
          class="bg-white rounded-3xl shadow-md border border-gray-100 overflow-hidden mb-6"
        >
          <div class="bg-white px-6 py-4 border-b border-gray-100">
            <div class="h-5 w-32 skeleton rounded"></div>
          </div>
          <div class="p-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="h-14 skeleton rounded-2xl"></div>
              <div class="h-14 skeleton rounded-2xl"></div>
            </div>
          </div>
        </div>

        <!-- Two Column Skeleton -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <!-- Groom Skeleton -->
          <div class="bg-white rounded-3xl shadow-md border border-gray-100">
            <div class="bg-white px-6 py-4 border-b border-gray-100">
              <div class="h-5 w-32 skeleton rounded"></div>
            </div>
            <div class="p-6 space-y-6">
              <div class="grid grid-cols-2 gap-5">
                <div class="h-14 skeleton rounded-2xl"></div>
                <div class="h-14 skeleton rounded-2xl"></div>
              </div>
              <div class="h-14 skeleton rounded-2xl"></div>
              <div class="h-52 w-[183px] skeleton rounded-lg"></div>
              <div class="h-14 skeleton rounded-2xl"></div>
              <div class="h-20 skeleton rounded-2xl"></div>
              <div class="h-14 skeleton rounded-2xl"></div>
              <div class="bg-white rounded-2xl p-5 border border-gray-100">
                <div class="h-5 w-24 skeleton rounded mb-4"></div>
                <div class="grid grid-cols-2 gap-4 mb-4">
                  <div class="h-14 skeleton rounded-2xl"></div>
                  <div class="h-14 skeleton rounded-2xl"></div>
                </div>
                <div class="h-14 skeleton rounded-2xl"></div>
              </div>
              <div class="bg-white rounded-2xl p-5 border border-gray-100">
                <div class="h-5 w-32 skeleton rounded mb-4"></div>
                <div class="h-14 skeleton rounded-2xl mb-4"></div>
                <div class="grid grid-cols-2 gap-4 mb-4">
                  <div class="h-14 skeleton rounded-2xl"></div>
                  <div class="h-14 skeleton rounded-2xl"></div>
                </div>
                <div class="w-32 aspect-square skeleton rounded-lg"></div>
              </div>
            </div>
          </div>

          <!-- Bride Skeleton -->
          <div class="bg-white rounded-3xl shadow-md border border-gray-100">
            <div class="bg-white px-6 py-4 border-b border-gray-100">
              <div class="h-5 w-32 skeleton rounded"></div>
            </div>
            <div class="p-6 space-y-6">
              <div class="grid grid-cols-2 gap-5">
                <div class="h-14 skeleton rounded-2xl"></div>
                <div class="h-14 skeleton rounded-2xl"></div>
              </div>
              <div class="h-14 skeleton rounded-2xl"></div>
              <div class="h-52 w-[183px] skeleton rounded-lg"></div>
              <div class="h-14 skeleton rounded-2xl"></div>
              <div class="h-20 skeleton rounded-2xl"></div>
              <div class="h-14 skeleton rounded-2xl"></div>
              <div class="bg-white rounded-2xl p-5 border border-gray-100">
                <div class="h-5 w-24 skeleton rounded mb-4"></div>
                <div class="grid grid-cols-2 gap-4 mb-4">
                  <div class="h-14 skeleton rounded-2xl"></div>
                  <div class="h-14 skeleton rounded-2xl"></div>
                </div>
                <div class="h-14 skeleton rounded-2xl"></div>
              </div>
              <div class="bg-white rounded-2xl p-5 border border-gray-100">
                <div class="h-5 w-32 skeleton rounded mb-4"></div>
                <div class="h-14 skeleton rounded-2xl mb-4"></div>
                <div class="grid grid-cols-2 gap-4 mb-4">
                  <div class="h-14 skeleton rounded-2xl"></div>
                  <div class="h-14 skeleton rounded-2xl"></div>
                </div>
                <div class="w-32 aspect-square skeleton rounded-lg"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Actual Content (hidden initially) -->
    <div id="actual-content" class="hidden">
      <span id="mount-header" hidden></span>
      <span id="mount-form-panel" hidden></span>

      <!-- Preview Fullscreen Overlay -->
      <div
        id="preview-panel"
        class="hidden fixed inset-0 bottom-[60px] z-[200] bg-white flex flex-col"
      >
        <iframe
          id="preview-iframe"
          src=""
          class="flex-1 border-0 w-full min-h-0"
          allowfullscreen
        ></iframe>
      </div>
      <!-- /preview-panel -->

      <span id="mount-config-panel" hidden></span>

      <span id="mount-theme-panel" hidden></span>

      <span id="mount-guests-panel" hidden></span>

      <span id="mount-nav-bottom" hidden></span>
      <!-- /actual-content -->

      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
      <!-- Flatpickr JS -->
      <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
      <!-- CryptoJS for encryption -->
      <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

      <!-- SheetJS for Excel import/export -->
      <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

      <!-- Nạp partials/*.html vào các thẻ mount ở trên, rồi mới chèn script app
           (core/*, index.js, ai-modal.js, tour-setup.js). Xem loader.js. -->
      <script src="loader.js"></script>
    </div>
    <!-- End Actual Content -->

    <span id="mount-import-modal" hidden></span>

    <span id="mount-ai-card" hidden></span>
  </body>
</html>
