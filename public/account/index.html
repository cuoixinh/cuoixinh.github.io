<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đơn hàng - Cưới Xinh</title>
    <link rel="icon" type="image/png" href="../../assets/icons/logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              playfair: ["Playfair Display", "serif"],
              inter: ["Inter", "sans-serif"],
            },
            colors: {
              "rose-pastel": { 100: "#fef1f7", 200: "#fce7f3", 300: "#fbcfe8" },
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Inter", sans-serif;
        color: rgb(173 122 135);
      }
      .tab-active {
        border-bottom: 2px solid rgb(255 183 202);
        color: rgb(255 183 202) !important;
      }
    </style>
    <link rel="stylesheet" href="../../styles/common.css" />
  </head>
  <body class="bg-rose-pastel-100 min-h-screen">
    <nav class="bg-white/95 backdrop-blur-sm border-b border-rose-pastel-200">
      <div class="container mx-auto px-4">
        <div class="flex items-center h-16 gap-3">
          <button onclick="goBack()" class="flex items-center gap-1.5 text-sm hover:opacity-80 transition-opacity" style="color: rgb(255 183 202)">
            <i class="fas fa-arrow-left"></i>Trở lại
          </button>
          <div class="flex-1"></div>
          <img src="../../assets/icons/logo.png" alt="Cuoi Xinh Logo" class="h-16 w-auto" />
        </div>
      </div>
    </nav>

    <div class="container mx-auto px-4 py-8 max-w-2xl">
      <!-- Auth Block -->
      <div class="bg-white rounded-2xl shadow-sm p-6 mb-6">
        <div id="auth-loggedout">
          <p class="text-sm text-gray-500 mb-4 text-center">
            Đăng nhập hoặc tạo tài khoản để đồng bộ đơn hàng của bạn
          </p>
          <!-- Form đăng nhập/tạo tài khoản dùng chung (đổ bởi AuthUI.renderForm) -->
          <div id="auth-form-container"></div>
        </div>
        <div id="auth-loggedin" class="hidden">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div
                id="user-avatar"
                class="w-9 h-9 rounded-full flex items-center justify-center overflow-hidden"
                style="background-color: rgb(254 241 247)"
              >
                <i
                  class="fas fa-user text-sm"
                  style="color: rgb(255 183 202)"
                ></i>
              </div>
              <div>
                <p class="font-medium text-sm" id="user-name">Người dùng</p>
                <p class="text-xs text-gray-500" id="user-email"></p>
              </div>
            </div>
            <button
              onclick="logout()"
              class="text-sm px-4 py-1.5 rounded-full border transition-all hover:bg-gray-50"
              style="border-color: rgb(255 183 202); color: rgb(173 122 135)"
            >
              Đăng xuất
            </button>
          </div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="bg-white rounded-2xl shadow-sm">
        <div class="flex border-b border-gray-200">
          <button
            class="tab-btn tab-active px-6 py-4 text-sm font-medium"
            onclick="switchTab('orders')"
            id="tab-orders"
          >
            <i class="fas fa-shopping-bag mr-2"></i>Đơn hàng
          </button>
          <button
            class="tab-btn px-6 py-4 text-sm font-medium text-gray-500"
            onclick="switchTab('profile')"
            id="tab-profile"
          >
            <i class="fas fa-user mr-2"></i>Thông tin cá nhân
          </button>
        </div>
        <div id="content-orders" class="p-6">
          <div id="orders-list"></div>
          <div id="empty-orders" class="text-center py-12 hidden">
            <i class="fas fa-shopping-bag text-5xl text-gray-300 mb-4"></i>
            <p class="text-gray-500 mb-4">Bạn chưa có đơn hàng nào</p>
            <a
              href="../../index.html#contact"
              class="inline-block px-6 py-2 rounded-full text-white text-sm font-medium"
              style="background-color: rgb(255 183 202)"
            >
              Đặt thiệp ngay
            </a>
          </div>
        </div>
        <div id="content-profile" class="p-6 hidden">
          <form id="profile-form" class="max-w-md">
            <div class="mb-4">
              <label class="block text-sm font-medium mb-2">Họ và tên</label>
              <input
                type="text"
                id="profile-name"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none"
                placeholder="Nhập họ và tên"
              />
            </div>
            <div class="mb-4">
              <label class="block text-sm font-medium mb-2">Email</label>
              <input
                type="email"
                id="profile-email-input"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none"
                placeholder="Nhập email"
              />
            </div>
            <div class="mb-4">
              <label class="block text-sm font-medium mb-2"
                >Số điện thoại</label
              >
              <input
                type="tel"
                id="profile-phone"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none"
                placeholder="Nhập số điện thoại"
              />
            </div>
            <button
              type="submit"
              class="w-full py-3 rounded-lg text-white font-medium"
              style="background-color: rgb(255 183 202)"
            >
              Lưu thông tin
            </button>
          </form>
        </div>
      </div>
    </div>

    <script src="../../core/config.js"></script>
    <script src="../../core/helpers/alert.js"></script>
    <script src="../../core/auth-ui.js"></script>
    <script src="index.js"></script>
    <script src="../../core/payment.js"></script>

    <!-- Modal Chi Tiết Đơn Hàng -->
    <div
      id="order-modal"
      class="fixed inset-0 z-50 hidden items-center justify-center p-4"
      style="background: rgba(0, 0, 0, 0.5)"
    >
      <div
        class="bg-white rounded-2xl w-full max-w-md shadow-xl overflow-hidden"
      >
        <!-- Header -->
        <div
          class="flex items-center justify-between px-6 py-4 border-b border-gray-100"
        >
          <h3 class="font-semibold text-base" style="color: rgb(173 122 135)">
            Chi tiết đơn hàng
          </h3>
          <button
            onclick="closeOrderModal()"
            class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-gray-100 transition-colors"
          >
            <i class="fas fa-times text-gray-400 text-sm"></i>
          </button>
        </div>
        <!-- Body -->
        <div id="order-modal-body" class="p-6"></div>
      </div>
    </div>
  </body>
</html>
