<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đơn hàng - Cưới Xinh</title>
    <link rel="icon" type="image/png" href="../../assets/icons/logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              playfair: ["Playfair Display", "serif"],
              inter: ["Inter", "sans-serif"],
            },
            colors: {
              "rose-pastel": { 100: "#fef1f7", 200: "#fce7f3", 300: "#fbcfe8" },
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Inter", sans-serif;
        color: rgb(173 122 135);
      }
      .tab-active {
        border-bottom: 2px solid rgb(255 183 202);
        color: rgb(255 183 202) !important;
      }
    </style>
    <link rel="stylesheet" href="../../styles/common.css" />
  </head>
  <body class="bg-rose-pastel-100 min-h-screen">
    <nav class="bg-white/95 backdrop-blur-sm border-b border-rose-pastel-200">
      <div class="container mx-auto px-4">
        <div class="flex items-center justify-between h-16">
          <a href="../../index.html">
            <img
              src="../../assets/icons/logo.png"
              alt="Cuoi Xinh Logo"
              class="h-16 w-auto"
            />
          </a>
          <a
            href="../../index.html"
            class="text-sm hover:opacity-80"
            style="color: rgb(255 183 202)"
          >
            <i class="fas fa-arrow-left mr-2"></i>Về trang chủ
          </a>
        </div>
      </div>
    </nav>

    <div class="container mx-auto px-4 py-8 max-w-2xl">
      <!-- Auth Block -->
      <div class="bg-white rounded-2xl shadow-sm p-6 mb-6">
        <div id="auth-loggedout">
          <p class="text-sm text-gray-500 mb-4 text-center">
            Đăng nhập để đồng bộ đơn hàng của bạn
          </p>
          <div class="flex flex-col sm:flex-row gap-3">
            <button
              onclick="loginWithFacebook()"
              class="flex-1 py-2.5 px-4 rounded-lg font-medium flex items-center justify-center gap-2 transition-all hover:opacity-90 text-sm"
              style="background-color: #1877f2; color: white"
            >
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                <path
                  d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"
                />
              </svg>
              Tiếp tục với Facebook
            </button>
            <button
              onclick="loginWithGoogle()"
              class="flex-1 py-2.5 px-4 rounded-lg font-medium flex items-center justify-center gap-2 border-2 border-gray-300 transition-all hover:bg-gray-50 text-sm"
              style="color: #333"
            >
              <svg class="w-4 h-4" viewBox="0 0 24 24">
                <path
                  fill="#4285F4"
                  d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                />
                <path
                  fill="#34A853"
                  d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                />
                <path
                  fill="#FBBC05"
                  d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                />
                <path
                  fill="#EA4335"
                  d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                />
              </svg>
              Tiếp tục với Google
            </button>
          </div>
        </div>
        <div id="auth-loggedin" class="hidden">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div
                id="user-avatar"
                class="w-9 h-9 rounded-full flex items-center justify-center overflow-hidden"
                style="background-color: rgb(254 241 247)"
              >
                <i
                  class="fas fa-user text-sm"
                  style="color: rgb(255 183 202)"
                ></i>
              </div>
              <div>
                <p class="font-medium text-sm" id="user-name">Người dùng</p>
                <p class="text-xs text-gray-500" id="user-email"></p>
              </div>
            </div>
            <button
              onclick="logout()"
              class="text-sm px-4 py-1.5 rounded-full border transition-all hover:bg-gray-50"
              style="border-color: rgb(255 183 202); color: rgb(173 122 135)"
            >
              Đăng xuất
            </button>
          </div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="bg-white rounded-2xl shadow-sm">
        <div class="flex border-b border-gray-200">
          <button
            class="tab-btn tab-active px-6 py-4 text-sm font-medium"
            onclick="switchTab('orders')"
            id="tab-orders"
          >
            <i class="fas fa-shopping-bag mr-2"></i>Đơn hàng
          </button>
          <button
            class="tab-btn px-6 py-4 text-sm font-medium text-gray-500"
            onclick="switchTab('profile')"
            id="tab-profile"
          >
            <i class="fas fa-user mr-2"></i>Thông tin cá nhân
          </button>
        </div>
        <div id="content-orders" class="p-6">
          <div id="orders-list"></div>
          <div id="empty-orders" class="text-center py-12 hidden">
            <i class="fas fa-shopping-bag text-5xl text-gray-300 mb-4"></i>
            <p class="text-gray-500 mb-4">Bạn chưa có đơn hàng nào</p>
            <a
              href="../../index.html#contact"
              class="inline-block px-6 py-2 rounded-full text-white text-sm font-medium"
              style="background-color: rgb(255 183 202)"
            >
              Đặt thiệp ngay
            </a>
          </div>
        </div>
        <div id="content-profile" class="p-6 hidden">
          <form id="profile-form" class="max-w-md">
            <div class="mb-4">
              <label class="block text-sm font-medium mb-2">Họ và tên</label>
              <input
                type="text"
                id="profile-name"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none"
                placeholder="Nhập họ và tên"
              />
            </div>
            <div class="mb-4">
              <label class="block text-sm font-medium mb-2">Email</label>
              <input
                type="email"
                id="profile-email-input"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none"
                placeholder="Nhập email"
              />
            </div>
            <div class="mb-4">
              <label class="block text-sm font-medium mb-2"
                >Số điện thoại</label
              >
              <input
                type="tel"
                id="profile-phone"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none"
                placeholder="Nhập số điện thoại"
              />
            </div>
            <button
              type="submit"
              class="w-full py-3 rounded-lg text-white font-medium"
              style="background-color: rgb(255 183 202)"
            >
              Lưu thông tin
            </button>
          </form>
        </div>
      </div>
    </div>

    <script src="../../core/config.js"></script>
    <script src="account.js"></script>
    <script src="../../core/payment.js"></script>

    <!-- Modal Chi Tiết Đơn Hàng -->
    <div
      id="order-modal"
      class="fixed inset-0 z-50 hidden items-center justify-center p-4"
      style="background: rgba(0, 0, 0, 0.5)"
    >
      <div
        class="bg-white rounded-2xl w-full max-w-md shadow-xl overflow-hidden"
      >
        <!-- Header -->
        <div
          class="flex items-center justify-between px-6 py-4 border-b border-gray-100"
        >
          <h3 class="font-semibold text-base" style="color: rgb(173 122 135)">
            Chi tiết đơn hàng
          </h3>
          <button
            onclick="closeOrderModal()"
            class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-gray-100 transition-colors"
          >
            <i class="fas fa-times text-gray-400 text-sm"></i>
          </button>
        </div>
        <!-- Body -->
        <div id="order-modal-body" class="p-6"></div>
      </div>
    </div>
  </body>
</html>
