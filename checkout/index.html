<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Thanh toán - Cưới Xinh</title>
    <!-- iOS Safari tự biến email/số điện thoại trong trang thành link: ở màn
         này là email người mua, bấm nhầm một cái là văng sang app Mail đúng
         lúc sắp trả tiền. -->
    <meta name="format-detection" content="telephone=no,email=no,address=no" />
    <!-- Trang đơn hàng: không cho công cụ tìm kiếm lập chỉ mục, URL luôn kèm
         mã thiệp của một người cụ thể. -->
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="../assets/icons/favicon.png" />
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8"
      integrity="sha384-Tve8O+C6PBzsIMK/IRCwHbi8fyEzXIlIs6OfVBZHubplwYhaQF/4Mzxqgg+pp/oy"
      crossorigin="anonymous"
    ></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/build.css" />
    <script src="../core/helpers/no-zoom.js"></script>
    <script src="../core/helpers/no-inspect.js"></script>
  </head>
  <!-- Lề đáy chừa DẢI TRẢ TIỀN ghim đáy màn ở khổ điện thoại (#payment-paybar,
       xem .cx-paybar-pin). Số ở đây chỉ là bản dự phòng cho lúc trang chưa dựng
       xong: _pinPaybar đo chiều cao dải thật rồi đặt đè lên. Từ md dải nằm
       trong luồng nên không cần chừa.
       Lề trên chừa thanh nav nổi (từ md), cùng công thức với my-invitations. -->
  <body
    class="cx-checkout-bg font-inter text-gray-800 min-h-screen pb-[192px] md:pb-0 md:pt-20"
  >
    <main class="max-w-[560px] mx-auto px-4 py-6">
      <!-- Nút quay lại ghim góc trên trái THẺ, cùng dáng nút đóng góc phải của
           hộp thoại thanh toán. Nằm ngoài #checkout-root vì mount() ghi đè ruột
           khối đó; nó ngang hàng dòng "Thanh toán đơn hàng" (.cx-ord-kicker). -->
      <div class="relative">
      <x-button id="checkout-back" variant="outline" size="sm" icon-only onclick="PaymentModal.close()" class="absolute top-4 left-4 z-20" aria-label="Quay lại">
        <i data-lucide="arrow-left" class="text-gray-400" style="width:16px;height:16px"></i>
      </x-button>

      <div id="checkout-root" class="cx-ord-sheet bg-white overflow-hidden">
        <!-- PaymentModal.mount() dựng ba bước vào đây, ghi đè cả khối này. Chưa
             dựng xong thì đây là khung xương của bước 1 (mount() nằm ở CUỐI
             trang, sau một dãy script chặn) và cũng là chỗ báo lỗi thiếu tham
             số — xem script cuối trang. Khổ từng mảng bám theo markup thật ở
             _stepsHTML (core/payment.js): đổi bố cục bước 1 thì sửa cả đây. -->
        <div class="animate-pulse">
          <!-- Dòng "Thanh toán đơn hàng" + thanh ba bước (#payment-steps) -->
          <div class="flex justify-center px-12 pt-6">
            <div class="h-4 w-32 rounded bg-gray-100"></div>
          </div>
          <div class="flex justify-center px-6 pt-3">
            <div class="h-5 w-56 rounded-full bg-gray-100"></div>
          </div>
          <!-- Thẻ thiệp (.cx-ord-item): ảnh 96x128 + tên cặp đôi + hai dòng phụ -->
          <div class="px-6 pt-5 pb-6">
            <div class="flex gap-4 rounded-[20px] border border-gray-100 p-3">
              <div class="h-32 w-24 shrink-0 rounded-xl bg-gray-100"></div>
              <div class="min-w-0 flex-1 space-y-2 py-1">
                <div class="h-5 w-3/4 rounded bg-gray-100"></div>
                <div class="h-3 w-1/2 rounded bg-gray-100"></div>
                <div class="h-3 w-2/3 rounded bg-gray-100"></div>
              </div>
            </div>
          </div>
          <!-- Người mua: nhãn + ô avatar 40 + tên/email -->
          <div class="px-6 pb-5">
            <div class="mb-2 h-3 w-20 rounded bg-gray-100"></div>
            <div class="flex items-center gap-3 rounded-2xl bg-gray-50 px-4 py-3">
              <div class="h-10 w-10 shrink-0 rounded-full bg-gray-100"></div>
              <div class="min-w-0 flex-1 space-y-2">
                <div class="h-3.5 w-1/3 rounded bg-gray-100"></div>
                <div class="h-3 w-1/2 rounded bg-gray-100"></div>
              </div>
            </div>
          </div>
          <!-- Chi tiết thanh toán: nhãn + dòng giá + ô mã giảm giá -->
          <div class="px-6 pb-6">
            <div class="mb-2 h-3 w-32 rounded bg-gray-100"></div>
            <div class="flex items-center justify-between">
              <div class="h-3.5 w-24 rounded bg-gray-100"></div>
              <div class="h-3.5 w-20 rounded bg-gray-100"></div>
            </div>
            <div class="mt-4 h-12 w-full rounded-xl bg-gray-100"></div>
          </div>
          <!-- Dải trả tiền: nút lớn full -->
          <div class="border-t border-gray-100 px-6 pt-5 pb-6">
            <div class="h-12 w-full rounded-full bg-gray-100"></div>
          </div>
        </div>
      </div>
      </div>
    </main>

    <script src="https://unpkg.com/lucide@1.26.0/dist/umd/lucide.min.js" integrity="sha384-8/6sFI5UzGbr1Dgef7WSZvE4UemcVc/jyaQNsM+MilmnHQ9sce/pRv86XXj5Cg5m" crossorigin="anonymous"></script>
    <!-- lucide UMD không tự chạy: quét [data-lucide] một lượt khi DOM sẵn sàng.
         Markup chèn động sau đó phải tự gọi lucide.createIcons({ root }) tại chỗ chèn. -->
    <script>
      document.addEventListener("DOMContentLoaded", () => window.lucide?.createIcons());
    </script>
    <script src="../core/x-button.js"></script>
    <script src="../core/x-logo.js"></script>
    <script src="../core/x-input.js"></script>
    <script src="../core/x-popover.js"></script>
    <script src="../core/helpers/account-menu.js"></script>
    <!-- Navbar dùng chung, nhưng KHÔNG dựng thanh tab dưới (tabbar: false):
         thanh toán là luồng một chiều, dải đáy dành cho nút trả tiền và bốn
         mục điều hướng ở đó chỉ mời khách rời luồng. Thanh trên (từ md) vẫn
         giữ, mở ở mục "Đã chọn" — thanh toán là chặng nối tiếp của màn quản lý
         thiệp, và "Quay lại" cũng trở về đó. -->
    <!-- auth.js TRƯỚC navbar: navbar vẽ nhãn/mục theo phiên ngay lần đầu, khỏi nháy. -->
    <script src="../core/auth.js"></script>
    <script src="../core/components/navbar.js"></script>
    <script>
      CXNavbar.mount({
        active: "cart",
        tabbar: false,
        items: [
          { id: "home", label: "Trang chủ", icon: "home", href: "/" },
          {
            id: "templates",
            label: "Mẫu thiệp",
            icon: "layers",
            href: "/theme-template/",
          },
          {
            id: "cart",
            label: "Đã chọn",
            loginLabel: "Thiệp của tôi",
            icon: "cart",
            href: "/my-invitations/",
            count: true,
          },
          { id: "guests", label: "Khách mời", icon: "users", href: "/guest-list/", login: true },
          {
            id: "account",
            label: "Tài khoản",
            icon: "user",
            onClick: "CXAccount.open(this)",
            pin: true,
          },
        ],
      });
      CXAccount.mountChip();
    </script>
    <script src="../core/cache-util.js"></script>
    <script src="../core/dal/templates-dal.js"></script>
    <script src="../core/config.js"></script>
    <script src="../core/helpers/alert.js"></script>
    <script src="../core/utils.js"></script>
    <script src="../core/auth-ui.js"></script>
    <!-- DAL/BL phải đứng TRƯỚC supabase.js: file đó dựng sẵn weddingDAL/weddingBL
         ngay khi nạp, thiếu là "WeddingDAL is not defined". -->
    <script src="../core/dal/wedding-dal.js"></script>
    <script src="../core/dal/storage-dal.js"></script>
    <script src="../core/bl/wedding-bl.js"></script>
    <script src="../core/bl/image-bl.js"></script>
    <script src="../core/supabase.js"></script>
    <script src="../core/payment.js"></script>
    <script>
      // Đơn hàng đi bằng QUERY STRING, không phải sessionStorage: khách tải lại
      // trang hay mở lại từ lịch sử vẫn ra đúng đơn đó.
      //   id       manage_id của thiệp (bỏ trống = mua mẫu mới từ trang chủ)
      //   theme    tên thư mục mẫu
      //   name     tên hiển thị của mẫu
      //   price / original  giá (đồng); thiếu thì payment.js dùng giá mặc định
      (function initCheckout() {
        const q = new URLSearchParams(location.search);
        const theme = q.get("theme");
        const name = q.get("name") || "Thiệp cưới";
        if (!theme) {
          document.getElementById("checkout-root").innerHTML =
            '<div class="p-10 text-center"><p class="text-sm text-gray-500 m-0">' +
            "Thiếu thông tin đơn hàng." +
            '</p><a href="/my-invitations/" class="text-sm font-semibold underline">Về danh sách thiệp</a></div>';
          return;
        }
        const pricing = {};
        if (q.get("price")) pricing.price = Number(q.get("price"));
        if (q.get("original")) pricing.originalPrice = Number(q.get("original"));

        PaymentModal.mount("#checkout-root", {
          templateName: name,
          theme,
          pricing,
          manageId: q.get("id") || null,
        });
      })();
    </script>
    <!-- Ô đếm của mục "Đã chọn" ở navbar (đọc cache, không gọi API). -->
    <script src="../core/helpers/nav-cart-count.js"></script>
  </body>
</html>
