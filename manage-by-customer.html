<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý Thiệp Cưới</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
            },
            animation: {
              "fade-in": "fadeIn 0.3s ease-out",
            },
            keyframes: {
              fadeIn: {
                "0%": { opacity: "0", transform: "translateY(10px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
            },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    class="min-h-screen bg-gradient-to-br from-slate-50 via-white to-slate-100"
  >
    <!-- Header -->
    <div
      class="bg-white/80 backdrop-blur-md border-b border-gray-100 px-4 py-5 sticky top-0 z-50 shadow-sm"
    >
      <div class="max-w-4xl mx-auto flex items-center justify-between">
        <div>
          <h1
            class="text-xl font-bold bg-gradient-to-r from-rose-500 to-pink-500 bg-clip-text text-transparent"
          >
            💒 Thiệp Cưới Online
          </h1>
          <p class="text-xs text-gray-500 mt-0.5" id="wedding-id-label"></p>
        </div>
        <button
          onclick="saveAll()"
          id="save-btn"
          class="bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 text-white px-6 py-2.5 rounded-xl text-sm font-semibold transition-all shadow-md hover:shadow-lg"
        >
          💾 Lưu
        </button>
      </div>
    </div>

    <div class="max-w-4xl mx-auto px-4 py-8 pb-24">
      <!-- Link thiệp -->
      <div
        class="bg-white rounded-3xl shadow-md border border-gray-100 p-6 mb-6 animate-fade-in"
      >
        <div class="flex items-center gap-2 mb-4">
          <span class="text-2xl">🔗</span>
          <p class="text-sm font-bold text-gray-800 uppercase tracking-wide">
            Link thiệp cưới của bạn
          </p>
        </div>
        <div class="flex flex-col gap-4">
          <div
            class="bg-gradient-to-br from-blue-50 to-cyan-50 rounded-2xl p-4 border border-blue-100"
          >
            <div class="flex items-center gap-2 mb-2">
              <span class="text-lg">🤵</span>
              <p class="text-sm font-semibold text-gray-700">
                Link nhà trai (Chú Rể)
              </p>
            </div>
            <div class="flex gap-2">
              <input
                id="link-groom"
                readonly
                class="flex-1 h-12 px-4 text-xs font-mono bg-white border border-gray-200 rounded-xl shadow-sm outline-none"
              />
              <button
                onclick="copyText('link-groom')"
                class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-xl text-xs font-medium transition-colors shadow-sm"
              >
                📋 Copy
              </button>
            </div>
          </div>
          <div
            class="bg-gradient-to-br from-pink-50 to-rose-50 rounded-2xl p-4 border border-pink-100"
          >
            <div class="flex items-center gap-2 mb-2">
              <span class="text-lg">👰</span>
              <p class="text-sm font-semibold text-gray-700">
                Link nhà gái (Cô Dâu)
              </p>
            </div>
            <div class="flex gap-2">
              <input
                id="link-bride"
                readonly
                class="flex-1 h-12 px-4 text-xs font-mono bg-white border border-gray-200 rounded-xl shadow-sm outline-none"
              />
              <button
                onclick="copyText('link-bride')"
                class="px-4 py-2 bg-pink-500 hover:bg-pink-600 text-white rounded-xl text-xs font-medium transition-colors shadow-sm"
              >
                📋 Copy
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Form -->
      <form id="wedding-form" class="flex flex-col gap-6">
        <!-- Hidden inputs to store uploaded image URLs -->
        <input type="hidden" name="cover_image_url" />
        <input type="hidden" name="groom_image_url" />
        <input type="hidden" name="bride_image_url" />
        <input type="hidden" name="groom_qr_url" />
        <input type="hidden" name="bride_qr_url" />
        <textarea name="gallery_images_raw" class="hidden"></textarea>

        <!-- THÔNG TIN CHUNG -->
        <div
          class="bg-white rounded-3xl shadow-md border border-gray-100 overflow-hidden animate-fade-in"
        >
          <div
            class="bg-gradient-to-r from-purple-50 to-pink-50 px-6 py-4 border-b border-gray-100"
          >
            <div class="flex items-center gap-2">
              <span class="text-2xl">💑</span>
              <p
                class="text-sm font-bold text-gray-800 uppercase tracking-wide"
              >
                Thông tin chung
              </p>
            </div>
          </div>
          <div class="p-6 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2"
                  >🤵 Tên Chú Rể</label
                >
                <input
                  name="groom_name"
                  placeholder="Nhập tên chú rể"
                  class="w-full h-14 px-4 border border-gray-200 rounded-2xl text-[15px] text-gray-800 bg-white shadow-sm outline-none transition-all duration-300 placeholder:text-gray-400 placeholder:text-sm focus:border-rose-500 focus:ring-4 focus:ring-rose-500/15"
                />
              </div>
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2"
                  >👰 Tên Cô Dâu</label
                >
                <input
                  name="bride_name"
                  placeholder="Nhập tên cô dâu"
                  class="w-full h-14 px-4 border border-gray-200 rounded-2xl text-[15px] text-gray-800 bg-white shadow-sm outline-none transition-all duration-300 placeholder:text-gray-400 placeholder:text-sm focus:border-rose-500 focus:ring-4 focus:ring-rose-500/15"
                />
              </div>
            </div>

            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-2"
                >💬 Câu quote (phía trên gallery)</label
              >
              <textarea
                name="story_quote"
                rows="3"
                placeholder="Nhập câu quote..."
                class="w-full px-4 py-3.5 border border-gray-200 rounded-2xl text-[15px] text-gray-800 bg-white shadow-sm outline-none transition-all duration-300 placeholder:text-gray-400 placeholder:text-sm focus:border-rose-500 focus:ring-4 focus:ring-rose-500/15 resize-none"
              ></textarea>
            </div>

            <!-- Upload ảnh cover -->
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-2"
                >📸 Ảnh chính (cover + Save The Date)</label
              >
              <div id="cover-container" class="w-full max-w-xs">
                <!-- Upload button will be rendered by JS -->
              </div>
              <input
                type="file"
                id="cover-file-input"
                accept="image/*"
                class="hidden"
                onchange="handleImageUpload(event, 'cover_image_url')"
              />
            </div>

            <!-- Upload gallery -->
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-2"
                >🖼️ Ảnh gallery (tối đa 7 ảnh)</label
              >
              <div id="gallery-container" class="grid grid-cols-4 gap-3">
                <!-- Upload button will be inserted here by JS -->
              </div>
              <input
                type="file"
                id="gallery-file-input"
                accept="image/*"
                multiple
                class="hidden"
                onchange="handleGalleryUpload(event)"
              />
            </div>
          </div>
        </div>

        <!-- LỄ THÀNH HÔN (CHUNG) -->
        <div
          class="bg-white rounded-3xl shadow-md border border-gray-100 overflow-hidden animate-fade-in"
        >
          <div
            class="bg-gradient-to-r from-amber-50 to-yellow-50 px-6 py-4 border-b border-gray-100"
          >
            <div class="flex items-center gap-2">
              <span class="text-2xl">💒</span>
              <p
                class="text-sm font-bold text-gray-800 uppercase tracking-wide"
              >
                Lễ Thành Hôn
              </p>
            </div>
          </div>
          <div class="p-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2"
                  >📅 Ngày</label
                >
                <input
                  name="ceremony_date"
                  type="date"
                  class="w-full h-14 px-4 border border-gray-200 rounded-2xl text-[15px] text-gray-800 bg-white shadow-sm outline-none transition-all duration-300 focus:border-rose-500 focus:ring-4 focus:ring-rose-500/15"
                />
              </div>
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2"
                  >🕐 Giờ</label
                >
                <input
                  name="ceremony_time"
                  type="text"
                  placeholder="HH:MM (VD: 14:30)"
                  maxlength="5"
                  class="w-full h-14 px-4 border border-gray-200 rounded-2xl text-[15px] text-gray-800 bg-white shadow-sm outline-none transition-all duration-300 placeholder:text-gray-400 placeholder:text-sm focus:border-rose-500 focus:ring-4 focus:ring-rose-500/15"
                  onkeypress="return handleTimeInput(event);"
                  onblur="validateTimeFormat(this)"
                />
              </div>
            </div>
            <div class="mt-4">
              <label class="block text-sm font-semibold text-gray-700 mb-2"
                >🌙 Ngày âm lịch (để trống = tự tính)</label
              >
              <input
                name="ceremony_lunar"
                placeholder="Để trống để tự động tính"
                class="w-full h-14 px-4 border border-gray-200 rounded-2xl text-xs text-gray-800 bg-white shadow-sm outline-none transition-all duration-300 placeholder:text-gray-400 focus:border-rose-500 focus:ring-4 focus:ring-rose-500/15"
              />
            </div>
          </div>
        </div>

        <!-- THÔNG TIN NHÀ TRAI & NHÀ GÁI -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <!-- NHÀ TRAI -->
          <div
            class="bg-white rounded-3xl shadow-md border border-gray-100 animate-fade-in"
          >
            <div
              class="bg-gradient-to-r from-blue-50 to-cyan-50 px-6 py-4 border-b border-gray-100 sticky top-[77px] z-40 rounded-t-3xl"
            >
              <div class="flex items-center gap-2">
                <span class="text-2xl">🤵</span>
                <p
                  class="text-sm font-bold text-gray-800 uppercase tracking-wide"
                >
                  Nhà Trai
                </p>
              </div>
            </div>
            <div class="p-6 space-y-6">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                  <label class="block text-sm font-semibold text-gray-700 mb-2"
                    >👨 Tên Bố</label
                  >
                  <input
                    name="groom_father"
                    placeholder="Nhập tên bố chú rể"
                    class="w-full h-14 px-4 border border-gray-200 rounded-2xl text-[15px] text-gray-800 bg-white shadow-sm outline-none transition-all duration-300 placeholder:text-gray-400 placeholder:text-sm focus:border-rose-500 focus:ring-4 focus:ring-rose-500/15"
                  />
                </div>
                <div>
                  <label class="block text-sm font-semibold text-gray-700 mb-2"
                    >👩 Tên Mẹ</label
                  >
                  <input
                    name="groom_mother"
                    placeholder="Nhập tên mẹ chú rể"
                    class="w-full h-14 px-4 border border-gray-200 rounded-2xl text-[15px] text-gray-800 bg-white shadow-sm outline-none transition-all duration-300 placeholder:text-gray-400 placeholder:text-sm focus:border-rose-500 focus:ring-4 focus:ring-rose-500/15"
                  />
                </div>
              </div>

              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2"
                  >🏠 Địa chỉ</label
                >
                <input
                  name="groom_address"
                  placeholder="Nhập địa chỉ nhà trai"
                  class="w-full h-14 px-4 border border-gray-200 rounded-2xl text-[15px] text-gray-800 bg-white shadow-sm outline-none transition-all duration-300 placeholder:text-gray-400 placeholder:text-sm focus:border-rose-500 focus:ring-4 focus:ring-rose-500/15"
                />
              </div>

              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2"
                  >📸 Ảnh Chú Rể (Mục thông tin gia đình)</label
                >
                <div id="groom-container" class="w-full max-w-xs">
                  <!-- Upload button will be rendered by JS -->
                </div>
                <input
                  type="file"
                  id="groom-file-input"
                  accept="image/*"
                  class="hidden"
                  onchange="handleImageUpload(event, 'groom_image_url')"
                />
              </div>

              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2"
                  >📊 URL Google Apps Script (DS khách mời nhà trai)</label
                >
                <input
                  name="groom_google_sheet_url"
                  placeholder="Nhập URL Google Apps Script..."
                  class="w-full h-14 px-4 border border-gray-200 rounded-2xl text-xs text-gray-800 bg-white shadow-sm outline-none transition-all duration-300 placeholder:text-gray-400 focus:border-rose-500 focus:ring-4 focus:ring-rose-500/15 font-mono"
                />
              </div>

              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2"
                  >🗺️ Google Maps Embed</label
                >
                <textarea
                  name="groom_map_embed_url"
                  rows="2"
                  placeholder="https://www.google.com/maps/embed?..."
                  class="w-full px-4 py-3.5 border border-gray-200 rounded-2xl text-xs text-gray-800 bg-white shadow-sm outline-none transition-all duration-300 placeholder:text-gray-400 focus:border-rose-500 focus:ring-4 focus:ring-rose-500/15 resize-none font-mono"
                ></textarea>
              </div>

              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2"
                  >🧭 Google Maps Link</label
                >
                <input
                  name="groom_map_link"
                  placeholder="Nhập URL Google Maps điều hướng..."
                  class="w-full h-14 px-4 border border-gray-200 rounded-2xl text-xs text-gray-800 bg-white shadow-sm outline-none transition-all duration-300 placeholder:text-gray-400 focus:border-rose-500 focus:ring-4 focus:ring-rose-500/15 font-mono"
                />
              </div>

              <div class="bg-green-50 rounded-2xl p-5 border border-green-100">
                <p class="text-sm font-semibold text-rose-800 mb-4">
                  🎉 Tiệc Cưới
                </p>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label
                      class="block text-sm font-semibold text-gray-700 mb-2"
                      >📅 Ngày</label
                    >
                    <input
                      name="groom_party_date"
                      type="date"
                      class="w-full h-14 px-4 border border-gray-200 rounded-2xl text-[15px] text-gray-800 bg-white shadow-sm outline-none transition-all duration-300 focus:border-rose-500 focus:ring-4 focus:ring-rose-500/15"
                    />
                  </div>
                  <div>
                    <label
                      class="block text-sm font-semibold text-gray-700 mb-2"
                      >🕐 Giờ</label
                    >
                    <input
                      name="groom_party_time"
                      type="text"
                      placeholder="HH:MM (VD: 14:30)"
                      maxlength="5"
                      class="w-full h-14 px-4 border border-gray-200 rounded-2xl text-[15px] text-gray-800 bg-white shadow-sm outline-none transition-all duration-300 placeholder:text-gray-400 placeholder:text-sm focus:border-rose-500 focus:ring-4 focus:ring-rose-500/15"
                      onkeypress="return handleTimeInput(event);"
                      onblur="validateTimeFormat(this)"
                    />
                  </div>
                </div>
                <div class="mt-4">
                  <label class="block text-sm font-semibold text-gray-700 mb-2"
                    >🌙 Ngày âm lịch (để trống = tự tính)</label
                  >
                  <input
                    name="groom_party_lunar"
                    placeholder="Để trống để tự động tính"
                    class="w-full h-14 px-4 border border-gray-200 rounded-2xl text-xs text-gray-800 bg-white shadow-sm outline-none transition-all duration-300 placeholder:text-gray-400 focus:border-rose-500 focus:ring-4 focus:ring-rose-500/15"
                  />
                </div>
                <div class="mt-4">
                  <label class="block text-sm font-semibold text-gray-700 mb-2"
                    >📍 Địa điểm tiệc</label
                  >
                  <input
                    name="groom_party_location"
                    placeholder="Nhập địa điểm tiệc"
                    class="w-full h-14 px-4 border border-gray-200 rounded-2xl text-[15px] text-gray-800 bg-white shadow-sm outline-none transition-all duration-300 placeholder:text-gray-400 placeholder:text-sm focus:border-rose-500 focus:ring-4 focus:ring-rose-500/15"
                  />
                </div>
              </div>

              <div class="bg-rose-50 rounded-2xl p-5 border border-rose-100">
                <p class="text-sm font-semibold text-green-800 mb-4">
                  💰 Thông Tin Ngân Hàng
                </p>
                <div>
                  <label class="block text-sm font-semibold text-gray-700 mb-2"
                    >🏦 Tên ngân hàng</label
                  >
                  <input
                    name="groom_bank_name"
                    placeholder="Nhập tên ngân hàng"
                    class="w-full h-14 px-4 border border-gray-200 rounded-2xl text-[15px] text-gray-800 bg-white shadow-sm outline-none transition-all duration-300 placeholder:text-gray-400 placeholder:text-sm focus:border-rose-500 focus:ring-4 focus:ring-rose-500/15"
                  />
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                  <div>
                    <label
                      class="block text-sm font-semibold text-gray-700 mb-2"
                      >💳 Số tài khoản</label
                    >
                    <input
                      name="groom_bank_number"
                      placeholder="Nhập số tài khoản"
                      class="w-full h-14 px-4 border border-gray-200 rounded-2xl text-[15px] text-gray-800 bg-white shadow-sm outline-none transition-all duration-300 placeholder:text-gray-400 placeholder:text-sm focus:border-rose-500 focus:ring-4 focus:ring-rose-500/15 font-mono"
                    />
                  </div>
                  <div>
                    <label
                      class="block text-sm font-semibold text-gray-700 mb-2"
                      >👤 Tên chủ TK</label
                    >
                    <input
                      name="groom_bank_owner"
                      placeholder="Nhập tên chủ tài khoản"
                      class="w-full h-14 px-4 border border-gray-200 rounded-2xl text-[15px] text-gray-800 bg-white shadow-sm outline-none transition-all duration-300 placeholder:text-gray-400 placeholder:text-sm focus:border-rose-500 focus:ring-4 focus:ring-rose-500/15"
                    />
                  </div>
                </div>

                <div class="mt-4">
                  <label class="block text-sm font-semibold text-gray-700 mb-2"
                    >📱 Ảnh QR chuyển khoản</label
                  >
                  <div id="groom-qr-container" class="w-32">
                    <!-- Upload button will be rendered by JS -->
                  </div>
                  <input
                    type="file"
                    id="groom-qr-file-input"
                    accept="image/*"
                    class="hidden"
                    onchange="handleImageUpload(event, 'groom_qr_url')"
                  />
                </div>
              </div>
            </div>
          </div>

          <!-- NHÀ GÁI -->
          <div
            class="bg-white rounded-3xl shadow-md border border-gray-100 animate-fade-in"
          >
            <div
              class="bg-gradient-to-r from-pink-50 to-rose-50 px-6 py-4 border-b border-gray-100 sticky top-[77px] z-40 rounded-t-3xl"
            >
              <div class="flex items-center gap-2">
                <span class="text-2xl">👰</span>
                <p
                  class="text-sm font-bold text-gray-800 uppercase tracking-wide"
                >
                  Nhà Gái
                </p>
              </div>
            </div>
            <div class="p-6 space-y-6">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                  <label class="block text-sm font-semibold text-gray-700 mb-2"
                    >👨 Tên Bố</label
                  >
                  <input
                    name="bride_father"
                    placeholder="Nhập tên bố cô dâu"
                    class="w-full h-14 px-4 border border-gray-200 rounded-2xl text-[15px] text-gray-800 bg-white shadow-sm outline-none transition-all duration-300 placeholder:text-gray-400 placeholder:text-sm focus:border-rose-500 focus:ring-4 focus:ring-rose-500/15"
                  />
                </div>
                <div>
                  <label class="block text-sm font-semibold text-gray-700 mb-2"
                    >👩 Tên Mẹ</label
                  >
                  <input
                    name="bride_mother"
                    placeholder="Nhập tên mẹ cô dâu"
                    class="w-full h-14 px-4 border border-gray-200 rounded-2xl text-[15px] text-gray-800 bg-white shadow-sm outline-none transition-all duration-300 placeholder:text-gray-400 placeholder:text-sm focus:border-rose-500 focus:ring-4 focus:ring-rose-500/15"
                  />
                </div>
              </div>

              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2"
                  >🏠 Địa chỉ</label
                >
                <input
                  name="bride_address"
                  placeholder="Nhập địa chỉ nhà gái"
                  class="w-full h-14 px-4 border border-gray-200 rounded-2xl text-[15px] text-gray-800 bg-white shadow-sm outline-none transition-all duration-300 placeholder:text-gray-400 placeholder:text-sm focus:border-rose-500 focus:ring-4 focus:ring-rose-500/15"
                />
              </div>

              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2"
                  >📸 Ảnh Cô Dâu (Mục thông tin gia đình)</label
                >
                <div id="bride-container" class="w-full max-w-xs">
                  <!-- Upload button will be rendered by JS -->
                </div>
                <input
                  type="file"
                  id="bride-file-input"
                  accept="image/*"
                  class="hidden"
                  onchange="handleImageUpload(event, 'bride_image_url')"
                />
              </div>

              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2"
                  >📊 URL Google Apps Script (DS khách mời nhà gái)</label
                >
                <input
                  name="bride_google_sheet_url"
                  placeholder="Nhập URL Google Apps Script..."
                  class="w-full h-14 px-4 border border-gray-200 rounded-2xl text-xs text-gray-800 bg-white shadow-sm outline-none transition-all duration-300 placeholder:text-gray-400 focus:border-rose-500 focus:ring-4 focus:ring-rose-500/15 font-mono"
                />
              </div>

              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2"
                  >🗺️ Google Maps Embed</label
                >
                <textarea
                  name="bride_map_embed_url"
                  rows="2"
                  placeholder="https://www.google.com/maps/embed?..."
                  class="w-full px-4 py-3.5 border border-gray-200 rounded-2xl text-xs text-gray-800 bg-white shadow-sm outline-none transition-all duration-300 placeholder:text-gray-400 focus:border-rose-500 focus:ring-4 focus:ring-rose-500/15 resize-none font-mono"
                ></textarea>
              </div>

              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2"
                  >🧭 Google Maps Link</label
                >
                <input
                  name="bride_map_link"
                  placeholder="https://maps.google.com/?q=..."
                  class="w-full h-14 px-4 border border-gray-200 rounded-2xl text-xs text-gray-800 bg-white shadow-sm outline-none transition-all duration-300 placeholder:text-gray-400 focus:border-rose-500 focus:ring-4 focus:ring-rose-500/15 font-mono"
                />
              </div>

              <div class="bg-green-50 rounded-2xl p-5 border border-green-100">
                <p class="text-sm font-semibold text-rose-800 mb-4">
                  🎉 Tiệc Cưới
                </p>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label
                      class="block text-sm font-semibold text-gray-700 mb-2"
                      >📅 Ngày</label
                    >
                    <input
                      name="bride_party_date"
                      type="date"
                      class="w-full h-14 px-4 border border-gray-200 rounded-2xl text-[15px] text-gray-800 bg-white shadow-sm outline-none transition-all duration-300 focus:border-rose-500 focus:ring-4 focus:ring-rose-500/15"
                    />
                  </div>
                  <div>
                    <label
                      class="block text-sm font-semibold text-gray-700 mb-2"
                      >🕐 Giờ</label
                    >
                    <input
                      name="bride_party_time"
                      type="text"
                      placeholder="HH:MM (VD: 14:30)"
                      maxlength="5"
                      class="w-full h-14 px-4 border border-gray-200 rounded-2xl text-[15px] text-gray-800 bg-white shadow-sm outline-none transition-all duration-300 placeholder:text-gray-400 placeholder:text-sm focus:border-rose-500 focus:ring-4 focus:ring-rose-500/15"
                      onkeypress="return handleTimeInput(event);"
                      onblur="validateTimeFormat(this)"
                    />
                  </div>
                </div>
                <div class="mt-4">
                  <label class="block text-sm font-semibold text-gray-700 mb-2"
                    >🌙 Ngày âm lịch (để trống = tự tính)</label
                  >
                  <input
                    name="bride_party_lunar"
                    placeholder="Để trống để tự động tính"
                    class="w-full h-14 px-4 border border-gray-200 rounded-2xl text-xs text-gray-800 bg-white shadow-sm outline-none transition-all duration-300 placeholder:text-gray-400 focus:border-rose-500 focus:ring-4 focus:ring-rose-500/15"
                  />
                </div>
                <div class="mt-4">
                  <label class="block text-sm font-semibold text-gray-700 mb-2"
                    >📍 Địa điểm tiệc</label
                  >
                  <input
                    name="bride_party_location"
                    placeholder="Nhập địa điểm tiệc"
                    class="w-full h-14 px-4 border border-gray-200 rounded-2xl text-[15px] text-gray-800 bg-white shadow-sm outline-none transition-all duration-300 placeholder:text-gray-400 placeholder:text-sm focus:border-rose-500 focus:ring-4 focus:ring-rose-500/15"
                  />
                </div>
              </div>

              <div class="bg-green-50 rounded-2xl p-5 border border-green-100">
                <p class="text-sm font-semibold text-green-800 mb-4">
                  💰 Thông Tin Ngân Hàng
                </p>
                <div>
                  <label class="block text-sm font-semibold text-gray-700 mb-2"
                    >🏦 Tên ngân hàng</label
                  >
                  <input
                    name="bride_bank_name"
                    placeholder="BIDV"
                    class="w-full h-14 px-4 border border-gray-200 rounded-2xl text-[15px] text-gray-800 bg-white shadow-sm outline-none transition-all duration-300 placeholder:text-gray-400 placeholder:text-sm focus:border-rose-500 focus:ring-4 focus:ring-rose-500/15"
                  />
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                  <div>
                    <label
                      class="block text-sm font-semibold text-gray-700 mb-2"
                      >💳 Số tài khoản</label
                    >
                    <input
                      name="bride_bank_number"
                      placeholder="8787867778"
                      class="w-full h-14 px-4 border border-gray-200 rounded-2xl text-[15px] text-gray-800 bg-white shadow-sm outline-none transition-all duration-300 placeholder:text-gray-400 placeholder:text-sm focus:border-rose-500 focus:ring-4 focus:ring-rose-500/15 font-mono"
                    />
                  </div>
                  <div>
                    <label
                      class="block text-sm font-semibold text-gray-700 mb-2"
                      >👤 Tên chủ TK</label
                    >
                    <input
                      name="bride_bank_owner"
                      placeholder="Trần Thùy Hằng"
                      class="w-full h-14 px-4 border border-gray-200 rounded-2xl text-[15px] text-gray-800 bg-white shadow-sm outline-none transition-all duration-300 placeholder:text-gray-400 placeholder:text-sm focus:border-rose-500 focus:ring-4 focus:ring-rose-500/15"
                    />
                  </div>
                </div>

                <div class="mt-4">
                  <label class="block text-sm font-semibold text-gray-700 mb-2"
                    >📱 Ảnh QR chuyển khoản</label
                  >
                  <div id="bride-qr-container" class="w-32">
                    <!-- Upload button will be rendered by JS -->
                  </div>
                  <input
                    type="file"
                    id="bride-qr-file-input"
                    accept="image/*"
                    class="hidden"
                    onchange="handleImageUpload(event, 'bride_qr_url')"
                  />
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- END THÔNG TIN NHÀ TRAI & NHÀ GÁI -->
      </form>

      <!-- Toast -->
      <div
        id="toast"
        class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-2xl text-sm font-medium opacity-0 transition-all duration-300 pointer-events-none shadow-2xl z-50"
      >
        <span id="toast-text">Đã lưu thành công!</span>
      </div>

      <!-- Loading Overlay -->
      <div
        id="loading-overlay"
        class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden items-center justify-center"
      >
        <div class="bg-white rounded-2xl p-8 text-center shadow-2xl">
          <div
            class="inline-block w-12 h-12 border-4 border-rose-500 border-t-transparent rounded-full animate-spin mb-4"
          ></div>
          <p class="text-gray-700 font-medium" id="loading-message">
            Đang xử lý...
          </p>
          <p class="text-xs text-gray-500 mt-1" id="upload-progress">0%</p>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="manage-customer.js"></script>
  </body>
</html>
